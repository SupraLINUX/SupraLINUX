name: Temporary Batch 1 validator fix

on:
  push:
    branches: [tmp-batch1-closure]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tmp-batch1-closure
      - name: Correct KCodecs semantic checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/validate_kde_tier1_package_batch1.py')
          text = p.read_text(encoding='utf-8')
          old1 = 'toolchain_lines = [line for line in symbols.splitlines() if line.startswith("(optional=toolchain)")]'
          new1 = 'toolchain_lines = [line.strip() for line in symbols.splitlines() if line.strip().startswith("(optional=toolchain)")]'
          old2 = 'require(rules.index("cp debian/libkf6codecs6.symbols.supralinux") < rules.index("dh_makeshlibs"), "KCodecs reviewed symbols must be installed before dh_makeshlibs")'
          new2 = 'copy_pos = rules.index("cp debian/libkf6codecs6.symbols.supralinux")\ninvoke_pos = rules.index("\\tdh_makeshlibs", copy_pos)\nrequire(copy_pos < invoke_pos, "KCodecs reviewed symbols must be installed before dh_makeshlibs")'
          if old1 not in text or old2 not in text:
              raise SystemExit('expected validator expressions not found')
          p.write_text(text.replace(old1, new1).replace(old2, new2), encoding='utf-8')
          PY
          python3 -m py_compile scripts/validate_kde_tier1_package_batch1.py
          git config user.name 'SupraLINUX CI'
          git config user.email 'ci@supralinux.invalid'
          git add scripts/validate_kde_tier1_package_batch1.py
          git commit -m 'tmp: correct KCodecs closure validation'
          git push origin HEAD:tmp-batch1-closure

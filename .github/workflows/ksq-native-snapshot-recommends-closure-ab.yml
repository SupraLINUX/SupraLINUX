name: Aurora KSQ native snapshot Recommends closure A/B

on:
  push:
    branches:
      - feature/kde-stack-qualification
    paths:
      - '.github/workflows/ksq-native-snapshot-recommends-closure-ab.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-recommends-closure-ab:
    runs-on: ubuntu-26.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: Qualify clean native Resolute host
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^VERSION_ID="26\.04(\.1)?"$' /etc/os-release
          test "$(dpkg --print-architecture)" = amd64
          mkdir -p build/ksq-snapshot-recommends-ab
          {
            echo AURORA_NATIVE_DOCKER_USED=0
            echo AURORA_NATIVE_CUSTOM_APPARMOR_USED=0
            echo AURORA_NATIVE_UIDMAP_FILECAP_PATCH_USED=0
            apt-get --version | head -n1 | sed 's/^/AURORA_NATIVE_APT=/'
          } | tee build/ksq-snapshot-recommends-ab/host.env
          sudo apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            ca-certificates curl unzip ubuntu-keyring python3

      - name: Retrieve exact historical closure evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/evidence"
          mkdir -p "$out/ksq0" "$out/old-size"
          curl --fail --location --retry 5 --retry-all-errors \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/SupraLINUX/SupraLINUX/actions/artifacts/9708738867/zip' \
            -o "$out/ksq0.zip"
          curl --fail --location --retry 5 --retry-all-errors \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/SupraLINUX/SupraLINUX/actions/artifacts/9781553137/zip' \
            -o "$out/old-size.zip"
          test "$(sha256sum "$out/ksq0.zip" | awk '{print $1}')" = 5b23140181ea7e7931cb744f4c43930adba8f79e446c52d0f4b1c3c568106d50
          test "$(sha256sum "$out/old-size.zip" | awk '{print $1}')" = 39672453ba364d81cfa8621cd060201f845a6d940fb4ac04d45aa25be1ce0e19
          unzip -q "$out/ksq0.zip" -d "$out/ksq0"
          unzip -q "$out/old-size.zip" -d "$out/old-size"
          test -s "$out/ksq0/build/ksq-0/ubuntu-satisfied-build-deps.tsv"
          test -s "$out/old-size/binary-print-uris.txt"
          grep -qx 'AURORA_KSQ_0_APT_SNAPSHOT=20260829T022000Z' "$out/ksq0/build/ksq-0/closure-status.env"
          grep -qx 'AURORA_KSQ_0_CLOSURE_STATUS=COMPLETE' "$out/ksq0/build/ksq-0/closure-status.env"

      - name: Resolve default and explicit no-Recommends closures natively
        shell: bash
        run: |
          set -euo pipefail
          snapshot=20260829T022000Z
          root="$RUNNER_TEMP/apt-isolated"
          evidence="$RUNNER_TEMP/evidence"
          out=build/ksq-snapshot-recommends-ab
          mkdir -p "$root/lists/partial" "$root/archives/partial" "$root/sources.list.d"
          : > "$root/status"
          : > "$root/sources.list"
          cat > "$root/sources.list.d/ubuntu.sources" <<SOURCES
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu
          Suites: resolute resolute-updates resolute-backports
          Components: main universe restricted multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          Snapshot: ${snapshot}

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu
          Suites: resolute-security
          Components: main universe restricted multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          Snapshot: ${snapshot}
          SOURCES

          # Aurora 1.0 is a generic amd64 product baseline. Architecture variants
          # are an opt-in optimization and must not make qualification host-dependent.
          apt_opts=(
            -o APT::Architecture-Variants=
            -o "Dir::Etc::sourcelist=$root/sources.list"
            -o "Dir::Etc::sourceparts=$root/sources.list.d"
            -o "Dir::State::lists=$root/lists"
            -o "Dir::State::status=$root/status"
            -o "Dir::Cache::archives=$root/archives"
            -o APT::Get::List-Cleanup=0
            -o APT::Sandbox::User=root
          )

          apt-config -o APT::Architecture-Variants= dump \
            | grep -E '^(APT::Architecture|APT::Architectures|APT::Architecture-Variants|APT::Install-Recommends|APT::Install-Suggests)' \
            | tee "$out/apt-policy.txt" || true

          sudo apt-get "${apt_opts[@]}" \
            -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update \
            2>&1 | tee "$out/apt-update.log"

          awk -F '\t' 'NR>1 {
            pkg=$4; n=split($7,a," "); ver=""
            for(i=1;i<=n;i++) if(index(a[i],pkg "=")==1) {ver=substr(a[i],length(pkg)+2); break}
            if(ver=="") {print "missing certified version for " pkg > "/dev/stderr"; exit 2}
            print pkg "\t" ver
          }' "$evidence/ksq0/build/ksq-0/ubuntu-satisfied-build-deps.tsv" \
            | sort -u > "$out/certified-binary-seeds.tsv"
          test "$(wc -l < "$out/certified-binary-seeds.tsv")" -eq 244

          # Diagnostic only. Exact version pins plus the object-list identity gate
          # below are authoritative for this A/B proof.
          : > "$out/candidate-verification.tsv"
          : > "$out/candidate-anomalies.tsv"
          while IFS=$'\t' read -r pkg expected; do
            set +e
            policy="$(apt-cache "${apt_opts[@]}" policy "$pkg" 2>&1)"
            policy_rc=$?
            set -e
            candidate="$(printf '%s\n' "$policy" | awk '/Candidate:/ {print $2; exit}')"
            printf '%s\t%s\t%s\t%s\n' "$pkg" "$expected" "${candidate:-NONE}" "$policy_rc" >> "$out/candidate-verification.tsv"
            if [[ "$policy_rc" -ne 0 || "$candidate" != "$expected" ]]; then
              printf '%s\t%s\t%s\t%s\n' "$pkg" "$expected" "${candidate:-NONE}" "$policy_rc" >> "$out/candidate-anomalies.tsv"
              printf '%s\n' "$policy" >> "$out/candidate-anomalies.log"
            fi
          done < "$out/certified-binary-seeds.tsv"

          mapfile -t seeds < <(awk -F '\t' '{print $1 "=" $2}' "$out/certified-binary-seeds.tsv")
          roots=('?essential' apt build-essential ca-certificates ubuntu-keyring sudo sbuild mmdebstrap uidmap zstd devscripts dpkg-dev apt-utils gzip xz-utils diffutils libcap2-bin)
          roots+=("${seeds[@]}")

          sudo apt-get "${apt_opts[@]}" --print-uris --yes install "${roots[@]}" \
            > "$out/default-print-uris.txt" 2> "$out/default-resolve.stderr"
          sudo apt-get "${apt_opts[@]}" --no-install-recommends --print-uris --yes install "${roots[@]}" \
            > "$out/no-recommends-print-uris.txt" 2> "$out/no-recommends-resolve.stderr"

          # Preserve a direct package-relationship diagnostic without making a
          # formatting-sensitive apt-cache parser part of the main proof gate.
          apt-cache "${apt_opts[@]}" depends pipewire-bin \
            > "$out/pipewire-bin-depends.txt" 2> "$out/pipewire-bin-depends.stderr" || true

          if grep -q '_amd64v3\.deb' "$out/default-print-uris.txt" "$out/no-recommends-print-uris.txt"; then
            echo AURORA_KSQ_RECOMMENDS_AB_FAILURE=architecture-variant-leaked >&2
            exit 1
          fi

      - name: Canonicalize and prove causal delta
        shell: bash
        run: |
          set -euo pipefail
          snapshot=20260829T022000Z
          evidence="$RUNNER_TEMP/evidence"
          out=build/ksq-snapshot-recommends-ab

          python3 - "$snapshot" \
            "$evidence/old-size/binary-print-uris.txt" "$out/old.tsv" \
            "$out/no-recommends-print-uris.txt" "$out/no-recommends.tsv" \
            "$out/default-print-uris.txt" "$out/default.tsv" <<'PY'
          import shlex, sys
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          snapshot = sys.argv[1]
          marker = f"/ubuntu/{snapshot}/"
          for i in range(2, len(sys.argv), 2):
              src, dst = Path(sys.argv[i]), Path(sys.argv[i+1])
              rows = {}
              for raw in src.read_text().splitlines():
                  if not raw.startswith("'"):
                      continue
                  fields = shlex.split(raw)
                  if len(fields) < 3:
                      continue
                  url = fields[0]
                  size = int(fields[2])
                  path = unquote(urlparse(url).path)
                  if marker not in path:
                      raise SystemExit(f"snapshot marker absent: {url}")
                  rel = path.split(marker, 1)[1]
                  old = rows.get(rel)
                  if old is not None and old != size:
                      raise SystemExit(f"conflicting size: {rel}")
                  rows[rel] = size
              dst.write_text(''.join(f"{p}\t{rows[p]}\n" for p in sorted(rows)))
          PY

          # Decisive historical identity proof: the published 1541-object slice
          # was exactly the explicit no-Recommends generic-amd64 closure.
          cmp "$out/old.tsv" "$out/no-recommends.tsv"
          test "$(wc -l < "$out/old.tsv")" -eq 1541
          norec_bytes="$(awk -F '\t' '{s+=$2} END{printf "%.0f",s}' "$out/no-recommends.tsv")"
          test "$norec_bytes" = 704826504

          cut -f1 "$out/default.tsv" > "$out/default.paths"
          cut -f1 "$out/no-recommends.tsv" > "$out/no-recommends.paths"
          comm -23 "$out/default.paths" "$out/no-recommends.paths" > "$out/default-only.paths"
          comm -13 "$out/default.paths" "$out/no-recommends.paths" > "$out/no-recommends-only.paths"

          awk 'NR==FNR{s[$1]=$2; next} ($1 in s){bytes+=s[$1]; count++} END{printf "AURORA_KSQ_RECOMMENDS_DEFAULT_ONLY_OBJECTS=%d\nAURORA_KSQ_RECOMMENDS_DEFAULT_ONLY_BYTES=%.0f\n",count,bytes}' \
            "$out/default.tsv" "$out/default-only.paths" > "$out/default-delta.env"
          awk 'NR==FNR{s[$1]=$2; next} ($1 in s){bytes+=s[$1]; count++} END{printf "AURORA_KSQ_RECOMMENDS_NORECOMMENDS_ONLY_OBJECTS=%d\nAURORA_KSQ_RECOMMENDS_NORECOMMENDS_ONLY_BYTES=%.0f\n",count,bytes}' \
            "$out/no-recommends.tsv" "$out/no-recommends-only.paths" > "$out/no-recommends-delta.env"

          default_count="$(wc -l < "$out/default.tsv")"
          norec_count="$(wc -l < "$out/no-recommends.tsv")"
          default_bytes="$(awk -F '\t' '{s+=$2} END{printf "%.0f",s}' "$out/default.tsv")"
          {
            echo AURORA_KSQ_RECOMMENDS_AB_STATUS=PASS
            echo AURORA_KSQ_RECOMMENDS_SNAPSHOT=$snapshot
            echo AURORA_KSQ_RECOMMENDS_ARCH_BASELINE=amd64
            echo AURORA_KSQ_RECOMMENDS_ARCH_VARIANTS=disabled
            echo AURORA_KSQ_RECOMMENDS_OLD_EQUALS_EXPLICIT_NORECOMMENDS=1
            echo AURORA_KSQ_RECOMMENDS_NORECOMMENDS_OBJECTS=$norec_count
            echo AURORA_KSQ_RECOMMENDS_NORECOMMENDS_BYTES=$norec_bytes
            echo AURORA_KSQ_RECOMMENDS_DEFAULT_OBJECTS=$default_count
            echo AURORA_KSQ_RECOMMENDS_DEFAULT_BYTES=$default_bytes
            cat "$out/default-delta.env"
            cat "$out/no-recommends-delta.env"
          } | tee "$out/results.env"

          dbus='pool/main/d/dbus/dbus-user-session_1.16.2-2ubuntu4_amd64.deb'
          grep -qx "$dbus" "$out/default.paths"
          ! grep -qx "$dbus" "$out/no-recommends.paths"
          grep -q '^APT::Install-Recommends "1";' "$out/apt-policy.txt"
          default_only="$(awk -F= '$1=="AURORA_KSQ_RECOMMENDS_DEFAULT_ONLY_OBJECTS"{print $2}' "$out/default-delta.env")"
          test "$default_only" -gt 0

      - name: Preserve A/B evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-native-snapshot-recommends-closure-ab
          path: build/ksq-snapshot-recommends-ab/
          if-no-files-found: error
          retention-days: 30

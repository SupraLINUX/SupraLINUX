name: Repository policy

on:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate architecture manifest
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Ubuntu policy tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apparmor gnupg
          sudo apt-get install -y --no-install-recommends shellcheck autopkgtest
          shellcheck --version
          gpgv --version | head -1

      - name: Validate source syntax
        run: python3 scripts/check-source-syntax.py

      - name: Test targeted historical policy decision
        run: python3 scripts/test-repository-policy-scope.py

      - name: Select historical evidence validation scope
        id: policy_scope
        env:
          POLICY_EVENT: ${{ github.event_name }}
          POLICY_ACTION: ${{ github.event.action }}
          POLICY_BEFORE: ${{ github.event.before }}
          POLICY_AFTER: ${{ github.event.after }}
          POLICY_BASE: ${{ github.event.pull_request.base.sha }}
          POLICY_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/plan-repository-policy.py --github-output "$GITHUB_OUTPUT"

      - name: Test CI preflight regressions
        run: python3 scripts/test-ci-preflight.py

      - name: Test hosted KVM probe boundaries
        run: python3 scripts/test-hosted-kvm-probe.py

      - name: Test hosted Ubuntu guest snapshot boundaries
        run: python3 scripts/test-hosted-ubuntu-guest-snapshot.py

      - name: Validate reviewed Plasma package inputs
        run: python3 scripts/validate_plasma_package_build.py

      - name: Validate scoped package revalidation
        run: python3 scripts/validate_package_revalidation.py

      - name: Test current package contract scope
        run: python3 scripts/test-reviewed-package-contract.py

      - name: Test reviewed native fixture admission
        run: python3 scripts/test-native-fixture-review.py

      - name: Test desktop image planning boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-desktop-image-planner.py
          image_plan_tmp="$(mktemp -d)"
          trap 'rm -rf "${image_plan_tmp}"' EXIT
          python3 scripts/plan-desktop-image.py --profile manifests/desktop-image-profile.json --output "${image_plan_tmp}/plan.json"

      - name: Test historical preflight delivery recovery
        run: python3 scripts/test-preflight-delivery.py

      - name: Test interrupted package preflight retention
        run: python3 scripts/test-package-preflight-recovery.py

      - name: Test Plasma package input admission
        run: python3 scripts/test-plasma-package-inputs.py

      - name: Validate retained Frameworks support inputs
        run: python3 scripts/frameworks-support-inputs.py
      - name: Test retained Frameworks support evidence
        run: python3 scripts/test-frameworks-support-inputs.py
      - name: Test historical Frameworks source identities
        run: python3 scripts/test-frameworks-source-identities.py
      - name: Test Frameworks cache input admission
        run: python3 scripts/test-frameworks-cache-admission.py

      - name: Test supplementary predecessor admission
        run: python3 scripts/test-supplementary-package-inputs.py


      - name: Test transient GitHub read recovery
        run: python3 scripts/test-github-read-retry.py

      - name: Test canonical package artifact retention
        run: python3 scripts/test-package-artifact-retention.py

      - name: Test sealed evidence export recovery
        run: python3 scripts/test-plasma-evidence-export.py

      - name: Test immutable bare sbuild rootfs reuse
        run: python3 scripts/test-milestone-sbuild-rootfs.py

      - name: Test package evidence compaction
        run: python3 scripts/test-package-evidence-deduplication.py

      - name: Test KVM active-job monitor outage recovery
        run: python3 scripts/test-kvm-monitor-recovery.py

      - name: Test bridge-free KVM isolation and guest bandwidth policy
        run: |
          python3 scripts/test-kvm-network.py
          python3 scripts/check-kvm-network.py --evidence

      - name: Test scoped e1000e host repair contract
        run: python3 scripts/test-restore-kvm-host-network-safety.py

      - name: Test golden builder controlled network bootstrap

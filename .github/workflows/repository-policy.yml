        run: python3 scripts/render-project-status.py --check

      - name: Validate Plasma release signing key
        run: python3 scripts/run-kde-plasma-level0-materialization.py --check-signing-key

      - name: Lint shell scripts
        shell: bash
        run: shellcheck -e SC1091 scripts/*.sh

      - name: Validate autopkgtest unshare AppArmor profile
        shell: bash
        run: |
          set -euo pipefail
          sudo apparmor_parser -Q ops/apparmor/supralinux-autopkgtest-virt-unshare

name: Diagnostic infrastructure preflight

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    name: Certify diagnostic sbuild transport
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate preflight definition
        run: python3 scripts/validate_diagnostic_infrastructure_preflight.py

      - name: Run diagnostic infrastructure preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/run-diagnostic-infrastructure-preflight.sh

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnostic-infrastructure-preflight-${{ github.sha }}
          path: evidence/diagnostic-infrastructure-preflight/
          if-no-files-found: error
          retention-days: 90

name: Aurora KSQ-1 maintained local-slice range probe

on:
  push:
    branches:
      - feature/kde-stack-qualification
    paths:
      - '.github/workflows/ksq-1-local-range-probe.yml'
      - 'scripts/ci/restore-ksq-0-certified-evidence.py'
      - 'scripts/ci/prepare-ksq-1-local-apt-metadata.sh'
      - 'scripts/ci/prepare-ksq-1-local-build-environment.sh'
      - 'scripts/ci/prepare-ksq-1-local-runner.sh'
      - 'scripts/ci/run-ksq-1-local-range.sh'
      - 'scripts/ci/fetch-prepare-ksq-1-source.sh'
      - 'scripts/ci/build-ksq-1-range.sh'
      - 'scripts/ci/prepare-ksq-1-source.py'
      - 'scripts/ci/ksq-docker-builder.py'
      - 'scripts/ci/apparmor/supralinux-ksq-unshare'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  range-021-040:
    name: Prove maintained DAG range 021-040 on local slice
    runs-on: ubuntu-26.04
    timeout-minutes: 300

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Record and qualify hosted runner
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'VERSION_ID="26.04"' /etc/os-release
          mkdir -p build/ksq-1/host-evidence
          {
            cat /etc/os-release
            uname -a
            docker version
            env | grep -E '^(ImageOS|ImageVersion|RUNNER_ARCH|RUNNER_OS)=' | sort || true
          } > build/ksq-1/host-evidence/host.txt
          host_apt=(
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
            -o Dir::Etc::sourceparts=-
            -o APT::Get::List-Cleanup=0
          )
          sudo apt-get "${host_apt[@]}" -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update
          sudo apt-get "${host_apt[@]}" -o Acquire::Retries=5 install -y --no-install-recommends curl python3 ubuntu-keyring gpgv
          python3 -m py_compile \
            scripts/ci/ksq-snapshot-slice.py \
            scripts/ci/ksq-docker-builder.py \
            scripts/ci/restore-ksq-0-certified-evidence.py \
            scripts/ci/prepare-ksq-1-source.py
          sudo bash scripts/ci/install-ksq-apparmor-profile.sh | tee build/ksq-1/host-evidence/apparmor-load.txt
          sudo grep -qx 'supralinux-ksq-unshare (enforce)' /sys/kernel/security/apparmor/profiles

      - name: Download exact 001-020 checkpoint
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '9818465016'
          path: ${{ runner.temp }}/prior-001-020
          github-token: ${{ github.token }}
          repository: SupraLINUX/SupraLINUX
          run-id: '33546093974'
          digest-mismatch: error

      - name: Verify and restore 001-020 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          prior="$RUNNER_TEMP/prior-001-020"
          evidence="$prior/ksq-1/full/chunk-001-020/evidence"
          debs="$prior/ksq-1/full/chunk-001-020/new-debs"
          grep -qx 'AURORA_KSQ_1_RANGE_STATUS=PASS' "$evidence/range-status.env"
          grep -qx 'AURORA_KSQ_1_RANGE_FIRST_ORDER=1' "$evidence/range-status.env"
          grep -qx 'AURORA_KSQ_1_RANGE_LAST_ORDER=20' "$evidence/range-status.env"
          grep -qx 'AURORA_KSQ_1_RANGE_SOURCES=20' "$evidence/range-status.env"
          grep -qx 'AURORA_KSQ_1_RANGE_NEW_DEBS=103' "$evidence/range-status.env"
          [[ "$(sha256sum "$evidence/new-debs.sha256" | awk '{print $1}')" == b0be04014893808a79aaea514e2a5c4bc968b5c9c9769d8d7ea6cae7992b01f9 ]]
          [[ "$(sha256sum "$evidence/build-manifest.tsv" | awk '{print $1}')" == ff87f96c85bc4ba1553f16b3700cf701eca04e9b749a1c739bb1088cceb3485b ]]
          [[ "$(find "$debs" -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 103 ]]
          (cd "$debs" && sha256sum -c "$evidence/new-debs.sha256")
          mkdir -p build/ksq-1/full/debs
          cp -a "$debs"/*.deb build/ksq-1/full/debs/
          [[ "$(find build/ksq-1/full/debs -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 103 ]]
          cat > build/ksq-1/prior-checkpoint-001-020.env <<'EOF_CHECKPOINT'
          AURORA_KSQ_1_PRIOR_RUN_ID=33546093974
          AURORA_KSQ_1_PRIOR_ARTIFACT_ID=9818465016
          AURORA_KSQ_1_PRIOR_ARTIFACT_SHA256=0eb45c7938b84db35ee734591622a6c621709117100d29376c01323ca0ab14ba
          AURORA_KSQ_1_PRIOR_NEW_DEBS_MANIFEST_SHA256=b0be04014893808a79aaea514e2a5c4bc968b5c9c9769d8d7ea6cae7992b01f9
          AURORA_KSQ_1_PRIOR_BUILD_MANIFEST_SHA256=ff87f96c85bc4ba1553f16b3700cf701eca04e9b749a1c739bb1088cceb3485b
          AURORA_KSQ_1_PRIOR_DEBS=103
          AURORA_KSQ_1_PRIOR_CHECKPOINT=PASS
          EOF_CHECKPOINT

      - name: Download and validate immutable snapshot slice
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set -a
          source scripts/ci/aurora-ksq-snapshot-release.env
          set +a
          [[ "$AURORA_KSQ_SNAPSHOT_RELEASE_STATUS" == INDEPENDENTLY_VALIDATED ]]
          out="$RUNNER_TEMP/release"
          rm -rf "$out"
          mkdir -p "$out"
          archive="$out/$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET"
          curl --fail --location --retry 5 --retry-all-errors \
            -H 'Accept: application/octet-stream' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET_ID" \
            -o "$archive"
          [[ "$(stat -c '%s' "$archive")" == "$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET_BYTES" ]]
          [[ "$(sha256sum "$archive" | awk '{print $1}')" == "$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET_SHA256" ]]
          python3 - "$archive" "$AURORA_KSQ_SNAPSHOT" <<'PY'
          import sys, tarfile
          from pathlib import PurePosixPath
          archive, snapshot = sys.argv[1:]
          with tarfile.open(archive, 'r:') as tf:
              members = tf.getmembers()
              if not members:
                  raise SystemExit('empty archive')
              for m in members:
                  p = PurePosixPath(m.name)
                  if p.is_absolute() or '..' in p.parts or not p.parts or p.parts[0] != snapshot:
                      raise SystemExit(f'unsafe archive member: {m.name}')
                  if m.issym():
                      raise SystemExit(f'symlink forbidden: {m.name}')
                  if m.islnk():
                      link = PurePosixPath(m.linkname)
                      if link.is_absolute() or '..' in link.parts or not link.parts or link.parts[0] != snapshot:
                          raise SystemExit(f'unsafe hardlink: {m.name} -> {m.linkname}')
          PY
          root=/opt/supralinux/archive
          sudo rm -rf "$root/$AURORA_KSQ_SNAPSHOT"
          sudo mkdir -p "$root"
          sudo tar -C "$root" -xf "$archive"
          python3 scripts/ci/ksq-snapshot-slice.py validate --slice-root "$root/$AURORA_KSQ_SNAPSHOT"

      - name: Run maintained range 021-040 with package network absent
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source scripts/ci/aurora-ksq-snapshot-release.env
          set +a
          image='ubuntu:26.04@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b'
          slice="/opt/supralinux/archive/$AURORA_KSQ_SNAPSHOT"
          name="supralinux-ksq-range-${GITHUB_RUN_ID}"
          mkdir -p build/ksq-1/docker-builder
          chmod -R 0777 build
          docker pull "$image"
          cid="$(python3 scripts/ci/ksq-docker-builder.py create \
            --image "$image" \
            --name "$name" \
            --bind "$slice:$slice:ro" \
            --bind "$GITHUB_WORKSPACE:/workspace:ro" \
            --bind "$GITHUB_WORKSPACE/build:/workspace/build:rw" \
            --evidence-dir "$GITHUB_WORKSPACE/build/ksq-1/docker-builder")"
          test -n "$cid"
          trap 'python3 scripts/ci/ksq-docker-builder.py remove "$cid" >/dev/null 2>&1 || true' EXIT
          set +e
          docker exec -i "$cid" env AURORA_KSQ_LOCAL_SLICE_ROOT="$slice" \
            bash /workspace/scripts/ci/run-ksq-1-local-range.sh 21 40 \
            2>&1 | tee build/ksq-1/local-range-021-040.log
          pipe_status=("${PIPESTATUS[@]}")
          set -e
          printf 'CONTAINER_RC=%s\nTEE_RC=%s\n' "${pipe_status[0]}" "${pipe_status[1]}" \
            > build/ksq-1/local-range-command.env
          test "${pipe_status[0]}" -eq 0
          test "${pipe_status[1]}" -eq 0

      - name: Capture and enforce AppArmor audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ksq-1/host-evidence
          sudo journalctl -k --no-pager 2>/dev/null \
            | grep 'apparmor="DENIED"' \
            | grep 'profile="supralinux-ksq-unshare"' \
            > build/ksq-1/host-evidence/apparmor-denied.log || true
          test ! -s build/ksq-1/host-evidence/apparmor-denied.log

      - name: Preserve range evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-1-local-range-021-040
          path: |
            build/ksq-1/host-evidence/
            build/ksq-1/docker-builder/
            build/ksq-1/local-range-command.env
            build/ksq-1/local-range-021-040.log
            build/ksq-1/prior-checkpoint-001-020.env
            build/ksq-1-local-runner-status.env
            build/ksq-1/environment/*.env
            build/ksq-1/environment/*.sha256
            build/ksq-1/environment/*.txt
            build/ksq-1/environment/sbuild-local.conf
            build/ksq-1/full/chunk-021-040/evidence/
            build/ksq-1/full/chunk-021-040/new-debs/
            build/ksq-0/build-order.tsv
            build/ksq-0/closure-status.env
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

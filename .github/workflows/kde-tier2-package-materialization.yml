name: KDE Frameworks Tier 2 package materialization

on:
  pull_request:
    paths:
      - manifests/kde-tier2-package-contracts.json
      - scripts/materialize_kde_tier2_package.py
      - scripts/run-kde-tier2-package-materialization.sh
      - scripts/kde-tier2-materialization-needed.sh
      - scripts/plan-kde-tier2-materialization.py
      - .github/workflows/kde-tier2-package-materialization.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Plan Tier 2 materialization
    runs-on: ubuntu-26.04
    outputs:
      run: ${{ steps.final.outputs.run }}
      matrix: ${{ steps.final.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Determine scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${EVENT_ACTION}" == "synchronize" ]]; then before="${EVENT_BEFORE}"; after="${EVENT_AFTER}"; else before="${PR_BASE_SHA}"; after="${PR_HEAD_SHA}"; fi
          for sha in "${before}" "${after}"; do
            [[ "${sha}" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
            git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "${sha}"
          done
          if scripts/kde-tier2-materialization-needed.sh "${before}" "${after}"; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            rc=$?; [[ "${rc}" -eq 1 ]] || exit "${rc}"; echo "run=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Build matrix from canonical pending targets
        id: matrix
        run: python3 scripts/plan-kde-tier2-materialization.py --github-output "${GITHUB_OUTPUT}"
      - name: Finalize materialization plan
        id: final
        shell: bash
        run: |
          if [[ "${{ steps.scope.outputs.run }}" == true && "${{ steps.matrix.outputs.run }}" == true ]]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi
          echo 'matrix=${{ steps.matrix.outputs.matrix }}' >> "${GITHUB_OUTPUT}"

  materialize:
    name: Materialize ${{ matrix.node }}
    needs: plan
    if: needs.plan.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Materialize authoritative source plus pinned packaging tree
        run: scripts/run-kde-tier2-package-materialization.sh "${{ matrix.node }}"
      - name: Upload materialization evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kde-tier2-materialization-${{ matrix.node }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/kde-tier2-materialization/${{ matrix.node }}/
          if-no-files-found: error
          retention-days: 30

  skip:
    name: Report intentional materialization skip
    needs: plan
    if: needs.plan.outputs.run == 'false'
    runs-on: ubuntu-26.04
    steps:
      - run: echo 'Tier 2 package materialization intentionally skipped; semantic inputs are unchanged.'

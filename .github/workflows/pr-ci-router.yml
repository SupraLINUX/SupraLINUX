name: PR CI router

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

concurrency:
  group: pr-ci-router-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan PR event delta
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      run_ci: ${{ steps.scope.outputs.run_ci }}
      run_round21: ${{ steps.scope.outputs.run_round21 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Classify PR event delta
        id: scope
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_ACTION}" == "synchronize" ]]; then
            before="${EVENT_BEFORE}"
            after="${EVENT_AFTER}"
          else
            before="${PR_BASE_SHA}"
            after="${PR_HEAD_SHA}"
          fi

          for sha in "${before}" "${after}"; do
            if [[ ! "${sha}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Invalid PR comparison SHA: ${sha}" >&2
              exit 1
            fi
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "${sha}"
            fi
          done

          if bash scripts/pr-ci-router-needed.sh "${before}" "${after}"; then
            run_ci=true
          else
            rc=$?
            if [[ "${rc}" -eq 1 ]]; then
              run_ci=false
            else
              exit "${rc}"
            fi
          fi

          echo "run_ci=${run_ci}" >> "${GITHUB_OUTPUT}"
          run_round21="$(python3 -c 'import json; m=json.load(open("manifests/kde-frameworks-tier3.json")); print("true" if m.get("discovery_policy",{}).get("package_builds")=="tier3-round21-diagnostic-pending" else "false")')"
          echo "run_round21=${run_round21}" >> "${GITHUB_OUTPUT}"
          if [[ "${run_ci}" == "true" ]]; then
            echo "Semantic build/reference/provider input changed; invoking reusable CI lanes."
          else
            echo "Evidence/policy-only event delta; Repository Policy remains authoritative and reusable hosted lanes are skipped."
          fi

  kde-tier3-kio-round21-diagnostic:
    name: Tier 3 KIO Round 21 diagnostic
    needs: plan
    if: needs.plan.outputs.run_round21 == 'true'
    uses: ./.github/workflows/kde-tier3-kio-round21-diagnostic.yml

  package-build-proof:
    name: Phase 1 package preflight
    needs: plan
    if: needs.plan.outputs.run_ci == 'true'
    uses: ./.github/workflows/package-build-proof.yml

  kde-ecm-package-preflight:

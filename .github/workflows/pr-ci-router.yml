name: PR CI router

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

concurrency:
  group: pr-ci-router-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan PR event delta
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      run_ci: ${{ steps.scope.outputs.run_ci }}
      run_diag_preflight: ${{ steps.scope.outputs.run_diag_preflight }}
      run_round23: ${{ steps.scope.outputs.run_round23 }}
      run_round24: ${{ steps.scope.outputs.run_round24 }}
      run_round25: ${{ steps.scope.outputs.run_round25 }}
      run_round26: ${{ steps.scope.outputs.run_round26 }}
      run_knewstuff_runtime: ${{ steps.scope.outputs.run_knewstuff_runtime }}
      run_tier3_materialization: ${{ steps.scope.outputs.run_tier3_materialization }}
      run_tier3_level3: ${{ steps.scope.outputs.run_tier3_level3 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Classify PR event delta
        id: scope
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_ACTION}" == "synchronize" ]]; then
            before="${EVENT_BEFORE}"
            after="${EVENT_AFTER}"
          else
            before="${PR_BASE_SHA}"
            after="${PR_HEAD_SHA}"
          fi

          for sha in "${before}" "${after}"; do
            if [[ ! "${sha}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Invalid PR comparison SHA: ${sha}" >&2
              exit 1
            fi
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "${sha}"
            fi
          done

          if bash scripts/pr-ci-router-needed.sh "${before}" "${after}"; then
            run_ci=true
          else
            rc=$?
            if [[ "${rc}" -eq 1 ]]; then
              run_ci=false
            else
              exit "${rc}"
            fi
          fi

          echo "run_ci=${run_ci}" >> "${GITHUB_OUTPUT}"
          run_diag_preflight="$(python3 -c 'import json; m=json.load(open("manifests/kde-frameworks-tier3.json")); print("true" if m.get("discovery_policy",{}).get("package_builds")=="diagnostic-infrastructure-preflight-pending" else "false")')"
          echo "run_diag_preflight=${run_diag_preflight}" >> "${GITHUB_OUTPUT}"
          run_round23="$(python3 -c 'import json; t=json.load(open("manifests/kde-frameworks-tier3.json")); p=json.load(open("manifests/diagnostic-infrastructure-preflight.json")); r=json.load(open("manifests/kde-tier3-kio-round23-diagnostic.json")); ok=t.get("discovery_policy",{}).get("package_builds")=="tier3-round23-diagnostic-pending" and p.get("status")=="PASS" and r.get("status")=="definition-pending-ci" and r.get("execution_authorized") is True; print("true" if ok else "false")')"
          echo "run_round23=${run_round23}" >> "${GITHUB_OUTPUT}"
          run_round24="$(python3 -c 'import json; t=json.load(open("manifests/kde-frameworks-tier3.json")); r23=json.load(open("manifests/kde-tier3-kio-round23-diagnostic.json")); r24=json.load(open("manifests/kde-tier3-kio-round24-diagnostic.json")); ok=t.get("discovery_policy",{}).get("package_builds")=="tier3-round24-diagnostic-pending" and r23.get("status")=="diagnostic-PASS" and r24.get("status")=="definition-pending-ci" and r24.get("execution_authorized") is True and r24.get("package_execution_authorized") is False; print("true" if ok else "false")')"
          echo "run_round24=${run_round24}" >> "${GITHUB_OUTPUT}"
          run_round25="$(python3 -c 'import json; t=json.load(open("manifests/kde-frameworks-tier3.json")); r24=json.load(open("manifests/kde-tier3-kio-round24-diagnostic.json")); r25=json.load(open("manifests/kde-tier3-kio-round25-remediation.json")); ok=t.get("discovery_policy",{}).get("package_builds")=="tier3-round25-remediation-pending" and r24.get("status")=="diagnostic-PASS" and r25.get("status")=="definition-pending-ci" and r25.get("execution_authorized") is True and r25.get("package_execution_authorized") is False; print("true" if ok else "false")')"
          echo "run_round25=${run_round25}" >> "${GITHUB_OUTPUT}"
          run_round26="$(python3 -c 'import json; t=json.load(open("manifests/kde-frameworks-tier3.json")); r25=json.load(open("manifests/kde-tier3-kio-round25-remediation.json")); r26=json.load(open("manifests/kde-tier3-kio-round26-remediation.json")); ok=t.get("discovery_policy",{}).get("package_builds")=="tier3-round26-remediation-pending" and r25.get("status")=="remediation-FAIL-contract" and r25.get("interpretation",{}).get("target_krecent_remediation")=="PASS" and r26.get("status")=="definition-pending-ci" and r26.get("execution_authorized") is True and r26.get("package_execution_authorized") is False; print("true" if ok else "false")')"
          echo "run_round26=${run_round26}" >> "${GITHUB_OUTPUT}"
          run_knewstuff_runtime="$(python3 -c 'import json; r=json.load(open("manifests/kde-tier3-knewstuff-runtime-validation.json")); ok=r.get("state")=="execution-authorized" and r.get("execution_authorized") is True and r.get("activation",{}).get("execution_authorized") is True; print("true" if ok else "false")')"
          echo "run_knewstuff_runtime=${run_knewstuff_runtime}" >> "${GITHUB_OUTPUT}"
          run_tier3_materialization="$(python3 -c 'import json; m=json.load(open("manifests/kde-tier3-materialization.json")); t=json.load(open("manifests/kde-frameworks-tier3.json")); mr=m.get("level3_remediation",{}); tr=t.get("level3_remediation",{}); ok=m.get("state")=="remediation-pending-ci" and mr.get("status")=="materialization-pending-ci" and mr.get("materialization_authorized") is True and mr.get("package_execution_authorized") is False and tr.get("status")=="materialization-pending-ci" and tr.get("materialization_authorized") is True and tr.get("package_execution_authorized") is False; print("true" if ok else "false")')"
          echo "run_tier3_materialization=${run_tier3_materialization}" >> "${GITHUB_OUTPUT}"
          run_tier3_level3="$(python3 -c 'import json; m=json.load(open("manifests/kde-tier3-build-level3.json")); ok=m.get("state")=="active-pending-ci" and m.get("execution_authorized") is True; print("true" if ok else "false")')"
          echo "run_tier3_level3=${run_tier3_level3}" >> "${GITHUB_OUTPUT}"
          if [[ "${run_ci}" == "true" ]]; then
            echo "Semantic build/reference/provider input changed; invoking reusable CI lanes."
          else
            echo "Evidence/policy-only event delta; Repository Policy remains authoritative and reusable hosted lanes are skipped."
          fi

  repository-policy:
    name: Repository policy
    uses: ./.github/workflows/repository-policy.yml

  kde-tier3-knewstuff-runtime-validation:
    name: Tier 3 KNewStuff runtime validation
    needs: [plan, repository-policy]
    if: needs.plan.outputs.run_knewstuff_runtime == 'true' && needs.repository-policy.result == 'success'
    uses: ./.github/workflows/kde-tier3-knewstuff-runtime-validation.yml

  kde-tier3-materialization:
    name: Tier 3 Level 3 source materialization
    needs: [plan, repository-policy]
    if: needs.plan.outputs.run_tier3_materialization == 'true' && needs.repository-policy.result == 'success'
    uses: ./.github/workflows/kde-tier3-materialization.yml

  kde-tier3-build-level3:
    name: Tier 3 build Level 3
    needs: [plan, repository-policy]
    if: needs.plan.outputs.run_tier3_level3 == 'true' && needs.repository-policy.result == 'success'
    uses: ./.github/workflows/kde-tier3-build-level3.yml

  diagnostic-infrastructure-preflight:
    name: Diagnostic infrastructure preflight
    needs: plan
    if: needs.plan.outputs.run_diag_preflight == 'true'
    uses: ./.github/workflows/diagnostic-infrastructure-preflight.yml

  kde-tier3-kio-round23-diagnostic:
    name: Tier 3 KIO Round 23 diagnostic
    needs: plan
    if: needs.plan.outputs.run_round23 == 'true'

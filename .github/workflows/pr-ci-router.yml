    needs: plan
    if: needs.plan.outputs.run_round25 == 'true'
    uses: ./.github/workflows/kde-tier3-kio-round25-remediation.yml

  kde-tier3-kio-round26-remediation:
    name: Tier 3 KIO Round 26 combined remediation proof
    needs: plan
    if: needs.plan.outputs.run_round26 == 'true'
    uses: ./.github/workflows/kde-tier3-kio-round26-remediation.yml

  package-build-proof:
    name: Phase 1 package preflight
    needs: plan
    if: needs.plan.outputs.run_ci == 'true'

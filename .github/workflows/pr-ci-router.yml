name: PR CI router

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

concurrency:
  group: pr-ci-router-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan PR event delta
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      run_ci: ${{ steps.scope.outputs.run_ci }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Classify PR event delta
        id: scope
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_ACTION}" == "synchronize" ]]; then
            before="${EVENT_BEFORE}"
            after="${EVENT_AFTER}"
          else
            before="${PR_BASE_SHA}"
            after="${PR_HEAD_SHA}"
          fi

          for sha in "${before}" "${after}"; do
            if [[ ! "${sha}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Invalid PR comparison SHA: ${sha}" >&2
              exit 1
            fi
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "${sha}"
            fi
          done

          mapfile -t changed < <(git diff --name-only "${before}" "${after}" --)
          printf 'PR event delta %s..%s contains %d changed path(s).\n' "${before}" "${after}" "${#changed[@]}"
          printf '%s\n' "${changed[@]}"

          run_ci=false
          for path in "${changed[@]}"; do
            case "${path}" in
              docs/*|README.md)
                ;;
              *)
                run_ci=true
                break
                ;;
            esac
          done

          echo "run_ci=${run_ci}" >> "${GITHUB_OUTPUT}"
          if [[ "${run_ci}" == "true" ]]; then
            echo "Non-documentation input changed; invoking reusable CI lanes."
          else
            echo "Documentation-only event delta; reusable build/reference/provider lanes remain skipped."
          fi

  package-build-proof:
    name: Phase 1 package preflight
    needs: plan
    if: needs.plan.outputs.run_ci == 'true'
    uses: ./.github/workflows/package-build-proof.yml

  kde-ecm-package-preflight:
    name: ECM package preflight
    needs: plan
    if: needs.plan.outputs.run_ci == 'true'
    uses: ./.github/workflows/kde-ecm-package-preflight.yml

  kde-attica-packaging-reference:
    name: Attica packaging reference
    needs: plan
    if: needs.plan.outputs.run_ci == 'true'
    uses: ./.github/workflows/kde-attica-packaging-reference.yml

  kde-attica-package-preflight:
    name: Attica package preflight
    needs: plan
    if: needs.plan.outputs.run_ci == 'true'
    uses: ./.github/workflows/kde-attica-package-preflight.yml

  kde-tier1-dependency-preflight:

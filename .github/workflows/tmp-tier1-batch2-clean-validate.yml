name: Temporary Tier 1 batch 2 clean-tree validation

on:
  push:
    branches: [tmp-tier1-batch2-fix]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Make Batch 1 closure validator future-state aware
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/validate_kde_tier1_package_batch1.py')
          s=p.read_text(encoding='utf-8')
          old='''require(sum(1 for item in tier_nodes.values() if item.get("state") == "PASS") == 4, "Canonical Tier 1 PASS count must be 4")
          require(sum(1 for item in tier_nodes.values() if item.get("state") == "pending") == 25, "Canonical Tier 1 pending count must be 25")'''
          new='''require(sum(1 for item in tier_nodes.values() if item.get("state") == "PASS") == 4, "Canonical Tier 1 PASS count must be 4")
          require(sum(1 for item in tier_nodes.values() if item.get("state") == "pending") == 22, "Canonical Tier 1 pending count must be 22 after Batch 2 attempt 1")
          current_fail = {node_id for node_id, item in tier_nodes.items() if item.get("state") == "FAIL"}
          require(current_fail == {"karchive", "kholidays", "ktexttemplate"}, "Batch 1 closure validator must preserve the three current independent Batch 2 FAILs")
          require(not any(item.get("state") == "BLOCKED" for item in tier_nodes.values()), "Canonical Tier 1 must have no BLOCKED nodes")'''
          if old not in s:
              raise SystemExit('stale Batch 1 count block not found exactly once')
          s=s.replace(old,new,1)
          s=s.replace('print("Canonical Tier 1: 4 PASS, 25 pending, 0 FAIL, 0 BLOCKED")','print("Canonical Tier 1 now: 4 PASS, 22 pending, 3 FAIL, 0 BLOCKED; Batch 1 remains 3/3 PASS")',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate clean remediation tree
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck gnupg
          bash -n scripts/*.sh
          shellcheck -e SC1091 scripts/*.sh
          python3 scripts/validate_repository.py
          python3 scripts/validate_qt_provider.py
          python3 scripts/validate_kde_dag.py
          python3 scripts/validate_kde_tier1.py
          python3 scripts/validate_kde_tier1_package_batch1.py
          python3 scripts/validate_kde_tier1_package_batch2.py
          python3 scripts/validate_kde_tier1_packaging_reference.py
          python3 scripts/validate_kde_tier1_packaging_tree.py
          python3 scripts/validate_kde_attica_package.py
          python3 scripts/validate_kde_attica_ci_scope.py
          git diff --check
      - name: Commit Batch 1 validator maintenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SupraLINUX CI'
          git config user.email 'ci@supralinux.invalid'
          git add scripts/validate_kde_tier1_package_batch1.py
          git diff --cached --check
          git commit -m 'tmp: make Batch 1 validator future-state aware'
          git push origin HEAD:tmp-tier1-batch2-fix

name: Phase 1 package-build proof

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-build-proof:
    name: sbuild + autopkgtest proof
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test package
        run: scripts/run-package-build-proof.sh

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase1-package-proof-${{ github.sha }}
          path: evidence/package-build-proof/
          if-no-files-found: error
          retention-days: 30

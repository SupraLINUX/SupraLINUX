name: Temporary export for KDE Tier 1 Batch 5 closure

on:
  push:
    branches:
      - architecture/bootstrap-v1

permissions:
  contents: read

jobs:
  export-repository:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Export exact repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/supralinux-batch5-close-source.tar.gz .
          sha256sum /tmp/supralinux-batch5-close-source.tar.gz

      - name: Upload repository snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: batch5-close-source-${{ github.sha }}
          path: /tmp/supralinux-batch5-close-source.tar.gz
          if-no-files-found: error
          retention-days: 1

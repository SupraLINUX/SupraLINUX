name: Temporary canonical close for KDE Tier 1 Batch 5

on:
  push:
    branches:
      - architecture/bootstrap-v1

permissions:
  contents: read
  actions: read

jobs:
  prepare-closure:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Materialize canonical Batch 5 closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import copy
          import json
          import re
          from pathlib import Path

          ROOT = Path('.')
          CAMPAIGN = ROOT / 'manifests/kde-tier1-package-campaign-batch5.json'
          TIER1 = ROOT / 'manifests/kde-frameworks-tier1.json'
          DAG = ROOT / 'manifests/kde-dag.json'

          def load(path: Path):
              return json.loads(path.read_text(encoding='utf-8'))

          def dump(path: Path, data):
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          def write(path: Path, text: str):
              path.write_text(text.rstrip() + '\n', encoding='utf-8')

          def require(cond: bool, msg: str):
              if not cond:
                  raise SystemExit(msg)

          def add_block_lines(path: Path, variable: str, additions: list[str]):
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines()
              start = next((i for i, line in enumerate(lines) if line.startswith(variable + ' = {')), None)
              require(start is not None, f'{path}: cannot find {variable}')
              end = next((i for i in range(start + 1, len(lines)) if lines[i].strip() == '}'), None)
              require(end is not None, f'{path}: cannot find end of {variable}')
              existing = '\n'.join(lines[start:end + 1])
              for line in additions:
                  key = line.strip().split(':', 1)[0].strip().strip('"\'')
                  if key and key in existing:
                      continue
                  lines.insert(end, line)
                  end += 1
                  existing += '\n' + line
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          c = load(CAMPAIGN)
          require(c.get('state') == 'open-remediation', 'Batch 5 must still be open-remediation before closure')

name: Dispatch Batch 7 post-promotion policy

on:
  push:
    branches:
      - tooling/batch7-post-promotion-policy
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact canonical branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: architecture/bootstrap-v1
          fetch-depth: 1

      - name: Verify promoted canonical HEAD
        shell: bash
        run: |
          set -euo pipefail
          expected=2ee55936e93024a51fce8e2952a87a736a7f542d
          actual="$(git rev-parse HEAD)"
          [[ "${actual}" == "${expected}" ]] || {
            echo "Canonical HEAD moved: expected ${expected}, got ${actual}" >&2
            exit 1
          }

      - name: Dispatch Repository Policy on canonical branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/SupraLINUX/SupraLINUX/actions/workflows/repository-policy.yml/dispatches \
            --data '{"ref":"architecture/bootstrap-v1"}'
          echo "Repository Policy dispatch accepted for canonical HEAD ${GITHUB_SHA}; target ref architecture/bootstrap-v1"

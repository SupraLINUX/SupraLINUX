name: Aurora KSQ Docker procfs userns A/B probe

on:
  push:
    branches:
      - feature/kde-stack-qualification
    paths:
      - '.github/workflows/ksq-docker-proc-userns-ab-probe.yml'
      - 'scripts/ci/apparmor/supralinux-ksq-unshare'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  procfs-userns-ab:
    name: Compare Docker systempaths for nested procfs
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare host and exact snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -qx 'VERSION_ID="26.04"' /etc/os-release
          sudo apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends curl python3 ubuntu-keyring gpgv
          sudo bash scripts/ci/install-ksq-apparmor-profile.sh | tee "$RUNNER_TEMP/host-apparmor.txt"
          sudo grep -qx 'supralinux-ksq-unshare (enforce)' /sys/kernel/security/apparmor/profiles

          set -a
          source scripts/ci/aurora-ksq-snapshot-release.env
          set +a
          [[ "$AURORA_KSQ_SNAPSHOT_RELEASE_STATUS" == INDEPENDENTLY_VALIDATED ]]
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          curl --fail --location --retry 5 --retry-all-errors \
            -H 'Accept: application/octet-stream' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET_ID" \
            -o "$out/$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET"
          [[ "$(stat -c '%s' "$out/$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET")" == "$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET_BYTES" ]]
          [[ "$(sha256sum "$out/$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET" | awk '{print $1}')" == "$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET_SHA256" ]]
          sudo mkdir -p /opt/supralinux/archive
          sudo tar -C /opt/supralinux/archive -xf "$out/$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET"
          python3 scripts/ci/ksq-snapshot-slice.py validate --slice-root "/opt/supralinux/archive/$AURORA_KSQ_SNAPSHOT"

      - name: Run default versus unconfined-systempaths procfs probes
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source scripts/ci/aurora-ksq-snapshot-release.env
          set +a
          image='ubuntu:26.04@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b'
          slice="/opt/supralinux/archive/$AURORA_KSQ_SNAPSHOT"
          evidence="$RUNNER_TEMP/proc-userns-ab"
          rm -rf "$evidence"
          mkdir -p "$evidence/default" "$evidence/systempaths-unconfined"
          chmod -R 0777 "$evidence"
          docker pull "$image"

          run_case() {
            local name="$1"
            shift
            local out="$evidence/$name"
            local rc
            echo "=== CASE $name ==="
            set +e
            docker run --rm -i \
              --network none \
              --security-opt seccomp=unconfined \
              --security-opt apparmor=supralinux-ksq-unshare \
              "$@" \
              -v "$slice:/opt/supralinux/archive/$AURORA_KSQ_SNAPSHOT:ro" \
              "$image" bash -s 2>&1 <<'EOF_CONTAINER' | tee "$out/container.log"
          set -euo pipefail
          snapshot=20260829T022000Z
          repo="/opt/supralinux/archive/$snapshot"
          export DEBIAN_FRONTEND=noninteractive

          rm -f /etc/apt/sources.list /etc/apt/sources.list.d/*
          cp "$repo/aurora-local.sources" /etc/apt/sources.list.d/aurora-local.sources
          cat >/etc/apt/apt.conf.d/99supralinux-local-only <<'EOF_APT'
          Acquire::http::Proxy "http://127.0.0.1:9/";
          Acquire::https::Proxy "http://127.0.0.1:9/";
          Acquire::Retries "0";
          EOF_APT
          apt-get -o APT::Update::Error-Mode=any update
          apt-get --no-install-recommends install -y uidmap libcap2-bin util-linux

          grep -q '^ubuntu:' /etc/subuid || echo 'ubuntu:100000:65536' >> /etc/subuid
          grep -q '^ubuntu:' /etc/subgid || echo 'ubuntu:100000:65536' >> /etc/subgid
          chmod u-s /usr/bin/newuidmap /usr/bin/newgidmap
          setcap cap_setuid=ep /usr/bin/newuidmap
          setcap cap_setgid=ep /usr/bin/newgidmap

          echo '=== outer identity and security ==='
          id
          cat /proc/self/uid_map
          cat /proc/self/gid_map
          grep -E '^(Cap(Inh|Prm|Eff|Bnd|Amb)|NoNewPrivs|Seccomp):' /proc/self/status
          echo '=== proc mount tree ==='
          findmnt -R /proc -o TARGET,SOURCE,FSTYPE,OPTIONS
          echo '=== proc system-path overlays ==='
          grep -E ' /proc/(acpi|asound|interrupts|kcore|keys|latency_stats|sched_debug|scsi|timer_list|timer_stats|sys|sysrq-trigger)( |/)' /proc/self/mountinfo || true

          cat >/tmp/proc-ns-test.sh <<'EOF_TEST'
          #!/bin/sh
          set -eu
          exec unshare --map-auto --map-user=65536 --map-group=65536 --keep-caps --mount --pid --uts --ipc --fork /bin/sh -ceu '
            echo "=== nested namespace before procfs ==="
            id || true
            rm -rf /tmp/proc-test
            mkdir -p /tmp/proc-test
            echo "=== nested proc mount attempt ==="
            mount -v -t proc proc /tmp/proc-test
            test "$(stat -f -c %T /tmp/proc-test)" = proc
            test -r /tmp/proc-test/self/status
            grep -q "^Name:" /tmp/proc-test/self/status
            echo "=== nested namespace after procfs ==="
            cat /tmp/proc-test/self/uid_map
            cat /tmp/proc-test/self/gid_map
            grep -E "^(Cap(Inh|Prm|Eff|Bnd|Amb)|NoNewPrivs|Seccomp):" /tmp/proc-test/self/status
            grep -q " /tmp/proc-test " /tmp/proc-test/self/mountinfo
            echo AURORA_KSQ_DIRECT_NESTED_PROCFS_PASS=1
            umount /tmp/proc-test
          '
          EOF_TEST
          chmod 0755 /tmp/proc-ns-test.sh
          su -s /bin/sh ubuntu -c /tmp/proc-ns-test.sh
          EOF_CONTAINER
            rc=${PIPESTATUS[0]}
            printf '%s\n' "$rc" | tee "$out/rc.txt"
            return "$rc"
          }

          set +e
          run_case default
          default_rc=$?
          run_case systempaths-unconfined --security-opt systempaths=unconfined
          unconfined_rc=$?
          set -e

          {
            echo "DEFAULT_RC=$default_rc"
            echo "SYSTEMPATHS_UNCONFINED_RC=$unconfined_rc"
          } | tee "$evidence/results.env"
          echo "default_rc=$default_rc" >> "$GITHUB_OUTPUT"
          echo "unconfined_rc=$unconfined_rc" >> "$GITHUB_OUTPUT"

          if [[ "$default_rc" -eq 0 ]]; then
            echo 'AURORA_KSQ_PROC_AB_INCONCLUSIVE: default Docker systempaths unexpectedly allowed nested procfs' >&2
            exit 1
          fi
          if [[ "$unconfined_rc" -ne 0 ]]; then
            echo 'AURORA_KSQ_PROC_AB_INCONCLUSIVE: systempaths=unconfined did not restore nested procfs' >&2
            exit 1
          fi
          echo AURORA_KSQ_PROC_AB_DOCKER_SYSTEMPATHS_CAUSAL=PASS

      - name: Capture host kernel audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/proc-userns-ab"
          mkdir -p "$evidence"
          sudo dmesg > "$evidence/host-dmesg.log" || true
          sudo dmesg | grep -Ei 'apparmor|audit|denied|userns|namespace|mount|proc' > "$evidence/host-kernel-filtered.log" || true

      - name: Preserve A/B evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-docker-proc-userns-ab
          path: ${{ runner.temp }}/proc-userns-ab
          if-no-files-found: error
          retention-days: 30

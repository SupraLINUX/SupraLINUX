name: Hosted Ubuntu 26.04 KVM capability probe

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: hosted-kvm-probe-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  hosted-kvm:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || (github.event.label.name == 'ci:hosted-kvm-probe' && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Tiny guest KVM boot, no package build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate exact probe contract
        run: |
          set -euo pipefail
          python3 scripts/test-hosted-kvm-probe.py

      - name: Install QEMU from Ubuntu
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-system-common seabios acl

      - name: Scope KVM device access to the ephemeral hosted runner user
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = "github-hosted"
          test -c /dev/kvm
          printf 'KVM access before: %s\n' "$(stat -c '%a %U:%G' /dev/kvm)"
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          fi
          test -r /dev/kvm && test -w /dev/kvm
          getfacl -p /dev/kvm

      - name: Run hosted KVM bootsector capability check
        run: |
          set -euo pipefail
          python3 scripts/probe-hosted-kvm.py --output evidence/hosted-kvm-probe/result.json

      - name: Retain scoped probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-kvm-capability-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/hosted-kvm-probe/result.json
          if-no-files-found: warn
          retention-days: 30

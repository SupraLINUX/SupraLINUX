name: Aurora KSQ GitHub-hosted stable builder profile probe

on:
  push:
    branches:
      - feature/kde-stack-qualification
    paths:
      - '.github/workflows/ksq-github-hosted-builder-profile-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-builder-profile:
    name: Probe Ubuntu 24.04 host plus pinned Resolute container
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Record stable host
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== host ==='
            cat /etc/os-release
            uname -a
            docker version
            apparmor_status || true
            sysctl kernel.apparmor_restrict_unprivileged_userns || true
          } | tee "$RUNNER_TEMP/host.txt"
          grep -qx 'VERSION_ID="24.04"' /etc/os-release

      - name: Load scoped KSQ AppArmor profile on ephemeral host
        shell: bash
        run: |
          set -euo pipefail
          sudo bash scripts/ci/install-ksq-apparmor-profile.sh | tee "$RUNNER_TEMP/apparmor.txt"
          sudo grep -qx 'supralinux-ksq-unshare (enforce)' /sys/kernel/security/apparmor/profiles

      - name: Exercise real mmdebstrap and sbuild unshare path
        shell: bash
        run: |
          set -euo pipefail
          image='ubuntu:26.04@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b'
          docker pull "$image"
          docker run --rm \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=supralinux-ksq-unshare \
            "$image" bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update
              apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
                sudo sbuild mmdebstrap uidmap zstd devscripts dpkg-dev apt-utils \
                ca-certificates ubuntu-keyring gzip xz-utils diffutils libcap2-bin

              grep -q "^ubuntu:" /etc/subuid || echo "ubuntu:100000:65536" >> /etc/subuid
              grep -q "^ubuntu:" /etc/subgid || echo "ubuntu:100000:65536" >> /etc/subgid
              chmod u-s /usr/bin/newuidmap /usr/bin/newgidmap
              setcap cap_setuid=ep /usr/bin/newuidmap
              setcap cap_setgid=ep /usr/bin/newgidmap

              echo "=== container ==="
              cat /etc/os-release
              cat /proc/self/attr/current
              dpkg-query -W -f="\${Package}\t\${Version}\n" sbuild libsbuild-perl mmdebstrap uidmap libcap2-bin util-linux | sort
              stat -c "%A %a %U %G %n" /usr/bin/newuidmap /usr/bin/newgidmap
              getcap /usr/bin/newuidmap /usr/bin/newgidmap
              grep "^ubuntu:" /etc/subuid /etc/subgid

              su -s /bin/bash ubuntu -c "unshare --map-auto --map-user=65536 --map-group=65536 --keep-caps --mount --pid --uts --ipc --fork true"

              cat >/tmp/live.sources <<"EOF_SOURCES"
              Types: deb
              URIs: http://archive.ubuntu.com/ubuntu
              Suites: resolute resolute-updates resolute-backports
              Components: main universe restricted multiverse
              Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

              Types: deb
              URIs: http://security.ubuntu.com/ubuntu
              Suites: resolute-security
              Components: main universe restricted multiverse
              Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
              EOF_SOURCES
              chmod 0644 /tmp/live.sources

              rm -f /tmp/resolute-buildd.tar.zst
              su -s /bin/bash ubuntu -c "mmdebstrap --mode=unshare --variant=buildd --architectures=amd64 --include=ca-certificates,ubuntu-keyring --aptopt='\''Acquire::Retries \"5\";'\'' resolute /tmp/resolute-buildd.tar.zst /tmp/live.sources"
              test -s /tmp/resolute-buildd.tar.zst

              smoke=/tmp/supralinux-hosted-smoke-1.0
              rm -rf "$smoke" /tmp/supralinux-hosted-smoke_1.0* /tmp/sbuild-result
              mkdir -p "$smoke/debian/source" /tmp/sbuild-result
              cat >"$smoke/debian/control" <<"EOF_CONTROL"
              Source: supralinux-hosted-smoke
              Section: devel
              Priority: optional
              Maintainer: SupraLINUX Build Certification <noreply@supralinux.invalid>
              Build-Depends: debhelper-compat (= 13)
              Standards-Version: 4.7.0
              Rules-Requires-Root: no

              Package: supralinux-hosted-smoke
              Architecture: all
              Description: SupraLINUX hosted sbuild architecture probe
               Minimal package used only to exercise sbuild unshare.
              EOF_CONTROL
              cat >"$smoke/debian/changelog" <<"EOF_CHANGELOG"
              supralinux-hosted-smoke (1.0) resolute; urgency=medium

                * GitHub-hosted architecture probe.

               -- SupraLINUX Build Certification <noreply@supralinux.invalid>  Tue, 01 Sep 2026 03:00:00 +0000
              EOF_CHANGELOG
              cat >"$smoke/debian/rules" <<"EOF_RULES"
              #!/usr/bin/make -f
              %:
              	dh $@
              EOF_RULES
              chmod 0755 "$smoke/debian/rules"
              printf "3.0 (native)\n" >"$smoke/debian/source/format"
              printf "hosted probe\n" >"$smoke/probe.txt"
              printf "probe.txt usr/share/supralinux-hosted-smoke/\n" >"$smoke/debian/install"
              chown -R ubuntu:ubuntu "$smoke" /tmp/sbuild-result /tmp/resolute-buildd.tar.zst

              su -s /bin/bash ubuntu -c "cd '$smoke' && dpkg-source -b ."
              test -s /tmp/supralinux-hosted-smoke_1.0.dsc

              su -s /bin/bash ubuntu -c "DEB_BUILD_OPTIONS=parallel=2 sbuild --chroot-mode=unshare --chroot=/tmp/resolute-buildd.tar.zst --dist=resolute --arch=amd64 --build-dir=/tmp/sbuild-result --build-path=/build/supralinux-hosted-smoke --jobs=2 --no-enable-network --no-run-lintian --no-run-autopkgtest --purge-build=always --purge-deps=always --resolve-alternatives --bd-uninstallable-explainer=apt /tmp/supralinux-hosted-smoke_1.0.dsc"

              find /tmp/sbuild-result -maxdepth 1 -type f -printf "%f\n" | sort
              find /tmp/sbuild-result -maxdepth 1 -type f -name "*.deb" -print -quit | grep -q .
              find /tmp/sbuild-result -maxdepth 1 -type f -name "*.buildinfo" -print -quit | grep -q .
              find /tmp/sbuild-result -maxdepth 1 -type f -name "*.changes" -print -quit | grep -q .
              echo AURORA_KSQ_GITHUB_HOSTED_REAL_SBUILD_PASS
            ' | tee "$RUNNER_TEMP/container.txt"

      - name: Preserve probe evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-github-hosted-stable-builder-profile-probe
          path: |
            ${{ runner.temp }}/host.txt
            ${{ runner.temp }}/apparmor.txt
            ${{ runner.temp }}/container.txt
          if-no-files-found: warn
          retention-days: 30

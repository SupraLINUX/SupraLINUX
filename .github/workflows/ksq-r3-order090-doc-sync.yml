name: Aurora KSQ r3 order-090 documentation sync

on:
  push:
    branches:
      - feature/kde-stack-qualification
    paths:
      - '.github/ksq-r3-order090-doc-sync.trigger'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Synchronize accepted order-090 state
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/sync-ksq-order090-docs.py
          git diff --check
          git diff -- docs/validation/AURORA_KSQ_1_ACTIVE_STATUS.md docs/KDE_STACK_QUALIFICATION.md docs/validation/AURORA_KSQ_1_R3_SLICE_AND_REGRESSION.md
      - name: Commit synchronized documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/validation/AURORA_KSQ_1_ACTIVE_STATUS.md docs/KDE_STACK_QUALIFICATION.md docs/validation/AURORA_KSQ_1_R3_SLICE_AND_REGRESSION.md
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'docs(ksq): advance maintained checkpoint to order 90'
          git push origin HEAD:feature/kde-stack-qualification

name: Aurora KSQ sbuild invocation matrix probe

on:
  push:
    branches: [feature/kde-stack-qualification]
    paths:
      - '.github/workflows/ksq-sbuild-invocation-matrix-probe.yml'
      - 'scripts/ci/ksq-docker-builder.py'
      - 'scripts/ci/apparmor/supralinux-ksq-unshare'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invocation-matrix:
    name: Isolate sbuild invocation exit status
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Prepare host and exact snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -qx 'VERSION_ID="26.04"' /etc/os-release
          host_apt=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0)
          sudo apt-get "${host_apt[@]}" -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update
          sudo apt-get "${host_apt[@]}" -o Acquire::Retries=5 install -y --no-install-recommends curl python3 ubuntu-keyring gpgv
          sudo bash scripts/ci/install-ksq-apparmor-profile.sh | tee "$RUNNER_TEMP/host-apparmor.txt"
          sudo grep -qx 'supralinux-ksq-unshare (enforce)' /sys/kernel/security/apparmor/profiles
          set -a; source scripts/ci/aurora-ksq-snapshot-release.env; set +a
          out="$RUNNER_TEMP/release"; mkdir -p "$out"
          curl --fail --location --retry 5 --retry-all-errors -H 'Accept: application/octet-stream' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET_ID" -o "$out/$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET"
          [[ "$(stat -c '%s' "$out/$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET")" == "$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET_BYTES" ]]
          [[ "$(sha256sum "$out/$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET" | awk '{print $1}')" == "$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET_SHA256" ]]
          sudo mkdir -p /opt/supralinux/archive
          sudo tar -C /opt/supralinux/archive -xf "$out/$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET"
          python3 scripts/ci/ksq-snapshot-slice.py validate --slice-root "/opt/supralinux/archive/$AURORA_KSQ_SNAPSHOT"

      - name: Run invocation matrix
        shell: bash
        run: |
          set -euo pipefail
          set -a; source scripts/ci/aurora-ksq-snapshot-release.env; set +a
          image='ubuntu:26.04@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b'
          slice="/opt/supralinux/archive/$AURORA_KSQ_SNAPSHOT"
          evidence="$RUNNER_TEMP/invocation-matrix-evidence"
          name="supralinux-ksq-invocation-matrix-${GITHUB_RUN_ID}"
          rm -rf "$evidence"; mkdir -p "$evidence/docker-builder"; chmod 0777 "$evidence" "$evidence/docker-builder"
          docker pull "$image"
          cid="$(python3 scripts/ci/ksq-docker-builder.py create --image "$image" --name "$name" --bind "$slice:$slice:ro" --bind "$evidence:/evidence:rw" --evidence-dir "$evidence/docker-builder")"
          trap 'python3 scripts/ci/ksq-docker-builder.py remove "$cid" >/dev/null 2>&1 || true' EXIT

          docker exec -i "$cid" bash -s <<'EOF_CONTAINER'
          set -euo pipefail
          repo=/opt/supralinux/archive/20260829T022000Z
          export DEBIAN_FRONTEND=noninteractive
          rm -f /etc/apt/sources.list /etc/apt/sources.list.d/*
          cp "$repo/aurora-local.sources" /etc/apt/sources.list.d/aurora-local.sources
          cat >/etc/apt/apt.conf.d/99supralinux-local-only <<'EOF_APT'
          Acquire::http::Proxy "http://127.0.0.1:9/";
          Acquire::https::Proxy "http://127.0.0.1:9/";
          Acquire::Retries "0";
          EOF_APT
          apt-get -o APT::Update::Error-Mode=any update
          apt-get --no-install-recommends install -y sudo sbuild mmdebstrap uidmap zstd devscripts dpkg-dev apt-utils ca-certificates ubuntu-keyring gzip xz-utils diffutils libcap2-bin build-essential util-linux
          grep -q '^ubuntu:' /etc/subuid || echo 'ubuntu:100000:65536' >> /etc/subuid
          grep -q '^ubuntu:' /etc/subgid || echo 'ubuntu:100000:65536' >> /etc/subgid
          chmod u-s /usr/bin/newuidmap /usr/bin/newgidmap
          setcap cap_setuid=ep /usr/bin/newuidmap
          setcap cap_setgid=ep /usr/bin/newgidmap

          rm -f /tmp/resolute-local-buildd.tar.zst
          su -s /bin/bash ubuntu -c "mmdebstrap --mode=unshare --variant=buildd --architectures=amd64 --include=ca-certificates,ubuntu-keyring --hook-dir=/usr/share/mmdebstrap/hooks/file-mirror-automount resolute /tmp/resolute-local-buildd.tar.zst /etc/apt/sources.list.d/aurora-local.sources" > /evidence/mmdebstrap.log 2>&1
          test -s /tmp/resolute-local-buildd.tar.zst

          smoke=/tmp/supralinux-local-snapshot-smoke-1.0
          rm -rf "$smoke" /tmp/supralinux-local-snapshot-smoke_1.0*
          mkdir -p "$smoke/debian/source"
          cat >"$smoke/debian/control" <<'EOF_CONTROL'
          Source: supralinux-local-snapshot-smoke
          Section: devel
          Priority: optional
          Maintainer: SupraLINUX Build Certification <noreply@supralinux.invalid>
          Build-Depends: dpkg-dev
          Standards-Version: 4.7.0
          Rules-Requires-Root: no

          Package: supralinux-local-snapshot-smoke
          Architecture: all
          Description: SupraLINUX local snapshot sbuild gate
           Minimal package built only to prove local-only sbuild operation.
          EOF_CONTROL
          cat >"$smoke/debian/changelog" <<'EOF_CHANGELOG'
          supralinux-local-snapshot-smoke (1.0) resolute; urgency=medium

            * Local snapshot qualification gate.

           -- SupraLINUX Build Certification <noreply@supralinux.invalid>  Tue, 01 Sep 2026 04:00:00 +0000
          EOF_CHANGELOG
          cat >"$smoke/debian/rules" <<'EOF_RULES'
          #!/usr/bin/make -f
          binary binary-arch binary-indep build build-arch build-indep clean:
          	@set -e; \
          	test -r /proc/self/status; \
          	grep -q '^Name:' /proc/self/status; \
          	test "$$(stat -f -c %T /proc)" = proc; \
          	grep -q ' /proc ' /proc/self/mountinfo; \
          	echo AURORA_KSQ_LOCAL_GATE_SBUILD_PROC_USABLE=1; \
          	if [ "$@" = binary ] || [ "$@" = binary-indep ]; then \
          	  rm -rf debian/supralinux-local-snapshot-smoke; \
          	  mkdir -p debian/supralinux-local-snapshot-smoke/DEBIAN debian/supralinux-local-snapshot-smoke/usr/share/supralinux-local-snapshot-smoke; \
          	  printf 'Package: supralinux-local-snapshot-smoke\nVersion: 1.0\nArchitecture: all\nSection: devel\nPriority: optional\nMaintainer: SupraLINUX Build Certification <noreply@supralinux.invalid>\nDescription: local snapshot smoke\n' > debian/supralinux-local-snapshot-smoke/DEBIAN/control; \
          	  printf 'local snapshot gate\n' > debian/supralinux-local-snapshot-smoke/usr/share/supralinux-local-snapshot-smoke/probe.txt; \
          	  dpkg-deb --root-owner-group --build debian/supralinux-local-snapshot-smoke ..; \
          	  dpkg-distaddfile supralinux-local-snapshot-smoke_1.0_all.deb devel optional; \
          	fi
          EOF_RULES
          chmod 0755 "$smoke/debian/rules"
          printf '3.0 (native)\n' >"$smoke/debian/source/format"
          printf 'local snapshot gate\n' >"$smoke/probe.txt"
          chown -R ubuntu:ubuntu "$smoke" /tmp/resolute-local-buildd.tar.zst
          su -s /bin/bash ubuntu -c "cd '$smoke' && dpkg-source -b ."

          cat >/tmp/sbuild-local.conf <<EOF_SBUILD
          \$unshare_bind_mounts = [ { directory => "$repo/ubuntu", mountpoint => "$repo/ubuntu" } ];
          \$enable_network = 0;
          EOF_SBUILD
          chown ubuntu:ubuntu /tmp/sbuild-local.conf

          base="SBUILD_CONFIG=/tmp/sbuild-local.conf DEB_BUILD_OPTIONS=parallel=2 sbuild --chroot-mode=unshare --chroot=/tmp/resolute-local-buildd.tar.zst --dist=resolute --arch=amd64 --build-path=/build/supralinux-local-snapshot-smoke --jobs=2 --no-enable-network --no-run-lintian --no-run-autopkgtest --purge-build=always --purge-deps=always --resolve-alternatives --bd-uninstallable-explainer=apt /tmp/supralinux-local-snapshot-smoke_1.0.dsc"
          : >/evidence/invocation-matrix.tsv

          run_redirect() {
            name="$1"; flags="$2"; out="/evidence/$name"; mkdir -p "$out"; chown ubuntu:ubuntu "$out"
            set +e
            su -s /bin/bash ubuntu -c "$base $flags --build-dir='$out'" >"/evidence/$name.stdout.log" 2>&1
            rc=$?
            set -e
            printf '%s\tredirect\t%s\t%s\tNA\n' "$name" "$flags" "$rc" | tee -a /evidence/invocation-matrix.tsv
          }
          run_pipe() {
            name="$1"; flags="$2"; out="/evidence/$name"; mkdir -p "$out"; chown ubuntu:ubuntu "$out"
            set +e
            su -s /bin/bash ubuntu -c "$base $flags --build-dir='$out'" 2>&1 | tee "/evidence/$name.stdout.log"
            pipeline_status=("${PIPESTATUS[@]}")
            cmd_rc=${pipeline_status[0]}
            tee_rc=${pipeline_status[1]}
            set -e
            printf '%s\tpipe\t%s\t%s\t%s\n' "$name" "$flags" "$cmd_rc" "$tee_rc" | tee -a /evidence/invocation-matrix.tsv
          }

          run_redirect default-redirect ''
          run_redirect debug-redirect '--debug --verbose'
          run_pipe default-pipe ''
          run_pipe debug-pipe '--debug --verbose'
          cat /evidence/invocation-matrix.tsv
          EOF_CONTAINER

          python3 scripts/ci/ksq-docker-builder.py remove "$cid"
          trap - EXIT

      - name: Capture AppArmor audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/invocation-matrix-evidence"; mkdir -p "$evidence"
          sudo dmesg | grep -E 'apparmor="DENIED".*profile="supralinux-ksq-unshare"' > "$evidence/host-apparmor-denied.log" || true

      - name: Package evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/aurora-ksq-sbuild-invocation-matrix.tar" invocation-matrix-evidence
          sha256sum "$RUNNER_TEMP/aurora-ksq-sbuild-invocation-matrix.tar" > "$RUNNER_TEMP/aurora-ksq-sbuild-invocation-matrix.tar.sha256"

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-sbuild-invocation-matrix
          path: |
            ${{ runner.temp }}/aurora-ksq-sbuild-invocation-matrix.tar
            ${{ runner.temp }}/aurora-ksq-sbuild-invocation-matrix.tar.sha256
          if-no-files-found: error
          retention-days: 30

name: Aurora KSQ-1 native range 066-080 r2

on:
  push:
    branches:
      - feature/kde-stack-qualification
    paths:
      - '.github/workflows/ksq-native-range-066-080-r2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-range-066-080-r2:
    runs-on: ubuntu-26.04
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v7

      - name: Qualify stock Resolute native toolchain
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^VERSION_ID="26\.04(\.1)?"$' /etc/os-release
          test "$(dpkg --print-architecture)" = amd64
          base=build/ksq-1/native-range-066-080-r2
          mkdir -p "$base/host-evidence" "$base/checkpoint-evidence"
          date --iso-8601=seconds > "$base/host-evidence/start-time.txt"
          readlink /proc/self/ns/net > "$base/host-evidence/host-netns.txt"

          sudo apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            ca-certificates curl python3 ubuntu-keyring gpgv \
            sbuild mmdebstrap uidmap zstd devscripts dpkg-dev apt-utils \
            gzip xz-utils diffutils build-essential apparmor apparmor-utils libcap2-bin

          dpkg-query -W -f='${Package}\t${Version}\n' \
            sbuild libsbuild-perl mmdebstrap uidmap util-linux apparmor \
            | sort | tee "$base/host-evidence/toolchain.tsv"
          grep -q $'^sbuild\t0.91.2ubuntu3$' "$base/host-evidence/toolchain.tsv"
          grep -q $'^libsbuild-perl\t0.91.2ubuntu3$' "$base/host-evidence/toolchain.tsv"
          grep -q $'^mmdebstrap\t1.5.7-3$' "$base/host-evidence/toolchain.tsv"
          grep -q $'^uidmap\t1:4.17.4-2ubuntu3$' "$base/host-evidence/toolchain.tsv"

          test "$(stat -c '%a' /usr/bin/newuidmap)" = 4755
          test "$(stat -c '%a' /usr/bin/newgidmap)" = 4755
          test -z "$(getcap /usr/bin/newuidmap /usr/bin/newgidmap || true)"
          user="$(id -un)"
          grep "^${user}:" /etc/subuid | tee "$base/host-evidence/subuid.txt"
          grep "^${user}:" /etc/subgid | tee "$base/host-evidence/subgid.txt"

          sbuild_profile="$(dpkg -L apparmor | grep -E '/etc/apparmor\.d/(usr\.bin\.)?sbuild$' | head -n1)"
          mmdebstrap_profile="$(dpkg -L apparmor | grep -E '/etc/apparmor\.d/(usr\.bin\.)?mmdebstrap$' | head -n1)"
          test -s "$sbuild_profile"
          test -s "$mmdebstrap_profile"
          grep -q 'userns,' "$sbuild_profile"
          grep -q 'userns,' "$mmdebstrap_profile"
          cp "$sbuild_profile" "$base/host-evidence/apparmor-sbuild.profile"
          cp "$mmdebstrap_profile" "$base/host-evidence/apparmor-mmdebstrap.profile"
          sudo aa-status > "$base/host-evidence/aa-status.txt"

          legacy=(
            scripts/ci/ksq-docker-builder.py
            scripts/ci/install-ksq-apparmor-profile.sh
            scripts/ci/apparmor/supralinux-ksq-unshare
            scripts/ci/prepare-ksq-1-local-runner.sh
            scripts/ci/run-ksq-1-local-range.sh
            scripts/ci/configure-ksq-uidmap-filecaps.sh
          )
          for path in "${legacy[@]}"; do
            test ! -e "$path" || { echo "AURORA_NATIVE_LEGACY_PATH_PRESENT=$path" >&2; exit 1; }
          done

      - name: Download exact 001-020 checkpoint
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '9818465016'
          path: ${{ runner.temp }}/prior-001-020
          github-token: ${{ github.token }}
          repository: SupraLINUX/SupraLINUX
          run-id: '33546093974'
          digest-mismatch: error

      - name: Download exact 021-040 checkpoint
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '9824689982'
          path: ${{ runner.temp }}/prior-021-040
          github-token: ${{ github.token }}
          repository: SupraLINUX/SupraLINUX
          run-id: '33561782526'
          digest-mismatch: error

      - name: Download exact 041-043 r2 checkpoint
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '9892762100'
          path: ${{ runner.temp }}/prior-041-043-r2
          github-token: ${{ github.token }}
          repository: SupraLINUX/SupraLINUX
          run-id: '33753437984'
          digest-mismatch: error

      - name: Download exact 044-060 r2 checkpoint
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '9900367299'
          path: ${{ runner.temp }}/prior-044-060-r2
          github-token: ${{ github.token }}
          repository: SupraLINUX/SupraLINUX
          run-id: '33767306768'
          digest-mismatch: error

      - name: Download exact accepted 061-065 r2 build checkpoint
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '9913134271'
          path: ${{ runner.temp }}/prior-061-065-r2
          github-token: ${{ github.token }}
          repository: SupraLINUX/SupraLINUX
          run-id: '33805321380'
          digest-mismatch: error

      - name: Download exact independent order-65 acceptance evidence
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '9918320108'
          path: ${{ runner.temp }}/accept-061-065-r2
          github-token: ${{ github.token }}
          repository: SupraLINUX/SupraLINUX
          run-id: '33821228782'
          digest-mismatch: error

      - name: Verify accepted order-65 gate and restore exact 001-065 chain
        shell: bash
        run: |
          set -euo pipefail
          base=build/ksq-1/native-range-066-080-r2
          accept="$RUNNER_TEMP/accept-061-065-r2"
          test -f "$accept/acceptance.env"
          grep -qx 'AURORA_KSQ_1_ORDER65_ACCEPTANCE_STATUS=PASS' "$accept/acceptance.env"
          grep -qx 'AURORA_KSQ_1_ORDER65_ACCEPTED_THROUGH_ORDER=65' "$accept/acceptance.env"
          grep -qx 'AURORA_KSQ_1_ORDER65_ACCEPTED_ACCUMULATED_DEBS=295' "$accept/acceptance.env"
          grep -qx 'AURORA_KSQ_1_ORDER65_ACCEPTED_SOLVER_PACKAGES=375' "$accept/acceptance.env"
          grep -qx 'AURORA_KSQ_1_ORDER65_ACCEPTED_INSTALLED_SELECTION=375' "$accept/acceptance.env"
          grep -qx 'AURORA_KSQ_1_ORDER65_ACCEPTED_BOOTSTRAP_VARIANT=apt' "$accept/acceptance.env"
          grep -qx 'AURORA_KSQ_1_ORDER65_ACCEPTED_INSTALL_RECOMMENDS=true' "$accept/acceptance.env"
          grep -qx 'AURORA_KSQ_1_ORDER65_ACCEPTED_RUNTIME_AUTO_UNLOCK_CERTIFIED=no' "$accept/acceptance.env"
          (cd "$accept" && sha256sum -c evidence.sha256 && sha256sum -c artifact-manifest.sha256)
          cp -a "$accept" "$base/order65-acceptance-evidence"

          pick_root() {
            local download="$1" chunk="$2"
            local found=()
            [[ -d "$download/ksq-1/full/$chunk" ]] && found+=("$download")
            [[ -d "$download/build/ksq-1/full/$chunk" ]] && found+=("$download/build")
            [[ "${#found[@]}" -eq 1 ]] || {
              echo "AURORA_CHECKPOINT_ROOT_AMBIGUOUS download=$download chunk=$chunk matches=${#found[@]}" >&2
              exit 1
            }
            printf '%s\n' "${found[0]}"
          }

          r1="$(pick_root "$RUNNER_TEMP/prior-001-020" chunk-001-020)"
          r2="$(pick_root "$RUNNER_TEMP/prior-021-040" chunk-021-040)"
          r3="$(pick_root "$RUNNER_TEMP/prior-041-043-r2" chunk-041-043)"
          r4="$(pick_root "$RUNNER_TEMP/prior-044-060-r2" chunk-044-060)"
          r5="$(pick_root "$RUNNER_TEMP/prior-061-065-r2" chunk-061-065)"

          cat > "$base/checkpoint-spec.json" <<EOF_JSON
          [
            {"root":"$r1","first_order":1,"last_order":20,"run_id":33546093974,"artifact_id":9818465016,"artifact_digest":"sha256:0eb45c7938b84db35ee734591622a6c621709117100d29376c01323ca0ab14ba","new_debs":103,"accumulated_debs":103,"new_debs_manifest_sha256":"b0be04014893808a79aaea514e2a5c4bc968b5c9c9769d8d7ea6cae7992b01f9","build_manifest_sha256":"ff87f96c85bc4ba1553f16b3700cf701eca04e9b749a1c739bb1088cceb3485b"},
            {"root":"$r2","first_order":21,"last_order":40,"run_id":33561782526,"artifact_id":9824689982,"artifact_digest":"sha256:08dffb19fe6d3fda5b8079ed862d3215440cfabaf51a249f79b5af49d3539d8e","new_debs":89,"accumulated_debs":192,"new_debs_manifest_sha256":"3924d0151581a53f505ca8cd0a615b4ffee9c246afeabec003633905db159bfa","build_manifest_sha256":"6e121efdeb62b8c0c6c48ae14f60e41e452e16fe177f03536f1c2677848b111a"},
            {"root":"$r3","first_order":41,"last_order":43,"run_id":33753437984,"artifact_id":9892762100,"artifact_digest":"sha256:7a118c3225143021056781e2b45af114e719a1e5382bda5a1819c7346312b0f0","new_debs":13,"accumulated_debs":205,"new_debs_manifest_sha256":"d5e6cbd51cac0ac2d2dca953722ccbd1a43beb3c981766f683ae69ace539105c","build_manifest_sha256":"e4311aeba5c7856ac2c0ff803c9adc2fdcb63adb104d1a8f2707a1fc45696ab1"},
            {"root":"$r4","first_order":44,"last_order":60,"run_id":33767306768,"artifact_id":9900367299,"artifact_digest":"sha256:41a50bb17ea5ca4ab63c43a6aa6d6d030dae310ba716866824ac72d6c61dc4f3","new_debs":70,"accumulated_debs":275,"new_debs_manifest_sha256":"a712b2f8d67d2bbb8aea4f3ccc6f7af930e4cfc3974f5562c923b12ea23267a5","build_manifest_sha256":"4ac871dc0865bb10b27f0b23db8b8969e595c67ab4faa75dd295b0877ccaf709"},
            {"root":"$r5","first_order":61,"last_order":65,"run_id":33805321380,"artifact_id":9913134271,"artifact_digest":"sha256:035b5930f3821d764f51f7bf4b3bd2b8e82a302539e70c2c612b93f41d3e2e65","new_debs":20,"accumulated_debs":295,"new_debs_manifest_sha256":"4a3384fa85ebe543c79a4c6e67341ab526ec1b4a010e137da3e39b24a4d94960","build_manifest_sha256":"2e983b7549d24ddf8af0fd4235224b05ba78f91d8422f8f9189ef9bf156b7c13"}
          ]
          EOF_JSON

          python3 scripts/ci/restore-ksq-1-checkpoint-chain.py \
            --spec "$base/checkpoint-spec.json" \
            --target build/ksq-1/full/debs \
            --evidence "$base/checkpoint-evidence"

          grep -qx 'AURORA_KSQ_1_CHECKPOINT_CHAIN=PASS' "$base/checkpoint-evidence/checkpoint-status.env"
          grep -qx 'AURORA_KSQ_1_CHECKPOINT_RANGES=5' "$base/checkpoint-evidence/checkpoint-status.env"
          grep -qx 'AURORA_KSQ_1_CHECKPOINT_LAST_ORDER=65' "$base/checkpoint-evidence/checkpoint-status.env"
          grep -qx 'AURORA_KSQ_1_CHECKPOINT_DEBS=295' "$base/checkpoint-evidence/checkpoint-status.env"
          grep -qx 'AURORA_KSQ_1_CHECKPOINT_OVERLAP=none' "$base/checkpoint-evidence/checkpoint-status.env"
          test "$(find build/ksq-1/full/debs -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 295

      - name: Download and validate canonical corrected r2 slice
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=build/ksq-1/native-range-066-080-r2
          set -a; source scripts/ci/aurora-ksq-snapshot-release.env; set +a
          test "$AURORA_KSQ_SNAPSHOT_RELEASE_STATUS" = INDEPENDENTLY_VALIDATED
          test "$AURORA_KSQ_SNAPSHOT_SLICE_ID" = 20260829T022000Z-r2
          test "$AURORA_KSQ_UBUNTU_SNAPSHOT" = 20260829T022000Z
          test "$AURORA_KSQ_SNAPSHOT_ARCH" = amd64
          test "$AURORA_KSQ_SNAPSHOT_ARCH_VARIANTS" = disabled
          test "$AURORA_KSQ_SNAPSHOT_INSTALL_RECOMMENDS" = default
          test "$AURORA_KSQ_SNAPSHOT_BINARY_OBJECTS" = 1783
          test "$AURORA_KSQ_SNAPSHOT_BINARY_BYTES" = 785219274

          out="$RUNNER_TEMP/release-r2"; mkdir -p "$out"
          archive="$out/$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET"
          manifest="$out/$AURORA_KSQ_SNAPSHOT_RELEASE_MANIFEST"
          for spec in "$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET_ID:$archive" "$AURORA_KSQ_SNAPSHOT_RELEASE_MANIFEST_ASSET_ID:$manifest"; do
            id="${spec%%:*}"; file="${spec#*:}"
            curl --fail --location --retry 5 --retry-all-errors \
              -H 'Accept: application/octet-stream' -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$id" -o "$file"
          done
          test "$(stat -c '%s' "$archive")" = "$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET_BYTES"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET_SHA256"
          test "$(sha256sum "$manifest" | awk '{print $1}')" = "$AURORA_KSQ_SNAPSHOT_RELEASE_MANIFEST_SHA256"
          grep -qx 'AURORA_KSQ_SNAPSHOT_INSTALL_RECOMMENDS=default' "$manifest"
          grep -qx 'AURORA_KSQ_SNAPSHOT_BINARY_OBJECTS=1783' "$manifest"

          sudo install -d /opt/supralinux/archive
          sudo tar -C /opt/supralinux/archive -xf "$archive"
          slice="/opt/supralinux/archive/$AURORA_KSQ_SNAPSHOT_SLICE_ID"
          python3 scripts/ci/ksq-snapshot-slice-r2.py validate --slice-root "$slice"
          cp "$manifest" "$base/"
          sha256sum "$archive" "$manifest" > "$base/r2-release-assets.sha256"

      - name: Recreate certified metadata and clean r2 native buildd environment
        shell: bash
        run: |
          set -euo pipefail
          base=build/ksq-1/native-range-066-080-r2
          set -a; source scripts/ci/aurora-ksq-snapshot-release.env; set +a
          slice="/opt/supralinux/archive/$AURORA_KSQ_SNAPSHOT_SLICE_ID"

          python3 scripts/ci/restore-ksq-0-certified-evidence.py --slice-root "$slice" --workspace "$GITHUB_WORKSPACE"
          bash scripts/ci/validate-kde-stack-source-manifests.sh
          python3 scripts/ci/validate-kde-stack-roots.py

          aptiso="$RUNNER_TEMP/ksq-apt-isolation"
          mkdir -p "$aptiso/parts"; : > "$aptiso/main.conf"
          printf 'Dir::Etc::Parts "%s";\nDir::Etc::main "%s";\n' "$aptiso/parts" "$aptiso/main.conf" > "$aptiso/preload.conf"
          APT_CONFIG="$aptiso/preload.conf" AURORA_KSQ_LOCAL_SLICE_ROOT="$slice" \
            bash scripts/ci/prepare-ksq-1-local-apt-metadata.sh 2>&1 | tee "$base/local-apt-metadata.log"
          if grep -Eq 'c-n-f|/cnf/|Components' "$base/local-apt-metadata.log"; then
            echo AURORA_NATIVE_APT_ISOLATION_FAILURE >&2; exit 1
          fi
          grep -Fq "file:$slice/ubuntu" "$base/local-apt-metadata.log"

          python3 scripts/ci/generate-kde-build-closure.py
          cmp build/ksq-0/build-order.tsv build/ksq-0/canonical/build-order.tsv
          cmp build/ksq-0/closure-status.env build/ksq-0/canonical/closure-status.env
          test "$(sha256sum build/ksq-0/build-order.tsv | awk '{print $1}')" = 9c53547df78a9f7c740228aba09490dfdb68e6307d2200e12ebf907dfa3fcb88

          python3 - <<'PY'
          import csv
          from pathlib import Path
          expected = [
              (66,'kf6-kxmlgui','6.29.0-0ubuntu1','frameworks-6.29.0','rebuild'),
              (67,'kf6-kio','6.29.0-0ubuntu1','frameworks-6.29.0','rebuild'),
              (68,'drkonqi','6.7.4-1ubuntu1','plasma-6.7.4','rebuild'),
              (69,'kf6-baloo','6.29.0-0ubuntu1','frameworks-6.29.0','rebuild'),
              (70,'kf6-kcmutils','6.29.0-0ubuntu1','frameworks-6.29.0','rebuild'),
              (71,'kf6-knotifyconfig','6.29.0-0ubuntu1','frameworks-6.29.0','rebuild'),
              (72,'kf6-kparts','6.29.0-0ubuntu1','frameworks-6.29.0','rebuild'),
              (73,'kglobalacceld','6.7.4-0ubuntu1','plasma-6.7.4','rebuild'),
              (74,'xdg-desktop-portal-kde','6.7.4-0ubuntu1','plasma-6.7.4','rebuild'),
              (75,'flatpak-kcm','6.7.4-0ubuntu1','plasma-6.7.4','rebuild'),
              (76,'kf6-knewstuff','6.29.0-0ubuntu1','frameworks-6.29.0','rebuild'),
              (77,'kinfocenter','4:6.7.4-0ubuntu1','plasma-6.7.4','rebuild'),
              (78,'krdp','6.7.4-0ubuntu2','plasma-6.7.4','rebuild'),
              (79,'plasma-disks','6.7.4-1ubuntu1','plasma-6.7.4','rebuild'),
              (80,'systemsettings','4:6.7.4-0ubuntu1','plasma-6.7.4','rebuild'),
          ]
          with open('build/ksq-0/build-order.tsv', newline='', encoding='utf-8') as f:
              rows=list(csv.DictReader(f, delimiter='\t'))
          got=[(int(r['order']),r['source_package'],r['packaging_version'],r['candidate_family'],r['decision']) for r in rows if 66 <= int(r['order']) <= 80]
          if got != expected:
              raise SystemExit(f'orders 66-80 drifted: {got!r}')
          with open('tests/kde-stack/ksq-1-packaging-adaptations.tsv', newline='', encoding='utf-8') as f:
              adaptations=list(csv.DictReader(f, delimiter='\t'))
          targets={(source,version) for _,source,version,_,_ in expected}
          leaked=[r for r in adaptations if (r['source_package'],r['source_version']) in targets]
          if leaked:
              raise SystemExit(f'orders 66-80 unexpectedly declare packaging adaptations: {leaked!r}')
          print('AURORA_KSQ_1_RANGE_066_080_DECLARED_ADAPTATIONS=0')
          PY

          AURORA_KSQ_LOCAL_SLICE_ROOT="$slice" bash scripts/ci/prepare-ksq-1-local-build-environment.sh \
            2>&1 | tee "$base/mmdebstrap-buildd.log"
          test -s build/ksq-1/environment/resolute-amd64-buildd.tar.zst
          grep -Fq "AURORA_KSQ_1_BUILD_ENV_LOCAL_SLICE=$slice" build/ksq-1/environment/build-environment.env

          bash scripts/ci/configure-ksq-1-native-sbuild-network-proof.sh 2>&1 | tee "$base/network-proof-config.log"
          grep -qx 'AURORA_KSQ_1_NATIVE_NETWORK_PROOF=PASS' build/ksq-1/environment/native-sbuild-network-proof.env

      - name: Build native range 066-080 against r2
        shell: bash
        run: |
          set -euo pipefail
          base=build/ksq-1/native-range-066-080-r2
          . build/ksq-1/environment/build-environment.env
          export SBUILD_CONFIG="$AURORA_KSQ_1_SBUILD_CONFIG"
          set +e
          bash scripts/ci/build-ksq-1-range.sh 66 80 2>&1 | tee "$base/range.log"
          pipe_status=("${PIPESTATUS[@]}")
          set -e
          {
            echo "AURORA_NATIVE_RANGE_066_080_R2_COMMAND_RC=${pipe_status[0]}"
            echo "AURORA_NATIVE_RANGE_066_080_R2_TEE_RC=${pipe_status[1]}"
          } > "$base/range-command.env"
          exit 0

      - name: Audit complete r2 range and zero-adaptation contract
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          base=build/ksq-1/native-range-066-080-r2
          chunk=build/ksq-1/full/chunk-066-080
          evidence="$chunk/evidence"
          status=FAIL
          command_rc=missing; tee_rc=missing; new_debs=missing; accumulated_debs=missing

          start="$(cat "$base/host-evidence/start-time.txt")"
          sudo journalctl -k --since "$start" --no-pager 2>/dev/null \
            | grep 'apparmor="DENIED"' > "$base/host-evidence/apparmor-denied-all.log" || true
          grep -Ei 'profile="[^\"]*(sbuild|mmdebstrap|unprivileged_userns)[^\"]*"|comm="(sbuild|mmdebstrap|unshare|mount|newuidmap|newgidmap)"' \
            "$base/host-evidence/apparmor-denied-all.log" > "$base/host-evidence/apparmor-denied-relevant.log" || true
          denials="$(wc -l < "$base/host-evidence/apparmor-denied-relevant.log")"

          if [[ -f "$base/range-command.env" ]]; then
            . "$base/range-command.env"
            command_rc="$AURORA_NATIVE_RANGE_066_080_R2_COMMAND_RC"
            tee_rc="$AURORA_NATIVE_RANGE_066_080_R2_TEE_RC"
          fi
          if [[ -f "$evidence/range-status.env" ]]; then
            new_debs="$(sed -n 's/^AURORA_KSQ_1_RANGE_NEW_DEBS=//p' "$evidence/range-status.env")"
            accumulated_debs="$(sed -n 's/^AURORA_KSQ_1_RANGE_ACCUMULATED_DEBS=//p' "$evidence/range-status.env")"
          fi

          if [[ "$command_rc" == 0 && "$tee_rc" == 0 && "$denials" -eq 0 \
                && "$new_debs" =~ ^[0-9]+$ && "$accumulated_debs" =~ ^[0-9]+$ \
                && "$new_debs" -gt 0 && "$accumulated_debs" -eq $((295 + new_debs)) \
                && -f "$evidence/range-status.env" && -f "$evidence/build-manifest.tsv" \
                && -f "$evidence/new-debs.sha256" ]]; then
            if grep -qx 'AURORA_KSQ_1_RANGE_STATUS=PASS' "$evidence/range-status.env" \
              && grep -qx 'AURORA_KSQ_1_RANGE_FIRST_ORDER=66' "$evidence/range-status.env" \
              && grep -qx 'AURORA_KSQ_1_RANGE_LAST_ORDER=80' "$evidence/range-status.env" \
              && grep -qx 'AURORA_KSQ_1_RANGE_SOURCES=15' "$evidence/range-status.env"; then
              python3 - "$evidence/build-manifest.tsv" "$evidence" <<'PY'
          import csv, sys
          from pathlib import Path
          manifest, evidence = Path(sys.argv[1]), Path(sys.argv[2])
          expected = [
              (66,'kf6-kxmlgui','6.29.0-0ubuntu1','frameworks-6.29.0','rebuild'),
              (67,'kf6-kio','6.29.0-0ubuntu1','frameworks-6.29.0','rebuild'),
              (68,'drkonqi','6.7.4-1ubuntu1','plasma-6.7.4','rebuild'),
              (69,'kf6-baloo','6.29.0-0ubuntu1','frameworks-6.29.0','rebuild'),
              (70,'kf6-kcmutils','6.29.0-0ubuntu1','frameworks-6.29.0','rebuild'),
              (71,'kf6-knotifyconfig','6.29.0-0ubuntu1','frameworks-6.29.0','rebuild'),
              (72,'kf6-kparts','6.29.0-0ubuntu1','frameworks-6.29.0','rebuild'),
              (73,'kglobalacceld','6.7.4-0ubuntu1','plasma-6.7.4','rebuild'),
              (74,'xdg-desktop-portal-kde','6.7.4-0ubuntu1','plasma-6.7.4','rebuild'),
              (75,'flatpak-kcm','6.7.4-0ubuntu1','plasma-6.7.4','rebuild'),
              (76,'kf6-knewstuff','6.29.0-0ubuntu1','frameworks-6.29.0','rebuild'),
              (77,'kinfocenter','4:6.7.4-0ubuntu1','plasma-6.7.4','rebuild'),
              (78,'krdp','6.7.4-0ubuntu2','plasma-6.7.4','rebuild'),
              (79,'plasma-disks','6.7.4-1ubuntu1','plasma-6.7.4','rebuild'),
              (80,'systemsettings','4:6.7.4-0ubuntu1','plasma-6.7.4','rebuild'),
          ]
          with manifest.open(newline='', encoding='utf-8') as f:
              rows=list(csv.DictReader(f, delimiter='\t'))
          got=[(int(r['order']),r['source_package'],r['packaging_base'],r['candidate_family'],r['decision']) for r in rows]
          if got != expected:
              raise SystemExit(f'manifest identity mismatch: {got!r}')
          if any(r['result'] != 'PASS' for r in rows):
              raise SystemExit('manifest contains non-PASS source')
          for order, source, *_ in expected:
              prep=evidence/f'{order}-{source}'/'prepared-source.env'
              if not prep.is_file():
                  raise SystemExit(f'missing prepared-source evidence: {prep}')
              values={}
              for line in prep.read_text().splitlines():
                  if '=' in line:
                      k,v=line.split('=',1); values[k]=v
              if values.get('AURORA_KSQ_1_PACKAGING_ADAPTATIONS_APPLIED') != '0':
                  raise SystemExit(f'{order} {source}: packaging adaptation applied unexpectedly')
              if values.get('AURORA_KSQ_1_PACKAGING_ADAPTATION_IDS') != '-':
                  raise SystemExit(f'{order} {source}: packaging adaptation id leaked')
          print('AURORA_NATIVE_RANGE_066_080_MANIFEST=PASS')
          print('AURORA_NATIVE_RANGE_066_080_ZERO_ADAPTATIONS=PASS')
          PY

              mapfile -t build_logs < <(find "$evidence" -mindepth 2 -maxdepth 2 -type f -name '*.build' -print | sort)
              logs_ok=1
              [[ "${#build_logs[@]}" -eq 15 ]] || logs_ok=0
              for log in "${build_logs[@]}"; do
                grep -q 'AURORA_NATIVE_BUILD_NETWORK_WRAPPER=START' "$log" || logs_ok=0
                grep -q 'AURORA_NATIVE_BUILD_NETNS_DIFFERENT=PASS' "$log" || logs_ok=0
                grep -q 'AURORA_NATIVE_BUILD_PROC_NETIFS=lo' "$log" || logs_ok=0
                grep -q 'AURORA_NATIVE_BUILD_PROC_NETIFS_ONLY_LO=PASS' "$log" || logs_ok=0
                grep -q 'AURORA_NATIVE_BUILD_IPV4_ROUTES=0' "$log" || logs_ok=0
                grep -q 'AURORA_NATIVE_BUILD_IPV4_ROUTE_ISOLATION=PASS' "$log" || logs_ok=0
                grep -q 'AURORA_NATIVE_BUILD_NETWORK=isolated' "$log" || logs_ok=0
                grep -q '^Status: successful$' "$log" || logs_ok=0
                if grep -Ei '^(Get|Hit|Ign|Err):.*https?://' "$log"; then logs_ok=0; fi
              done

              if [[ "$logs_ok" -eq 1 ]]; then
                test "$(find "$chunk/new-debs" -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq "$new_debs"
                (cd "$chunk/new-debs" && sha256sum -c ../evidence/new-debs.sha256)
                test "$(find build/ksq-1/full/debs -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq "$accumulated_debs"
                status=PASS
              fi
            fi
          fi

          {
            echo "AURORA_NATIVE_RANGE_066_080_R2_COMMAND_RC=$command_rc"
            echo "AURORA_NATIVE_RANGE_066_080_R2_TEE_RC=$tee_rc"
            echo "AURORA_NATIVE_RANGE_066_080_R2_APPARMOR_DENIALS=$denials"
            echo "AURORA_NATIVE_RANGE_066_080_R2_PRIOR_DEBS=295"
            echo "AURORA_NATIVE_RANGE_066_080_R2_NEW_DEBS=$new_debs"
            echo "AURORA_NATIVE_RANGE_066_080_R2_ACCUMULATED_DEBS=$accumulated_debs"
            echo "AURORA_NATIVE_RANGE_066_080_R2_PACKAGING_ADAPTATIONS=0"
            echo "AURORA_NATIVE_RANGE_066_080_R2_DRKONQI_REPRODUCIBILITY_CERTIFIED=no"
            echo "AURORA_NATIVE_RANGE_066_080_R2_DOCKER_USED=0"
            echo "AURORA_NATIVE_RANGE_066_080_R2_CUSTOM_APPARMOR_USED=0"
            echo "AURORA_NATIVE_RANGE_066_080_R2_UIDMAP_FILECAP_PATCH_USED=0"
            echo "AURORA_NATIVE_RANGE_066_080_R2_STATUS=$status"
          } | tee "$base/audit.env"

          [[ ! -f "$evidence/build-manifest.tsv" ]] || sha256sum "$evidence/build-manifest.tsv" > "$base/build-manifest.sha256"
          [[ ! -f "$evidence/new-debs.sha256" ]] || sha256sum "$evidence/new-debs.sha256" > "$base/new-debs-manifest.sha256"

      - name: Upload complete r2 range evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-native-range-066-080-r2
          path: |
            build/ksq-1/native-range-066-080-r2/
            build/ksq-1/environment/*.env
            build/ksq-1/environment/*.txt
            build/ksq-1/environment/*.sha256
            build/ksq-1/environment/sbuild-local.conf
            build/ksq-1/full/chunk-066-080/evidence/
            build/ksq-1/full/chunk-066-080/new-debs/
            build/ksq-0/build-order.tsv
            build/ksq-0/closure-status.env
            tests/kde-stack/ksq-1-packaging-adaptations.tsv
            scripts/ci/aurora-ksq-snapshot-release.env
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce complete r2 range
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat build/ksq-1/native-range-066-080-r2/audit.env
          grep -qx 'AURORA_NATIVE_RANGE_066_080_R2_STATUS=PASS' build/ksq-1/native-range-066-080-r2/audit.env
          grep -qx 'AURORA_NATIVE_RANGE_066_080_R2_PACKAGING_ADAPTATIONS=0' build/ksq-1/native-range-066-080-r2/audit.env
          grep -qx 'AURORA_NATIVE_RANGE_066_080_R2_DRKONQI_REPRODUCIBILITY_CERTIFIED=no' build/ksq-1/native-range-066-080-r2/audit.env

name: KDE Attica packaging reference tree

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/run-kde-attica-packaging-reference.sh'
      - '.github/workflows/kde-attica-packaging-reference.yml'
      - 'docs/kde-attica-packaging.md'
      - 'packages/kde/attica/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/run-kde-attica-packaging-reference.sh'
      - '.github/workflows/kde-attica-packaging-reference.yml'
      - 'docs/kde-attica-packaging.md'
      - 'packages/kde/attica/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attica-packaging-reference:
    name: Capture pinned Attica Debian packaging references
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Capture pinned Ubuntu/Debian packaging trees
        run: scripts/run-kde-attica-packaging-reference.sh

      - name: Upload Attica packaging-reference evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kde-attica-packaging-reference-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/kde-attica-packaging-reference/
          if-no-files-found: error
          retention-days: 30

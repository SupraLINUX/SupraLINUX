name: Probe KDE Tier 1 Batch 7 upstream layout

on:
  push:
    branches:
      - tooling/batch7-upstream-layout-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install upstream/provider build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build curl pkgconf \
            python3 python3-dev libshiboken6-dev libpyside6-dev \
            qt6-base-dev qt6-base-private-dev qt6-declarative-dev qt6-tools-dev qt6-wayland-dev \
            libical-dev libmount-dev libudev-dev \
            libwayland-dev wayland-protocols plasma-wayland-protocols \
            libx11-dev libxcb1-dev libxkbcommon-dev \
            shared-mime-info gettext

      - name: Probe upstream default build/install layout
        shell: bash
        run: bash scripts/probe-kde-tier1-batch7-upstream-layout.sh

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kde-tier1-batch7-upstream-layout-${{ github.sha }}
          path: batch7-upstream-probe/
          if-no-files-found: error
          retention-days: 30

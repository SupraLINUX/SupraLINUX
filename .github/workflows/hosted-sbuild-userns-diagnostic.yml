name: Hosted sbuild unshare namespace diagnostic (not a package gate)

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
  push:
    branches: [architecture/bootstrap-v1]
    paths:
      - scripts/diagnose-sbuild-userns.sh
      - scripts/probe-hosted-sbuild-backend.sh
      - .github/workflows/hosted-sbuild-userns-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: hosted-sbuild-userns-diagnostic-${{ github.sha }}
  cancel-in-progress: false

jobs:
  namespaces:
    if: ${{ github.event_name != 'pull_request' }}
    name: Collect Ubuntu 26.04 UID/GID namespace evidence (not sbuild PASS)
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate probe syntax and Ubuntu runner identity
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n scripts/diagnose-sbuild-userns.sh
          python3 scripts/check-source-syntax.py

      - name: Install only namespace diagnostic prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends uidmap util-linux sbuild mmdebstrap dpkg-dev

      - name: Record non-authoritative namespace capabilities
        run: bash scripts/diagnose-sbuild-userns.sh evidence/hosted-sbuild-userns

      - name: Run small unprivileged sbuild debug smoke outside KVM
        run: bash scripts/probe-hosted-sbuild-backend.sh evidence/hosted-sbuild-backend host

      - name: Retain scoped diagnostic evidence (not a certificate)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-sbuild-userns-diagnostic-${{ github.sha }}
          path: |
            evidence/hosted-sbuild-userns/
            evidence/hosted-sbuild-backend/
          if-no-files-found: warn
          retention-days: 30

  guest:
    if: >-
      ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' &&
          github.event.label.name == 'ci:hosted-sbuild-guest' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    name: Verify sbuild with existing Ubuntu KVM snapshot, no base rebuild
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    env:
      SUPRALINUX_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Check source syntax and fixture admission
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$SUPRALINUX_EXPECTED_HEAD"
          python3 scripts/check-source-syntax.py
          python3 scripts/test-hosted-ubuntu-guest-snapshot.py

      - name: Install official Ubuntu QEMU test tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autopkgtest vmdb2 debootstrap qemu-system-x86 qemu-utils grub-pc-bin acl ubuntu-keyring

      - name: Permit runner user access to KVM
        run: |
          set -euo pipefail
          test -c /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          fi
          test -r /dev/kvm && test -w /dev/kvm

      - name: Determine original snapshot cache key
        id: period
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore certified existing QCOW2, never rebuild
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .work/hosted-ubuntu-guest/base/
          key: hosted-ubuntu26-qemu-base-v1-${{ steps.period.outputs.week }}-${{ hashFiles('scripts/hosted-ubuntu-guest-lane.sh', 'scripts/hosted-ubuntu-guest-snapshot.py', '.github/workflows/hosted-ubuntu-guest-probe.yml') }}

      - name: Reject missing certified cache
        env:
          SUPRALINUX_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ "$SUPRALINUX_CACHE_HIT" != true ]]; then
            echo 'BLOCKED: original certified snapshot unavailable; not rebuilding' >&2
            exit 1
          fi

      - name: Run single diagnostic DEP-8 in ephemeral KVM overlay
        run: bash scripts/verify-hosted-sbuild-guest.sh

      - name: Preserve scoped diagnostic, no base upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-sbuild-guest-${{ github.event.pull_request.head.sha }}
          path: |
            .work/hosted-sbuild-guest/evidence/
            .work/hosted-sbuild-guest/autopkgtest/summary
            .work/hosted-sbuild-guest/autopkgtest/log
          if-no-files-found: warn
          retention-days: 30

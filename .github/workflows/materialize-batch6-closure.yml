name: Materialize Batch 6 canonical closure
on:
  push:
    branches:
      - tooling/batch6-closure-materialize
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Materialize closure
        run: python3 scripts/materialize-kde-tier1-batch6-closure.py
      - name: Validate generated JSON and Python
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool manifests/kde-tier1-package-campaign-batch6.json >/dev/null
          python3 -m json.tool manifests/kde-frameworks-tier1.json >/dev/null
          python3 -m json.tool manifests/kde-dag.json >/dev/null
          python3 -m py_compile scripts/validate_kde_tier1_package_batch6.py
          python3 scripts/validate_kde_tier1_package_batch6.py
      - name: Commit materialized blobs on tooling branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SupraLINUX CI'
          git config user.email 'ci@supralinux.invalid'
          git add \
            manifests/kde-tier1-package-campaign-batch6.json \
            manifests/kde-frameworks-tier1.json \
            manifests/kde-dag.json \
            scripts/validate_kde_tier1_package_batch6.py \
            docs/kde-tier1-package-batch6.md \
            docs/status/2026-09-15-batch6.md \
            docs/status/2026-09-15.md \
            docs/kde-tier1-dependencies.md \
            docs/kde-dag.md
          git diff --cached --check
          git commit -m 'tooling: materialize Batch 6 closure blobs'
          git push origin HEAD:tooling/batch6-closure-materialize

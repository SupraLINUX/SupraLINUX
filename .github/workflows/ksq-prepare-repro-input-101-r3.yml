name: Aurora KSQ-1 canonical repro input 101 r3

on:
  push:
    branches:
      - feature/kde-stack-qualification
    paths:
      - '.github/ksq-r3-repro-input-101-trigger.env'

permissions:
  contents: read
  actions: read

concurrency:
  group: aurora-ksq-repro-input-101-r3
  cancel-in-progress: false

jobs:
  canonicalize:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Assemble and self-verify canonical candidate input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/prepare-ksq-1-repro-input-101-r3.sh

      - name: Upload canonical reproducibility input
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-repro-input-101-r3
          path: |
            build/ksq-1/repro-input-101-r3/payload/
            build/ksq-1/repro-input-101-r3/provenance/
            build/ksq-1/repro-input-101-r3/provenance.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 1

      - name: Record artifact trust root
        shell: bash
        run: |
          set -euo pipefail
          raw_digest='${{ steps.upload.outputs.artifact-digest }}'
          artifact_id='${{ steps.upload.outputs.artifact-id }}'
          [[ "$raw_digest" =~ ^[0-9a-f]{64}$ ]]
          [[ "$artifact_id" =~ ^[0-9]+$ ]]
          digest="sha256:${raw_digest}"
          echo "AURORA_KSQ_1_REPRO_INPUT_GITHUB_ARTIFACT_ID=$artifact_id"
          echo "AURORA_KSQ_1_REPRO_INPUT_GITHUB_ARTIFACT_DIGEST=$digest"
          {
            echo '### Aurora KSQ-1 canonical repro input'
            echo
            echo 'Sources: 101'
            echo 'DEBs: 424'
            echo 'Canonical ranges: 5'
            echo "GitHub artifact ID: \`$artifact_id\`"
            echo "GitHub artifact digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

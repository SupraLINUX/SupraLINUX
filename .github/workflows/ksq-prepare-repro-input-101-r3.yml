name: Aurora KSQ-1 canonical repro input 101 r3

on:
  push:
    branches:
      - feature/kde-stack-qualification
    paths:
      - '.github/ksq-r3-repro-input-101-trigger.env'

permissions:
  contents: read
  actions: read

concurrency:
  group: aurora-ksq-repro-input-101-r3
  cancel-in-progress: false

jobs:
  canonicalize:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Qualify immutable acceptance root
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -Eq '^VERSION_ID="26\.04(\.1)?"$' /etc/os-release
          test "$(dpkg --print-architecture)" = amd64
          command -v gh >/dev/null
          command -v curl >/dev/null
          command -v jq >/dev/null
          command -v unzip >/dev/null
          source .github/ksq-r3-repro-input-101-trigger.env
          test "$AURORA_KSQ_R3_REPRO_INPUT_SLICE_ID" = 20260829T022000Z-r3
          test "$AURORA_KSQ_R3_REPRO_INPUT_ACCEPTED101_RUN_ID" = 34002503177
          test "$AURORA_KSQ_R3_REPRO_INPUT_ACCEPTED101_ARTIFACT_ID" = 9979901723
          test "$AURORA_KSQ_R3_REPRO_INPUT_ACCEPTED101_ARTIFACT_DIGEST" = sha256:62b5014923d487e13e9a2377ef91dec4cc1a11a33b75acd6f58f4642b0403e83
          base=build/ksq-1/repro-input-101-r3
          mkdir -p "$base/provenance"
          cp .github/ksq-r3-repro-input-101-trigger.env "$base/provenance/trigger.env"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$AURORA_KSQ_R3_REPRO_INPUT_ACCEPTED101_RUN_ID" > "$base/provenance/accepted101-run.json"
          test "$(jq -r '.status' "$base/provenance/accepted101-run.json")" = completed
          test "$(jq -r '.conclusion' "$base/provenance/accepted101-run.json")" = success
          test "$(jq -r '.head_sha' "$base/provenance/accepted101-run.json")" = 8de6b08456975e391624813776866a138a8ea40e
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$AURORA_KSQ_R3_REPRO_INPUT_ACCEPTED101_ARTIFACT_ID" > "$base/provenance/accepted101-artifact.json"
          test "$(jq -r '.digest' "$base/provenance/accepted101-artifact.json")" = "$AURORA_KSQ_R3_REPRO_INPUT_ACCEPTED101_ARTIFACT_DIGEST"
          test "$(jq -r '.size_in_bytes' "$base/provenance/accepted101-artifact.json")" = 8932
          test "$(jq -r '.workflow_run.id' "$base/provenance/accepted101-artifact.json")" = "$AURORA_KSQ_R3_REPRO_INPUT_ACCEPTED101_RUN_ID"
          test "$(jq -r '.expired' "$base/provenance/accepted101-artifact.json")" = false

      - name: Download exact accepted-101 root
        uses: actions/download-artifact@v8
        with:
          artifact-ids: 9979901723
          path: ${{ runner.temp }}/accepted-101
          github-token: ${{ github.token }}
          repository: SupraLINUX/SupraLINUX
          run-id: 34002503177
          digest-mismatch: error

      - name: Resolve and verify accepted checkpoint chain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=build/ksq-1/repro-input-101-r3
          root="$RUNNER_TEMP/accepted-101"
          (cd "$root" && sha256sum -c evidence.sha256)
          source "$root/acceptance.env"
          test "$AURORA_KSQ_R3_091_101_ACCEPTANCE" = PASS
          test "$AURORA_KSQ_R3_091_101_ACCUMULATED_DEBS" = 424
          test "$AURORA_KSQ_R3_091_101_PRIOR_ACCEPT_ARTIFACT_ID" = 9977725295
          test "$AURORA_KSQ_R3_091_101_SOURCE_ARTIFACT_ID" = 9979632407

          fetch_zip() {
            local id="$1" out="$2"
            mkdir -p "$out"
            curl --fail --location --retry 5 --retry-all-errors \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$out.zip"
            unzip -q "$out.zip" -d "$out"
          }
          record_artifact() {
            local id="$1" digest="$2" run="$3"
            local json="$base/provenance/artifact-$id.json"
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id" > "$json"
            test "$(jq -r '.digest' "$json")" = "$digest"
            test "$(jq -r '.workflow_run.id' "$json")" = "$run"
            test "$(jq -r '.expired' "$json")" = false
          }

          record_artifact 9818465016 sha256:0eb45c7938b84db35ee734591622a6c621709117100d29376c01323ca0ab14ba 33546093974
          record_artifact 9824689982 sha256:08dffb19fe6d3fda5b8079ed862d3215440cfabaf51a249f79b5af49d3539d8e 33561782526
          record_artifact 9892762100 sha256:7a118c3225143021056781e2b45af114e719a1e5382bda5a1819c7346312b0f0 33753437984
          record_artifact 9900367299 sha256:41a50bb17ea5ca4ab63c43a6aa6d6d030dae310ba716866824ac72d6c61dc4f3 33767306768
          record_artifact 9913134271 sha256:035b5930f3821d764f51f7bf4b3bd2b8e82a302539e70c2c612b93f41d3e2e65 33805321380
          record_artifact 9918320108 sha256:50c33e99c7593ce6b8d4a67c8ee11c1598ad93545ed362078a57410c4a892730 33821228782
          record_artifact 9972463409 sha256:e1c9dccad9164a8e8445ff2487fc17d61c55816bfa3c22da385c336cca3feda5 33973287438
          record_artifact 9972976872 sha256:ebd60471d9834efbb4fad9f5680c6a153000aa8b9393f4821a70ff148edc2511 33978315934
          record_artifact 9974023708 sha256:dfa78a851139b279f08d58bef9a0d95fc9261a26c18b6c1dc85a65afe29401ed 33978550975
          record_artifact 9977725295 sha256:aa4d0499623073108161750881eee06804d1a1d20e5cd45e4a83ab4de3ad7d04 33994817042
          record_artifact 9979632407 sha256:0595106d646d61dcd0d65066b69f109823b00802b78ebc2e6547d3fa1eab9e42 33994908104
          record_artifact 9979901723 sha256:62b5014923d487e13e9a2377ef91dec4cc1a11a33b75acd6f58f4642b0403e83 34002503177

          fetch_zip 9918320108 "$RUNNER_TEMP/accepted-065"
          (cd "$RUNNER_TEMP/accepted-065" && sha256sum -c evidence.sha256 && sha256sum -c artifact-manifest.sha256)
          source "$RUNNER_TEMP/accepted-065/acceptance.env"
          test "$AURORA_KSQ_1_ORDER65_ACCEPTANCE_STATUS" = PASS
          test "$AURORA_KSQ_1_ORDER65_ACCEPTED_ACCUMULATED_DEBS" = 295

          fetch_zip 9972976872 "$RUNNER_TEMP/accepted-080"
          (cd "$RUNNER_TEMP/accepted-080" && sha256sum -c evidence.sha256)
          source "$RUNNER_TEMP/accepted-080/acceptance.env"
          test "$AURORA_KSQ_R3_066_080_ACCEPTANCE" = PASS
          test "$AURORA_KSQ_R3_066_080_ACCUMULATED_DEBS" = 345
          test "$AURORA_KSQ_R3_066_080_SOURCE_ARTIFACT_ID" = 9972463409

          fetch_zip 9977725295 "$RUNNER_TEMP/accepted-090"
          (cd "$RUNNER_TEMP/accepted-090" && sha256sum -c evidence.sha256)
          source "$RUNNER_TEMP/accepted-090/acceptance.env"
          test "$AURORA_KSQ_R3_081_090_ACCEPTANCE" = PASS
          test "$AURORA_KSQ_R3_081_090_ACCUMULATED_DEBS" = 376
          test "$AURORA_KSQ_R3_081_090_PRIOR_ACCEPT_ARTIFACT_ID" = 9972976872
          test "$AURORA_KSQ_R3_081_090_SOURCE_ARTIFACT_ID" = 9974023708

          fetch_zip 9818465016 "$RUNNER_TEMP/input-001-020"
          fetch_zip 9824689982 "$RUNNER_TEMP/input-021-040"
          fetch_zip 9892762100 "$RUNNER_TEMP/input-041-043"
          fetch_zip 9900367299 "$RUNNER_TEMP/input-044-060"
          fetch_zip 9913134271 "$RUNNER_TEMP/input-061-065"
          fetch_zip 9972463409 "$RUNNER_TEMP/input-066-080"
          fetch_zip 9974023708 "$RUNNER_TEMP/input-081-090"
          fetch_zip 9979632407 "$RUNNER_TEMP/input-091-101"

          python3 scripts/ci/normalize-ksq-1-repro-input.py \
            --chunk "1-20=$RUNNER_TEMP/input-001-020" \
            --chunk "21-40=$RUNNER_TEMP/input-021-040" \
            --chunk "41-43=$RUNNER_TEMP/input-041-043" \
            --chunk "44-60=$RUNNER_TEMP/input-044-060" \
            --chunk "61-65=$RUNNER_TEMP/input-061-065" \
            --chunk "66-80=$RUNNER_TEMP/input-066-080" \
            --chunk "81-90=$RUNNER_TEMP/input-081-090" \
            --chunk "91-101=$RUNNER_TEMP/input-091-101" \
            --output "$base/payload"

          cat > "$base/provenance/input-artifacts.tsv" <<'EOF'
role	artifact_id	digest	run_id
input-001-020	9818465016	sha256:0eb45c7938b84db35ee734591622a6c621709117100d29376c01323ca0ab14ba	33546093974
input-021-040	9824689982	sha256:08dffb19fe6d3fda5b8079ed862d3215440cfabaf51a249f79b5af49d3539d8e	33561782526
input-041-043	9892762100	sha256:7a118c3225143021056781e2b45af114e719a1e5382bda5a1819c7346312b0f0	33753437984
input-044-060	9900367299	sha256:41a50bb17ea5ca4ab63c43a6aa6d6d030dae310ba716866824ac72d6c61dc4f3	33767306768
input-061-065	9913134271	sha256:035b5930f3821d764f51f7bf4b3bd2b8e82a302539e70c2c612b93f41d3e2e65	33805321380
accept-065	9918320108	sha256:50c33e99c7593ce6b8d4a67c8ee11c1598ad93545ed362078a57410c4a892730	33821228782
input-066-080	9972463409	sha256:e1c9dccad9164a8e8445ff2487fc17d61c55816bfa3c22da385c336cca3feda5	33973287438
accept-080	9972976872	sha256:ebd60471d9834efbb4fad9f5680c6a153000aa8b9393f4821a70ff148edc2511	33978315934
input-081-090	9974023708	sha256:dfa78a851139b279f08d58bef9a0d95fc9261a26c18b6c1dc85a65afe29401ed	33978550975
accept-090	9977725295	sha256:aa4d0499623073108161750881eee06804d1a1d20e5cd45e4a83ab4de3ad7d04	33994817042
input-091-101	9979632407	sha256:0595106d646d61dcd0d65066b69f109823b00802b78ebc2e6547d3fa1eab9e42	33994908104
accept-101	9979901723	sha256:62b5014923d487e13e9a2377ef91dec4cc1a11a33b75acd6f58f4642b0403e83	34002503177
EOF
          cp -a "$root/acceptance.env" "$base/provenance/accepted101.env"
          cp -a "$RUNNER_TEMP/accepted-090/acceptance.env" "$base/provenance/accepted090.env"
          cp -a "$RUNNER_TEMP/accepted-080/acceptance.env" "$base/provenance/accepted080.env"
          cp -a "$RUNNER_TEMP/accepted-065/acceptance.env" "$base/provenance/accepted065.env"

          (
            cd "$base/payload"
            sha256sum -c evidence.sha256
            grep -qx 'AURORA_KSQ_1_REPRO_INPUT_STATUS=PASS' checkpoint-status.env
            grep -qx 'AURORA_KSQ_1_REPRO_INPUT_SOURCES=101' checkpoint-status.env
            grep -qx 'AURORA_KSQ_1_REPRO_INPUT_DEBS=424' checkpoint-status.env
            grep -qx 'AURORA_KSQ_1_REPRO_INPUT_CANONICAL_RANGES=5' checkpoint-status.env
          )
          test "$(find "$base/payload/debs" -maxdepth 1 -type f -name '*.deb' | wc -l)" = 424
          test "$(find "$base/payload/chunks" -type f -name prepared-source.env | wc -l)" = 101
          test "$(find "$base/payload/chunks" -type f -name build-status.env | wc -l)" = 101

          (cd "$base" && find provenance -type f -print0 | sort -z | xargs -0 sha256sum) > "$base/provenance.sha256"
          (cd "$base" && sha256sum -c provenance.sha256)

      - name: Upload canonical reproducibility input
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-repro-input-101-r3
          path: |
            build/ksq-1/repro-input-101-r3/payload/
            build/ksq-1/repro-input-101-r3/provenance/
            build/ksq-1/repro-input-101-r3/provenance.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 1

      - name: Record artifact trust root
        shell: bash
        run: |
          set -euo pipefail
          digest='${{ steps.upload.outputs.digest }}'
          test -n "$digest"
          echo "AURORA_KSQ_1_REPRO_INPUT_GITHUB_ARTIFACT_DIGEST=$digest"
          {
            echo '### Aurora KSQ-1 canonical repro input'
            echo
            echo 'Sources: 101'
            echo 'DEBs: 424'
            echo 'Canonical ranges: 5'
            echo "GitHub artifact digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

name: Temporary Tier 1 batch 2 generator

on:
  push:
    branches: [tmp-tier1-batch2-prep]

permissions:
  contents: write
  actions: read

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Download retained Tier 1 packaging trees
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '10301938362'
          github-token: ${{ github.token }}
          repository: SupraLINUX/SupraLINUX
          run-id: '34708030450'
          path: .work/tier1-reference

      - name: Generate Batch 2 preparation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations
          import json
          import shutil
          from pathlib import Path

          root = Path.cwd()
          ref = root / '.work/tier1-reference'
          assert (ref / 'snapshot.json').is_file()
          signing_source = root / 'packages/kde/threadweaver/debian/upstream/signing-key.asc'
          assert signing_source.is_file()

          node_meta = {
              'ktexttemplate': {
                  'source_package': 'kf6-ktexttemplate',
                  'source_sha256': 'c3c229944d25294102e4e8a5b49fa0c0f481da9d33f8bec3782e8a53afd47493',
                  'root_cmake_blob': 'e68c80cc6106c87e321d23729f882052ab386972',
                  'runtime': 'libkf6texttemplate6', 'dev': 'libkf6texttemplate-dev', 'doc': 'libkf6texttemplate-doc',
                  'soname': 'libKF6TextTemplate.so.6', 'cmake_package': 'KF6TextTemplate', 'cmake_target': 'KF6::TextTemplate',
                  'symbols_file': 'libkf6texttemplate6.symbols', 'symbols_sha256': '552e0c732cef6e8e0679d014fc7416ad23ecaa83322df9475a09d640e9831273',
                  'copyright_sha256': 'b7b88bf2a8f3f4d19fb85b0d00d1464430a4f97a1949616a16a5a956c6c97109',
                  'contracts': [
                      {'name':'libkf6texttemplate-dev','architecture':'amd64','multi_arch':None},
                      {'name':'libkf6texttemplate-doc','architecture':'all','multi_arch':'foreign'},
                      {'name':'libkf6texttemplate6','architecture':'amd64','multi_arch':'same'},
                  ],
              },
              'karchive': {
                  'source_package': 'kf6-karchive',
                  'source_sha256': '4cf89d91e429d2ece3110e78f7ef7011952b0412cb15011329516b46f21e98e2',
                  'root_cmake_blob': '6f86222fb967c7f3e29c15ecef40bf355d8004d0',
                  'runtime': 'libkf6archive6', 'dev': 'libkf6archive-dev', 'doc': 'libkf6archive-doc',
                  'soname': 'libKF6Archive.so.6', 'cmake_package': 'KF6Archive', 'cmake_target': 'KF6::Archive',
                  'symbols_file': 'libkf6archive6.symbols', 'symbols_sha256': 'acd4b767ad9cc821345a973e09c1e42c63d45fc3eef45197a35d84475c83878e',
                  'copyright_sha256': 'c82d4cf65cdfb5255a04d9e842edc6df47aece48318fd4de6c7c9a61660006ff',
                  'contracts': [
                      {'name':'libkf6archive-data','architecture':'all','multi_arch':'foreign'},
                      {'name':'libkf6archive-dev','architecture':'amd64','multi_arch':None},
                      {'name':'libkf6archive-doc','architecture':'all','multi_arch':'foreign'},
                      {'name':'libkf6archive6','architecture':'amd64','multi_arch':'same'},
                  ],
              },
              'kholidays': {
                  'source_package': 'kf6-kholidays',
                  'source_sha256': '02bfbc33296fe86b364491f6d5cad9d83360bb4fdd2923386a325b309eac0b9b',
                  'root_cmake_blob': 'ee43159b9e7259c8c4cefe0db38e2ca715b73ad9',
                  'runtime': 'libkf6holidays6', 'dev': 'libkf6holidays-dev', 'doc': 'libkf6holidays-doc',
                  'soname': 'libKF6Holidays.so.6', 'cmake_package': 'KF6Holidays', 'cmake_target': 'KF6::Holidays',
                  'symbols_file': 'libkf6holidays6.symbols', 'symbols_sha256': 'b0be25ddbc4c7abeb121bb0d3c3ca053d33e2a9fa88695bea210c50d56c256cd',
                  'copyright_sha256': 'c9b4c8797fc5a93733224a2ed442a3de75b3bdb5ef24dd8bdf5abb48d34a1e73',
                  'contracts': [
                      {'name':'libkf6holidays-data','architecture':'all','multi_arch':'foreign'},
                      {'name':'libkf6holidays-dev','architecture':'amd64','multi_arch':'same'},
                      {'name':'libkf6holidays-doc','architecture':'all','multi_arch':'foreign'},
                      {'name':'libkf6holidays6','architecture':'amd64','multi_arch':'same'},
                      {'name':'qml6-module-org-kde-kholidays','architecture':'amd64','multi_arch':'same'},
                  ],
              },
          }

          controls = {
          'ktexttemplate': '''Source: kf6-ktexttemplate
          Section: libs
          Priority: optional
          Maintainer: SupraLINUX Project <packages@supralinux.invalid>
          Build-Depends: debhelper-compat (= 13),
                         dh-sequence-kf6,
                         dh-sequence-pkgkde-symbolshelper,
                         cmake (>= 3.29~),
                         extra-cmake-modules (>= 6.30.0~),
                         qt6-base-dev (>= 6.9.0~),
                         qt6-declarative-dev (>= 6.9.0~),
          Standards-Version: 4.7.3
          Homepage: https://invent.kde.org/frameworks/ktexttemplate
          Rules-Requires-Root: no

          Package: libkf6texttemplate-dev
          Section: libdevel
          Architecture: any
          Depends: libkf6texttemplate6 (= ${binary:Version}),
                   qt6-base-dev (>= 6.9.0~),
                   ${misc:Depends},
          Recommends: libkf6texttemplate-doc (= ${source:Version}),
          Description: development files for KTextTemplate
           Development headers and CMake metadata for KDE Frameworks KTextTemplate.

          Package: libkf6texttemplate-doc
          Section: doc
          Architecture: all
          Multi-Arch: foreign
          Depends: ${misc:Depends},
          Description: documentation compatibility package for KTextTemplate
           Compatibility package retaining the established Debian-family package name.
           QDoc generation is handled separately from the default Framework build.

          Package: libkf6texttemplate6
          Architecture: any
          Multi-Arch: same
          Depends: ${misc:Depends},
                   ${shlibs:Depends},
          Description: text template processing library
           KDE Frameworks KTextTemplate separates document structure from data and
           provides the Django-style template engine used by KDE applications.
          ''',
          'karchive': '''Source: kf6-karchive
          Section: libs
          Priority: optional
          Maintainer: SupraLINUX Project <packages@supralinux.invalid>
          Build-Depends: debhelper-compat (= 13),
                         dh-sequence-kf6,
                         dh-sequence-pkgkde-symbolshelper,
                         cmake (>= 3.29~),
                         extra-cmake-modules (>= 6.30.0~),
                         libbz2-dev,
                         liblzma-dev,
                         libssl-dev,
                         libzstd-dev,
                         pkgconf,
                         qt6-base-dev (>= 6.9.0~),
                         zlib1g-dev,
                         zstd,
          Standards-Version: 4.7.3
          Homepage: https://invent.kde.org/frameworks/karchive
          Rules-Requires-Root: no

          Package: libkf6archive-data
          Architecture: all
          Multi-Arch: foreign
          Depends: ${misc:Depends},
          Description: data files for KArchive
           Translation data for KDE Frameworks KArchive.

          Package: libkf6archive-dev
          Section: libdevel
          Architecture: any
          Depends: libkf6archive6 (= ${binary:Version}),
                   qt6-base-dev (>= 6.9.0~),
                   ${misc:Depends},
          Recommends: libkf6archive-doc (= ${source:Version}),
          Description: development files for KArchive
           Development headers and CMake metadata for KDE Frameworks KArchive.

          Package: libkf6archive-doc
          Section: doc
          Architecture: all
          Multi-Arch: foreign
          Depends: ${misc:Depends},
          Description: documentation compatibility package for KArchive
           Compatibility package retaining the established Debian-family package name.
           QDoc generation is handled separately from the default Framework build.

          Package: libkf6archive6
          Architecture: any
          Multi-Arch: same
          Depends: libkf6archive-data (= ${source:Version}),
                   ${misc:Depends},
                   ${shlibs:Depends},
          Description: archive reading and writing library
           KDE Frameworks KArchive provides ZIP, TAR and transparent compression
           support through Qt I/O abstractions.
          ''',
          'kholidays': '''Source: kf6-kholidays
          Section: libs
          Priority: optional
          Maintainer: SupraLINUX Project <packages@supralinux.invalid>
          Build-Depends: debhelper-compat (= 13),
                         dh-sequence-kf6,
                         dh-sequence-pkgkde-symbolshelper,
                         dh-sequence-qmldeps,
                         bison (>= 2:3.3.2~),
                         cmake (>= 3.29~),
                         extra-cmake-modules (>= 6.30.0~),
                         flex,
                         qt6-base-dev (>= 6.9.0~),
                         qt6-declarative-dev (>= 6.9.0~),
          Standards-Version: 4.7.3
          Homepage: https://invent.kde.org/frameworks/kholidays
          Rules-Requires-Root: no

          Package: libkf6holidays-data
          Architecture: all
          Multi-Arch: foreign
          Depends: ${misc:Depends},
          Description: data files for KHolidays
           Translation and holiday-plan data for KDE Frameworks KHolidays.

          Package: libkf6holidays-dev
          Section: libdevel
          Architecture: any
          Multi-Arch: same
          Depends: libkf6holidays6 (= ${binary:Version}),
                   qml6-module-org-kde-kholidays (= ${binary:Version}),
                   qt6-base-dev (>= 6.9.0~),
                   ${misc:Depends},
          Recommends: libkf6holidays-doc (= ${source:Version}),
          Description: development files for KHolidays
           Development headers and CMake metadata for KDE Frameworks KHolidays.

          Package: libkf6holidays-doc
          Section: doc
          Architecture: all
          Multi-Arch: foreign
          Depends: ${misc:Depends},
          Description: documentation compatibility package for KHolidays
           Compatibility package retaining the established Debian-family package name.
           QDoc generation is handled separately from the default Framework build.

          Package: libkf6holidays6
          Architecture: any
          Multi-Arch: same
          Depends: libkf6holidays-data (= ${source:Version}),
                   ${misc:Depends},
                   ${shlibs:Depends},
          Description: holiday calculation library
           KDE Frameworks KHolidays provides holiday, lunar and astronomical APIs.

          Package: qml6-module-org-kde-kholidays
          Architecture: any
          Multi-Arch: same
          Depends: ${misc:Depends},
                   ${qml6:Depends},
                   ${shlibs:Depends},
          Description: QML bindings for KHolidays
           QML module exposing KDE Frameworks KHolidays APIs.
          ''',
          }

          rules = {
              'ktexttemplate': '''#!/usr/bin/make -f
          export DEB_BUILD_MAINT_OPTIONS = hardening=+all

          %:
          \tdh $@

          override_dh_auto_configure:
          \tdh_auto_configure -- -DBUILD_TESTING=ON

          override_dh_auto_test:
          \tdh_auto_test
          ''',
              'karchive': '''#!/usr/bin/make -f
          export DEB_BUILD_MAINT_OPTIONS = hardening=+all

          %:
          \tdh $@

          override_dh_auto_configure:
          \tdh_auto_configure -- -DBUILD_TESTING=ON

          override_dh_auto_test:
          \tdh_auto_test
          ''',
              'kholidays': '''#!/usr/bin/make -f
          export DEB_BUILD_MAINT_OPTIONS = hardening=+all optimize=+lto

          %:
          \tdh $@

          override_dh_auto_configure:
          \tdh_auto_configure -- -DBUILD_TESTING=ON

          override_dh_auto_test:
          \tdh_auto_test --no-parallel
          ''',
          }

          consumer_main = {
              'ktexttemplate': '''#include <KTextTemplate/Engine>\n\nint main()\n{\n    KTextTemplate::Engine engine;\n    engine.setSmartTrimEnabled(true);\n    return engine.smartTrimEnabled() ? 0 : 1;\n}\n''',
              'karchive': '''#include <KArchive/KZip>\n#include <QString>\n\nint main()\n{\n    KZip archive(QStringLiteral("/tmp/supralinux-karchive-consumer.zip"));\n    archive.setCompression(KZip::NoCompression);\n    return archive.compression() == KZip::NoCompression ? 0 : 1;\n}\n''',
              'kholidays': '''#include <KHolidays/LunarPhase>\n#include <QDate>\n\nint main()\n{\n    const auto phase = KHolidays::LunarPhase::phaseAtDate(QDate(2026, 1, 1));\n    (void)phase;\n    return 0;\n}\n''',
          }

          for node, meta in node_meta.items():
              pkg = root / 'packages/kde' / node
              if pkg.exists():
                  shutil.rmtree(pkg)
              deb = pkg / 'debian'
              (deb / 'source').mkdir(parents=True)
              (deb / 'upstream').mkdir(parents=True)
              (pkg / 'consumer').mkdir(parents=True)
              uref = ref / 'trees/ubuntu' / node / 'debian'
              dref = ref / 'trees/debian' / node / 'debian'
              assert uref.is_dir() and dref.is_dir()
              for src in uref.glob('*.install'):
                  shutil.copy2(src, deb / src.name)
              shutil.copy2(signing_source, deb / 'upstream/signing-key.asc')
              (deb / 'control').write_text(controls[node].replace('          ', ''), encoding='utf-8')
              (deb / 'rules').write_text(rules[node].replace('          ', ''), encoding='utf-8')
              (deb / 'rules').chmod(0o755)
              (deb / 'source/format').write_text('3.0 (quilt)\n', encoding='utf-8')
              (deb / 'watch').write_text(
                  'Version: 5\n'
                  'Source: https://download.kde.org/stable/frameworks/@ANY_VERSION@/\n'
                  f'Matching-Pattern: {node}-@ANY_VERSION@@ARCHIVE_EXT@\n'
                  'Pgp-Mode: auto\n', encoding='utf-8')
              (deb / 'README.source').write_text(
                  f'# SupraLINUX {node} packaging\n\n'
                  'KDE Frameworks 6.30.0 is the source/build authority. Ubuntu Resolute and Debian sid\n'
                  'packaging trees are compatibility references only.\n\n'
                  'The full symbols file is intentionally not duplicated in Git. The Batch 2 hosted\n'
                  'runner verifies and injects the exact Debian 6.28 baseline from workflow run\n'
                  '34708030450 / artifact 10301938362 before dpkg-source -b. Debian is selected for\n'
                  'the symbols baseline because it is closer to KDE 6.30; Ubuntu remains the direct\n'
                  'binary-compatibility target. Any 6.30 ABI delta must be reviewed from a real build.\n\n'
                  'QDoc targets generated through ECMGenerateQDoc are not part of the default build.\n'
                  'The established documentation binary package name is retained as a compatibility\n'
                  'stub until SupraLINUX defines a common Frameworks QDoc policy. Upstream autotests\n'
                  'remain enabled.\n', encoding='utf-8')
              (deb / 'copyright.reference').write_text(
                  '# Debian sid packaging copyright metadata retained in generic Tier 1 packaging-tree artifact.\n'
                  'workflow_run=34708030450\nartifact_id=10301938362\n'
                  f'node={node}\npath=trees/debian/{node}/debian/copyright\nsha256={meta["copyright_sha256"]}\n', encoding='utf-8')
              (deb / f'{meta["symbols_file"]}.reference').write_text(
                  '# Debian sid symbols baseline retained in generic Tier 1 packaging-tree artifact.\n'
                  'workflow_run=34708030450\nartifact_id=10301938362\nprovider=debian\nreference_version=6.28.0\n'
                  f'node={node}\npath=trees/debian/{node}/debian/{meta["symbols_file"]}\nsha256={meta["symbols_sha256"]}\n', encoding='utf-8')
              (deb / 'changelog').write_text(
                  f'{meta["source_package"]} (6.30.0-0supralinux1) resolute; urgency=medium\n\n'
                  f'  * Package KDE Frameworks {node} 6.30.0 from KDE upstream stable.\n'
                  '  * Preserve Debian-family binary package names and Multi-Arch contracts as\n'
                  '    compatibility inputs while selecting dependencies from KDE 6.30 requirements.\n'
                  '  * Build against retained SupraLINUX ECM 6.30 and KDE-selected Qt >= 6.9.\n'
                  '  * Keep KDE upstream autotests enabled and keep QDoc outside the default build.\n'
                  '  * Use the retained Debian 6.28 symbols tree as the closest technical ABI baseline.\n\n'
                  ' -- SupraLINUX Project <packages@supralinux.invalid>  Sat, 12 Sep 2026 18:00:00 -0300\n', encoding='utf-8')
              cmake = (
                  'cmake_minimum_required(VERSION 3.29)\n'
                  f'project(SupraLINUX{meta["cmake_package"]}Consumer LANGUAGES CXX)\n'
                  f'find_package({meta["cmake_package"]} 6.30.0 REQUIRED CONFIG)\n'
                  f'add_executable({node}-consumer main.cpp)\n'
                  f'target_link_libraries({node}-consumer PRIVATE {meta["cmake_target"]})\n'
              )
              (pkg / 'consumer/CMakeLists.txt').write_text(cmake, encoding='utf-8')
              (pkg / 'consumer/main.cpp').write_text(consumer_main[node], encoding='utf-8')

          campaign = {
              'schema': 1,
              'as_of': '2026-09-12',
              'frameworks_series': '6.30.0',
              'authority': 'kde-upstream',
              'provider_platform': 'ubuntu-resolute',
              'batch': 'tier1-batch-2',
              'state': 'prepared-pending-build',
              'canonical_state_role': 'batch-package-attempt-ledger',
              'selected_nodes': list(node_meta),
              'shared_predecessors': {
                  'extra_cmake_modules': {'state':'PASS','version':'6.30.0-0supralinux3','workflow_run':34694951158,'artifact_id':10298635300,'deb_sha256':'ba544c482df73ec162ceb08543d23e2e3f9af3e309e42b16a51c83966081692f'},
                  'packaging_trees': {'status':'PASS','workflow_run':34708030450,'artifact_id':10301938362,'artifact_sha256':'6e91848334c018e15d7bdc1752eb5b494bdeeda8ca04c9323dde46844cf26de6','snapshot_json_sha256':'f761a2d92005107eac2e82322b1b776e4f8867851e657ce79748f0cb266ee345'},
              },
              'shared_packaging_inputs': {'signing_key': {'path':'debian/upstream/signing-key.asc','sha256':'86b56008ff74b4473b0d6ad9f01ca5e40e9ff951bc9be1ff362ce97e396ca17d','source':'retained-debian-packaging-reference'}},
              'nodes': {},
          }
          for node, meta in node_meta.items():
              campaign['nodes'][node] = {
                  'state':'prepared-pending-build', 'last_result':None, 'downstream_eligible':False,
                  'upstream_version':'6.30.0', 'source_package':meta['source_package'], 'source_sha256':meta['source_sha256'],
                  'root_cmake_blob':meta['root_cmake_blob'], 'source_url':f'https://download.kde.org/stable/frameworks/6.30/{node}-6.30.0.tar.xz',
                  'runtime_package':meta['runtime'], 'development_package':meta['dev'], 'documentation_package':meta['doc'],
                  'binary_contracts':meta['contracts'], 'soname':meta['soname'], 'cmake_package':meta['cmake_package'], 'cmake_target':meta['cmake_target'],
                  'consumer_run':'direct',
                  'copyright': {'file':'copyright','sha256':meta['copyright_sha256'],'reference':'debian-sid-6.28'},
                  'package_version':'6.30.0-0supralinux1',
                  'symbols': {'file':meta['symbols_file'],'sha256':meta['symbols_sha256'],'tree_provider':'debian','reference_version':'6.28.0'},
                  'evidence': [],
              }
          (root / 'manifests/kde-tier1-package-campaign-batch2.json').write_text(json.dumps(campaign, indent=2) + '\n', encoding='utf-8')

          old_runner = (root / 'scripts/run-kde-tier1-package-preflight.sh').read_text(encoding='utf-8')
          needle = 'CAMPAIGN="${ROOT}/manifests/kde-tier1-package-campaign.json"'
          assert needle in old_runner
          new_runner = old_runner.replace(needle, 'CAMPAIGN="${ROOT}/manifests/kde-tier1-package-campaign-batch2.json"', 1)
          (root / 'scripts/run-kde-tier1-package-batch2-preflight.sh').write_text(new_runner, encoding='utf-8')
          (root / 'scripts/run-kde-tier1-package-batch2-preflight.sh').chmod(0o755)

          old_scope = (root / 'scripts/kde-tier1-package-preflight-needed.sh').read_text(encoding='utf-8')
          replacements = {
              'kcodecs|kdbusaddons|threadweaver':'ktexttemplate|karchive|kholidays',
              'manifests/kde-tier1-package-campaign.json':'manifests/kde-tier1-package-campaign-batch2.json',
              'scripts/run-kde-tier1-package-preflight.sh':'scripts/run-kde-tier1-package-batch2-preflight.sh',
              '.github/workflows/kde-tier1-package-preflight.yml':'.github/workflows/kde-tier1-package-batch2.yml',
              'scripts/kde-tier1-package-preflight-needed.sh':'scripts/kde-tier1-package-batch2-needed.sh',
          }
          new_scope = old_scope
          for before, after in replacements.items():
              assert before in new_scope, before
              new_scope = new_scope.replace(before, after)
          (root / 'scripts/kde-tier1-package-batch2-needed.sh').write_text(new_scope, encoding='utf-8')
          (root / 'scripts/kde-tier1-package-batch2-needed.sh').chmod(0o755)

          workflow = '''name: KDE Frameworks Tier 1 package batch 2

          on:
            pull_request:
              types: [opened, synchronize, reopened]
            workflow_dispatch:

          permissions:
            contents: read
            actions: read

          jobs:
            tier1-package:
              name: ${{ matrix.node }} 6.30 clean package preflight
              runs-on: ubuntu-26.04
              timeout-minutes: 60
              strategy:
                fail-fast: false
                max-parallel: 3
                matrix:
                  node:
                    - ktexttemplate
                    - karchive
                    - kholidays

              steps:
                - name: Checkout
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                  with:
                    fetch-depth: 0

                - name: Determine whether this event delta affects this Tier 1 node
                  id: scope
                  shell: bash
                  run: |
                    set -euo pipefail
                    run=true
                    if [[ "${{ github.event_name }}" == "pull_request" ]]; then
                      if [[ "${{ github.event.action }}" == "synchronize" ]]; then
                        before="${{ github.event.before }}"
                        after="${{ github.event.after }}"
                      else
                        before="${{ github.event.pull_request.base.sha }}"
                        after="${{ github.event.pull_request.head.sha }}"
                      fi
                      if bash scripts/kde-tier1-package-batch2-needed.sh "${{ matrix.node }}" "${before}" "${after}"; then
                        run=true
                      else
                        rc=$?
                        if [[ "${rc}" -eq 1 ]]; then run=false; else exit "${rc}"; fi
                      fi
                    fi
                    echo "run=${run}" >> "${GITHUB_OUTPUT}"

                - name: Download retained ECM PASS artifact
                  if: steps.scope.outputs.run == 'true'
                  uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
                  with:
                    artifact-ids: '10298635300'
                    github-token: ${{ github.token }}
                    repository: SupraLINUX/SupraLINUX
                    run-id: '34694951158'
                    path: .work/retained-ecm

                - name: Download retained Tier 1 packaging-tree artifact
                  if: steps.scope.outputs.run == 'true'
                  uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
                  with:
                    artifact-ids: '10301938362'
                    github-token: ${{ github.token }}
                    repository: SupraLINUX/SupraLINUX
                    run-id: '34708030450'
                    path: .work/retained-tier1-reference

                - name: Build and validate KDE Framework package
                  if: steps.scope.outputs.run == 'true'
                  env:
                    ECM_ARTIFACT_DIR: ${{ github.workspace }}/.work/retained-ecm
                    TIER1_REFERENCE_DIR: ${{ github.workspace }}/.work/retained-tier1-reference
                  run: bash scripts/run-kde-tier1-package-batch2-preflight.sh "${{ matrix.node }}"

                - name: Upload per-node package evidence
                  if: steps.scope.outputs.run == 'true' && always()
                  uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
                  with:
                    name: kde-tier1-batch2-${{ matrix.node }}-package-${{ github.event.pull_request.head.sha || github.sha }}
                    path: evidence/kde-tier1-package-preflight/${{ matrix.node }}/
                    if-no-files-found: error
                    retention-days: 90

                - name: Report intentionally skipped node
                  if: steps.scope.outputs.run != 'true'
                  run: echo "${{ matrix.node }} Batch 2 package preflight intentionally skipped; event delta does not affect this node."
          '''

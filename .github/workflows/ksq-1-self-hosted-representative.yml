name: Aurora KSQ-1 self-hosted sbuild unshare diagnostic

on:
  push:
    branches:
      - feature/kde-stack-qualification
    paths:
      - '.github/workflows/ksq-1-self-hosted-representative.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbuild-unshare-contract:
    name: Inspect Resolute sbuild-usernsexec mount contract
    runs-on: [self-hosted, Linux, X64, supralinux-ksq, docker]
    timeout-minutes: 20
    container:
      image: ubuntu:26.04@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b
      options: --security-opt seccomp=unconfined --security-opt apparmor=supralinux-ksq-unshare

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Inspect exact installed sbuild unshare implementation
        shell: bash
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/build/ksq-self-hosted-sbuild-contract"
          mkdir -p "${out}"

          . tests/kde-stack/apt-metadata-snapshot.env
          snapshot="${AURORA_KSQ_0_APT_SNAPSHOT:?missing KSQ-0 snapshot}"
          [[ "${snapshot}" == "20260829T022000Z" ]]
          snapshot_uri="https://snapshot.ubuntu.com/ubuntu/${snapshot}/"

          cat > /etc/apt/sources.list.d/ubuntu.sources <<EOF_SOURCES
          Types: deb
          URIs: ${snapshot_uri}
          Suites: resolute resolute-updates resolute-security resolute-backports
          Components: main universe restricted multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF_SOURCES

          export DEBIAN_FRONTEND=noninteractive
          apt_tls_bootstrap=(
            -o Acquire::https::Verify-Peer=false
            -o Acquire::https::Verify-Host=false
          )
          apt-get "${apt_tls_bootstrap[@]}" update >"${out}/apt-bootstrap-update.log" 2>&1
          apt-get "${apt_tls_bootstrap[@]}" install -y --no-install-recommends ca-certificates \
            >"${out}/apt-bootstrap-ca.log" 2>&1
          rm -rf /var/lib/apt/lists/*
          apt-get update >"${out}/apt-verified-update.log" 2>&1
          apt-get install -y --no-install-recommends sbuild uidmap libcap2-bin util-linux sudo \
            >"${out}/apt-toolchain.log" 2>&1

          dpkg-query -W -f='${Package}\t${Version}\n' sbuild libsbuild-perl uidmap libcap2-bin \
            | sort | tee "${out}/versions.tsv"
          [[ "$(dpkg-query -W -f='${Version}' sbuild)" == '0.91.2ubuntu3' ]]
          [[ "$(cat /proc/self/attr/current)" == 'supralinux-ksq-unshare (enforce)' ]]

          helper=/usr/libexec/sbuild-usernsexec
          [[ -f "${helper}" ]]
          sha256sum "${helper}" | tee "${out}/sbuild-usernsexec.sha256"
          cp -a "${helper}" "${out}/sbuild-usernsexec"

          echo '=== failure-line context 330-430 ==='
          nl -ba "${helper}" | sed -n '330,430p' | tee "${out}/lines-330-430.txt"

          echo '=== mount/umount/system calls across helper ==='
          grep -nE "mount|umount|pivot_root|MS_(BIND|REC|PRIVATE|SLAVE)|system\(" "${helper}" \
            | tee "${out}/mount-related-lines.txt"

          echo '=== setup-related context 430-620 ==='
          nl -ba "${helper}" | sed -n '430,620p' | tee "${out}/lines-430-620.txt"

          echo 'AURORA_KSQ_SBUILD_UNSHARE_CONTRACT_CAPTURED'

      - name: Preserve sbuild unshare contract evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-self-hosted-sbuild-contract
          path: build/ksq-self-hosted-sbuild-contract/
          if-no-files-found: error
          retention-days: 30

name: Aurora KSQ-1 self-hosted namespace diagnostic

on:
  push:
    branches:
      - feature/kde-stack-qualification
    paths:
      - '.github/workflows/ksq-1-self-hosted-representative.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  namespace-diagnostic:
    name: Diagnose nested user namespaces without Docker AppArmor profile
    runs-on: [self-hosted, Linux, X64, supralinux-ksq, docker]
    timeout-minutes: 20
    container:
      image: ubuntu:26.04@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b
      options: --security-opt seccomp=unconfined --security-opt apparmor=unconfined

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run controlled AppArmor comparison
        shell: bash
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/build/ksq-self-hosted-namespace-diagnostic"
          mkdir -p "${out}"

          . tests/kde-stack/apt-metadata-snapshot.env
          snapshot="${AURORA_KSQ_0_APT_SNAPSHOT:?missing KSQ-0 snapshot}"
          [[ "${snapshot}" == "20260829T022000Z" ]]
          snapshot_uri="https://snapshot.ubuntu.com/ubuntu/${snapshot}/"

          cat > /etc/apt/sources.list.d/ubuntu.sources <<EOF_SOURCES
          Types: deb
          URIs: ${snapshot_uri}
          Suites: resolute resolute-updates resolute-security resolute-backports
          Components: main universe restricted multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF_SOURCES

          export DEBIAN_FRONTEND=noninteractive
          apt_tls_bootstrap=(
            -o Acquire::https::Verify-Peer=false
            -o Acquire::https::Verify-Host=false
          )
          apt-get "${apt_tls_bootstrap[@]}" update >"${out}/apt-bootstrap-update.log" 2>&1
          apt-get "${apt_tls_bootstrap[@]}" install -y --no-install-recommends ca-certificates \
            >"${out}/apt-bootstrap-ca.log" 2>&1
          rm -rf /var/lib/apt/lists/*
          apt-get update >"${out}/apt-verified-update.log" 2>&1
          apt-get install -y --no-install-recommends sudo uidmap libcap2-bin util-linux \
            >"${out}/apt-diagnostic-toolchain.log" 2>&1

          printf 'ubuntu ALL=(ALL) NOPASSWD:ALL\n' > /etc/sudoers.d/ubuntu-ksq
          chmod 0440 /etc/sudoers.d/ubuntu-ksq
          grep -q '^ubuntu:' /etc/subuid || echo 'ubuntu:100000:65536' >> /etc/subuid
          grep -q '^ubuntu:' /etc/subgid || echo 'ubuntu:100000:65536' >> /etc/subgid

          {
            echo '=== controlled variable ==='
            printf 'apparmor='; cat /proc/self/attr/current || true
            grep -E '^(Cap(Inh|Prm|Eff|Bnd|Amb)|NoNewPrivs|Seccomp):' /proc/self/status
            stat -c '%A %a %U %G %u %g %n' /usr/bin/newuidmap /usr/bin/newgidmap
            grep '^ubuntu:' /etc/subuid
            grep '^ubuntu:' /etc/subgid
            sysctl kernel.apparmor_restrict_unprivileged_userns 2>&1 || true
            cat /proc/self/uid_map
            cat /proc/self/gid_map
          } | tee "${out}/comparison-environment.txt"

          set +e
          sudo -u ubuntu -H unshare --user --map-root-user true \
            >"${out}/test-map-root.stdout" 2>"${out}/test-map-root.stderr"
          rc_map_root=$?

          sudo -u ubuntu -H unshare --user \
            --map-auto --map-user=65536 --map-group=65536 --keep-caps true \
            >"${out}/test-map-auto.stdout" 2>"${out}/test-map-auto.stderr"
          rc_map_auto=$?

          sudo -u ubuntu -H unshare \
            --map-auto --map-user=65536 --map-group=65536 --keep-caps \
            --mount --pid --uts --ipc --fork true \
            >"${out}/test-full.stdout" 2>"${out}/test-full.stderr"
          rc_full=$?
          set -e

          {
            echo 'AURORA_KSQ_NS_DIAG_APPARMOR=unconfined'
            echo "AURORA_KSQ_NS_DIAG_MAP_ROOT_RC=${rc_map_root}"
            echo "AURORA_KSQ_NS_DIAG_MAP_AUTO_RC=${rc_map_auto}"
            echo "AURORA_KSQ_NS_DIAG_FULL_RC=${rc_full}"
          } | tee "${out}/results.env"

          echo '--- map-root stderr ---'
          cat "${out}/test-map-root.stderr"
          echo '--- map-auto stderr ---'
          cat "${out}/test-map-auto.stderr"
          echo '--- full stderr ---'
          cat "${out}/test-full.stderr"
          echo 'AURORA_KSQ_NAMESPACE_APPARMOR_COMPARISON_COMPLETE'

      - name: Preserve namespace diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-self-hosted-namespace-apparmor-unconfined
          path: build/ksq-self-hosted-namespace-diagnostic/
          if-no-files-found: error
          retention-days: 30

name: Aurora KSQ-1 self-hosted uidmap root-cause diagnostic

on:
  push:
    branches:
      - feature/kde-stack-qualification
    paths:
      - '.github/workflows/ksq-1-self-hosted-representative.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uidmap-root-cause:
    name: Prove stock setuid vs filecap uidmap behavior
    runs-on: [self-hosted, Linux, X64, supralinux-ksq, docker]
    timeout-minutes: 20
    container:
      image: ubuntu:26.04@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b
      options: --security-opt seccomp=unconfined

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run final uidmap root-cause controls
        shell: bash
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/build/ksq-self-hosted-uidmap-root-cause"
          mkdir -p "${out}"

          . tests/kde-stack/apt-metadata-snapshot.env
          snapshot="${AURORA_KSQ_0_APT_SNAPSHOT:?missing KSQ-0 snapshot}"
          [[ "${snapshot}" == "20260829T022000Z" ]]
          snapshot_uri="https://snapshot.ubuntu.com/ubuntu/${snapshot}/"

          cat > /etc/apt/sources.list.d/ubuntu.sources <<EOF_SOURCES
          Types: deb
          URIs: ${snapshot_uri}
          Suites: resolute resolute-updates resolute-security resolute-backports
          Components: main universe restricted multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF_SOURCES

          export DEBIAN_FRONTEND=noninteractive
          apt_tls_bootstrap=(
            -o Acquire::https::Verify-Peer=false
            -o Acquire::https::Verify-Host=false
          )
          apt-get "${apt_tls_bootstrap[@]}" update >"${out}/apt-bootstrap-update.log" 2>&1
          apt-get "${apt_tls_bootstrap[@]}" install -y --no-install-recommends ca-certificates \
            >"${out}/apt-bootstrap-ca.log" 2>&1
          rm -rf /var/lib/apt/lists/*
          apt-get update >"${out}/apt-verified-update.log" 2>&1
          apt-get install -y --no-install-recommends sudo uidmap libcap2-bin util-linux binutils \
            >"${out}/apt-diagnostic-toolchain.log" 2>&1

          printf 'ubuntu ALL=(ALL) NOPASSWD:ALL\n' > /etc/sudoers.d/ubuntu-ksq
          chmod 0440 /etc/sudoers.d/ubuntu-ksq
          grep -q '^ubuntu:' /etc/subuid || echo 'ubuntu:100000:65536' >> /etc/subuid
          grep -q '^ubuntu:' /etc/subgid || echo 'ubuntu:100000:65536' >> /etc/subgid

          {
            echo '=== exact package and binary evidence ==='
            dpkg-query -W -f='${Package} ${Version}\n' uidmap libcap2 2>/dev/null || true
            stat -c '%A %a %U %G %u %g %n' /usr/bin/newuidmap /usr/bin/newgidmap
            echo '--- getcap stock ---'
            getcap /usr/bin/newuidmap /usr/bin/newgidmap || true
            echo '--- dynamic dependencies stock ---'
            ldd /usr/bin/newuidmap || true
            echo '--- cap symbols stock ---'
            readelf -Ws /usr/bin/newuidmap | grep -E '(^|[[:space:]])(capset|prctl|seteuid)(@|$)' || true
            echo '--- upstream libcap-path diagnostic strings stock ---'
            strings /usr/bin/newuidmap | grep -E 'Could not prctl\(PR_SET_KEEPCAPS\)|Could not set caps|Could not seteuid' || true
            echo '--- runtime policy ---'
            printf 'apparmor='; cat /proc/self/attr/current || true
            grep -E '^(Cap(Inh|Prm|Eff|Bnd|Amb)|NoNewPrivs|Seccomp):' /proc/self/status
            sysctl kernel.apparmor_restrict_unprivileged_userns 2>&1 || true
            cat /proc/self/uid_map
          } | tee "${out}/environment-and-binary.txt"

          CHILD_PID=''
          CHILD_LAUNCHER=''
          start_unmapped_child() {
            local pidfile="$1"
            rm -f "${pidfile}"
            sudo -u ubuntu -H unshare --user --fork sh -c \
              'echo $$ > "$1"; exec sleep 300' sh "${pidfile}" &
            CHILD_LAUNCHER=$!
            for _ in $(seq 1 100); do
              if [[ -s "${pidfile}" ]]; then
                CHILD_PID="$(cat "${pidfile}")"
                [[ -d "/proc/${CHILD_PID}" ]] && return 0
              fi
              sleep 0.05
            done
            return 1
          }
          stop_unmapped_child() {
            [[ -n "${CHILD_PID}" ]] && kill "${CHILD_PID}" 2>/dev/null || true
            [[ -n "${CHILD_LAUNCHER}" ]] && kill "${CHILD_LAUNCHER}" 2>/dev/null || true
            CHILD_PID=''
            CHILD_LAUNCHER=''
          }
          trap stop_unmapped_child EXIT

          # A: root inside the Docker parent namespace lacks CAP_SYS_ADMIN.
          # It is therefore intentionally the wrong euid to open uid_map for
          # a child user namespace owned by uid 1000.
          start_unmapped_child /tmp/ksq-root-direct.pid
          {
            stat -c 'target_proc_owner uid=%u gid=%g mode=%a' "/proc/${CHILD_PID}"
            cat "/proc/${CHILD_PID}/status" | grep -E '^(Uid|Gid):'
          } >"${out}/target-before-root-direct.txt"
          set +e
          { printf '0 1000 1\n1 100000 65536\n' >"/proc/${CHILD_PID}/uid_map"; } \
            2>"${out}/root-direct.stderr"
          rc_root_direct=$?
          set -e
          stop_unmapped_child

          # B: stock Ubuntu uidmap is setuid-root.  With this package build it
          # does not contain shadow 4.17.4's libcap/PR_SET_KEEPCAPS path, so it
          # opens uid_map as euid 0 and hits the same kernel permission check.
          start_unmapped_child /tmp/ksq-stock-helper.pid
          set +e
          sudo -u ubuntu -H /usr/bin/newuidmap "${CHILD_PID}" 0 1000 1 1 100000 65536 \
            >"${out}/stock-newuidmap.stdout" 2>"${out}/stock-newuidmap.stderr"
          rc_stock_helper=$?
          set -e
          stop_unmapped_child

          # C: use shadow's supported capability privilege model precisely:
          # caller remains euid 1000, while helper receives only CAP_SETUID /
          # CAP_SETGID in the parent namespace.
          chmod u-s /usr/bin/newuidmap /usr/bin/newgidmap
          setcap cap_setuid=ep /usr/bin/newuidmap
          setcap cap_setgid=ep /usr/bin/newgidmap
          {
            stat -c '%A %a %U %G %u %g %n' /usr/bin/newuidmap /usr/bin/newgidmap
            getcap /usr/bin/newuidmap /usr/bin/newgidmap || true
          } | tee "${out}/filecap-helper-state.txt"

          start_unmapped_child /tmp/ksq-filecap-helper.pid
          set +e
          sudo -u ubuntu -H /usr/bin/newuidmap "${CHILD_PID}" 0 1000 1 1 100000 65536 \
            >"${out}/filecap-newuidmap.stdout" 2>"${out}/filecap-newuidmap.stderr"
          rc_filecap_helper=$?
          if [[ ${rc_filecap_helper} -eq 0 ]]; then
            cat "/proc/${CHILD_PID}/uid_map" >"${out}/filecap-newuidmap-map.txt"
          fi
          set -e
          stop_unmapped_child

          # D: util-linux's documented auto mapping must now cross the original
          # barrier.  The full namespace request is recorded separately to prove
          # whether the next failure is mount/AppArmor rather than uidmap.
          set +e
          sudo -u ubuntu -H unshare --user \
            --map-auto --map-user=65536 --map-group=65536 --keep-caps true \
            >"${out}/filecap-map-auto.stdout" 2>"${out}/filecap-map-auto.stderr"
          rc_filecap_map_auto=$?

          sudo -u ubuntu -H unshare \
            --map-auto --map-user=65536 --map-group=65536 --keep-caps \
            --mount --pid --uts --ipc --fork true \
            >"${out}/filecap-full.stdout" 2>"${out}/filecap-full.stderr"
          rc_filecap_full=$?
          set -e

          {
            echo "AURORA_KSQ_UIDMAP_ROOT_DIRECT_RC=${rc_root_direct}"
            echo "AURORA_KSQ_UIDMAP_STOCK_SETUID_RC=${rc_stock_helper}"
            echo "AURORA_KSQ_UIDMAP_FILECAP_HELPER_RC=${rc_filecap_helper}"
            echo "AURORA_KSQ_UIDMAP_FILECAP_MAP_AUTO_RC=${rc_filecap_map_auto}"
            echo "AURORA_KSQ_UIDMAP_FILECAP_FULL_RC=${rc_filecap_full}"
          } | tee "${out}/results.env"

          echo '--- root direct stderr ---'
          cat "${out}/root-direct.stderr" || true
          echo '--- stock setuid newuidmap stderr ---'
          cat "${out}/stock-newuidmap.stderr" || true
          echo '--- filecap newuidmap stderr ---'
          cat "${out}/filecap-newuidmap.stderr" || true
          echo '--- filecap map-auto stderr ---'
          cat "${out}/filecap-map-auto.stderr" || true
          echo '--- filecap full stderr ---'
          cat "${out}/filecap-full.stderr" || true

          [[ ${rc_root_direct} -ne 0 ]]
          [[ ${rc_stock_helper} -ne 0 ]]
          [[ ${rc_filecap_helper} -eq 0 ]]
          [[ ${rc_filecap_map_auto} -eq 0 ]]
          echo 'AURORA_KSQ_UIDMAP_ROOT_CAUSE_PROVEN'

      - name: Preserve uidmap root-cause evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-self-hosted-uidmap-root-cause
          path: build/ksq-self-hosted-uidmap-root-cause/
          if-no-files-found: error
          retention-days: 30

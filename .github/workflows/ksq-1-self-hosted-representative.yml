name: Aurora KSQ-1 self-hosted sbuild unshare smoke

on:
  push:
    branches:
      - feature/kde-stack-qualification
    paths:
      - '.github/workflows/ksq-1-self-hosted-representative.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbuild-unshare-smoke:
    name: Exercise Resolute sbuild unshare end-to-end
    runs-on: [self-hosted, Linux, X64, supralinux-ksq, docker]
    timeout-minutes: 30
    container:
      image: ubuntu:26.04@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b
      options: --security-opt seccomp=unconfined --security-opt apparmor=supralinux-ksq-unshare

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Exercise exact sbuild unshare path with smoke source
        shell: bash
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/build/ksq-self-hosted-sbuild-smoke"
          mkdir -p "${out}"

          . tests/kde-stack/apt-metadata-snapshot.env
          snapshot="${AURORA_KSQ_0_APT_SNAPSHOT:?missing KSQ-0 snapshot}"
          [[ "${snapshot}" == "20260829T022000Z" ]]
          snapshot_uri="https://snapshot.ubuntu.com/ubuntu/${snapshot}/"

          cat > /etc/apt/sources.list.d/ubuntu.sources <<EOF_SOURCES
          Types: deb
          URIs: ${snapshot_uri}
          Suites: resolute resolute-updates resolute-security resolute-backports
          Components: main universe restricted multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF_SOURCES

          export DEBIAN_FRONTEND=noninteractive
          apt_acquire=(
            -o Acquire::Retries=5
          )
          apt_tls_bootstrap=(
            -o Acquire::https::Verify-Peer=false
            -o Acquire::https::Verify-Host=false
          )

          # APT normally treats some transient index failures as warnings and
          # may return zero with a partial package universe. KSQ must fail closed
          # instead: retry transport failures, then reject any missing index.
          apt-get "${apt_tls_bootstrap[@]}" "${apt_acquire[@]}" \
            -o APT::Update::Error-Mode=any update \
            >"${out}/apt-bootstrap-update.log" 2>&1
          apt-get "${apt_tls_bootstrap[@]}" "${apt_acquire[@]}" \
            install -y --no-install-recommends ca-certificates \
            >"${out}/apt-bootstrap-ca.log" 2>&1
          rm -rf /var/lib/apt/lists/*
          apt-get "${apt_acquire[@]}" -o APT::Update::Error-Mode=any update \
            >"${out}/apt-verified-update.log" 2>&1
          apt-get "${apt_acquire[@]}" install -y --no-install-recommends \
            sudo sbuild mmdebstrap uidmap zstd devscripts dpkg-dev apt-utils \
            ca-certificates ubuntu-keyring gzip xz-utils diffutils libcap2-bin \
            >"${out}/apt-toolchain.log" 2>&1

          printf 'ubuntu ALL=(ALL) NOPASSWD:ALL\n' > /etc/sudoers.d/ubuntu-ksq
          chmod 0440 /etc/sudoers.d/ubuntu-ksq
          grep -q '^ubuntu:' /etc/subuid || echo 'ubuntu:100000:65536' >> /etc/subuid
          grep -q '^ubuntu:' /etc/subgid || echo 'ubuntu:100000:65536' >> /etc/subgid

          # Proven correction for Resolute uidmap 1:4.17.4-2ubuntu3 in this
          # nested-unshare container model (run 33422301732).
          chmod u-s /usr/bin/newuidmap /usr/bin/newgidmap
          setcap cap_setuid=ep /usr/bin/newuidmap
          setcap cap_setgid=ep /usr/bin/newgidmap

          ubuntu_gid="$(id -g ubuntu)"
          chown -R ubuntu:"${ubuntu_gid}" "${GITHUB_WORKSPACE}"

          {
            echo '=== sbuild smoke environment ==='
            printf 'apparmor='; cat /proc/self/attr/current
            printf 'SBUILD_ENABLE_PIVOT_ROOT=%s\n' "${SBUILD_ENABLE_PIVOT_ROOT-<unset>}"
            echo 'APT_ACQUIRE_RETRIES=5'
            echo 'APT_UPDATE_ERROR_MODE=any'
            dpkg-query -W -f='${Package}\t${Version}\n' \
              sbuild libsbuild-perl mmdebstrap uidmap libcap2-bin | sort
            stat -c '%A %a %U %G %u %g %n' /usr/bin/newuidmap /usr/bin/newgidmap
            getcap /usr/bin/newuidmap /usr/bin/newgidmap
            grep '^ubuntu:' /etc/subuid
            grep '^ubuntu:' /etc/subgid
          } | tee "${out}/environment.txt"

          sudo -u ubuntu -H unshare \
            --map-auto --map-user=65536 --map-group=65536 --keep-caps \
            --mount --pid --uts --ipc --fork true \
            >"${out}/namespace-preflight.stdout" 2>"${out}/namespace-preflight.stderr"

          rm -rf "${GITHUB_WORKSPACE}/build/ksq-1/environment"
          sudo -u ubuntu -H env GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" CI=true \
            bash -c 'cd "$GITHUB_WORKSPACE" && bash scripts/ci/prepare-ksq-1-build-environment.sh' \
            >"${out}/prepare-build-environment.stdout" \
            2>"${out}/prepare-build-environment.stderr"

          . "${GITHUB_WORKSPACE}/build/ksq-1/environment/build-environment.env"
          tarball="${AURORA_KSQ_1_BUILD_ENV_TARBALL:?missing buildd tarball}"
          [[ -s "${tarball}" ]]

          smoke="${GITHUB_WORKSPACE}/build/ksq-sbuild-smoke-source/supralinux-ksq-sbuild-smoke-1.0"
          rm -rf "${GITHUB_WORKSPACE}/build/ksq-sbuild-smoke-source"
          mkdir -p "${smoke}/debian/source"
          cat > "${smoke}/debian/control" <<'EOF_CONTROL'
          Source: supralinux-ksq-sbuild-smoke
          Section: devel
          Priority: optional
          Maintainer: SupraLINUX Build Certification <noreply@supralinux.invalid>
          Build-Depends: debhelper-compat (= 13)
          Standards-Version: 4.7.0
          Rules-Requires-Root: no

          Package: supralinux-ksq-sbuild-smoke
          Architecture: all
          Description: SupraLINUX KSQ sbuild unshare smoke package
           Minimal package used only to exercise the certified sbuild unshare path.
          EOF_CONTROL
          cat > "${smoke}/debian/changelog" <<'EOF_CHANGELOG'
          supralinux-ksq-sbuild-smoke (1.0) resolute; urgency=medium

            * KSQ-1 sbuild unshare smoke package.

           -- SupraLINUX Build Certification <noreply@supralinux.invalid>  Sun, 31 Aug 2026 18:00:00 +0000
          EOF_CHANGELOG
          cat > "${smoke}/debian/rules" <<'EOF_RULES'
          #!/usr/bin/make -f
          %:
          	dh $@
          EOF_RULES
          chmod 0755 "${smoke}/debian/rules"
          printf '3.0 (native)\n' > "${smoke}/debian/source/format"
          printf 'KSQ-1 sbuild unshare smoke\n' > "${smoke}/smoke.txt"
          printf 'smoke.txt usr/share/supralinux-ksq-sbuild-smoke/\n' > "${smoke}/debian/install"

          chown -R ubuntu:"${ubuntu_gid}" "${GITHUB_WORKSPACE}/build/ksq-sbuild-smoke-source"
          sudo -u ubuntu -H bash -c 'cd "$1" && dpkg-source -b .' bash "${smoke}" \
            >"${out}/dpkg-source.stdout" 2>"${out}/dpkg-source.stderr"
          dsc="${GITHUB_WORKSPACE}/build/ksq-sbuild-smoke-source/supralinux-ksq-sbuild-smoke_1.0.dsc"
          [[ -s "${dsc}" ]]

          result="${GITHUB_WORKSPACE}/build/ksq-sbuild-smoke-result"
          rm -rf "${result}"
          mkdir -p "${result}"
          chown -R ubuntu:"${ubuntu_gid}" "${result}"

          set +e
          sudo -u ubuntu -H env DEB_BUILD_OPTIONS=parallel=2 \
            sbuild \
              --chroot-mode=unshare \
              --chroot="${tarball}" \
              --dist=resolute \
              --arch=amd64 \
              --build-dir="${result}" \
              --build-path=/build/supralinux-ksq1-smoke \
              --jobs=2 \
              --no-enable-network \
              --no-run-lintian \
              --no-run-autopkgtest \
              --purge-build=always \
              --purge-deps=always \
              --resolve-alternatives \
              --bd-uninstallable-explainer=apt \
              "${dsc}" \
            >"${out}/sbuild.stdout" 2>"${out}/sbuild.stderr"
          rc_sbuild=$?
          set -e

          {
            echo "AURORA_KSQ_SBUILD_SMOKE_RC=${rc_sbuild}"
            echo "AURORA_KSQ_SBUILD_SMOKE_TARBALL=${tarball}"
            sha256sum "${tarball}"
          } | tee "${out}/results.env"

          echo '--- sbuild stderr tail ---'
          tail -n 160 "${out}/sbuild.stderr" || true
          echo '--- sbuild stdout tail ---'
          tail -n 160 "${out}/sbuild.stdout" || true
          echo '--- generated sbuild logs ---'
          while IFS= read -r -d '' build_log; do
            echo "### ${build_log}"
            tail -n 320 "${build_log}" || true
          done < <(find "${result}" -maxdepth 1 -type f -name '*.build' -print0)

          # GitHub artifact names must be filesystem-portable. sbuild embeds an
          # ISO timestamp containing ':' in failure log filenames.
          while IFS= read -r -d '' generated; do
            directory="$(dirname "${generated}")"
            basename="$(basename "${generated}")"
            safe_basename="${basename//:/-}"
            if [[ "${safe_basename}" != "${basename}" ]]; then
              mv "${generated}" "${directory}/${safe_basename}"
            fi
          done < <(find "${result}" -maxdepth 1 -type f -print0)

          find "${result}" -maxdepth 1 -type f -printf '%f\n' | sort \
            | tee "${out}/result-files.txt"

          [[ ${rc_sbuild} -eq 0 ]]
          find "${result}" -maxdepth 1 -type f -name '*.deb' -print -quit | grep -q .
          find "${result}" -maxdepth 1 -type f -name '*.buildinfo' -print -quit | grep -q .
          find "${result}" -maxdepth 1 -type f -name '*.changes' -print -quit | grep -q .
          echo 'AURORA_KSQ_SBUILD_UNSHARE_SMOKE_PASS'

      - name: Preserve sbuild smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-self-hosted-sbuild-smoke
          path: |
            build/ksq-self-hosted-sbuild-smoke/
            build/ksq-1/environment/build-environment.env
            build/ksq-1/environment/build-environment-tool-versions.txt
            build/ksq-1/environment/resolute-amd64-buildd.tar.zst.sha256
            build/ksq-sbuild-smoke-result/
          if-no-files-found: warn
          retention-days: 30

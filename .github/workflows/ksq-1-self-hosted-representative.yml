name: Aurora KSQ-1 self-hosted scoped unshare diagnostic

on:
  push:
    branches:
      - feature/kde-stack-qualification
    paths:
      - '.github/workflows/ksq-1-self-hosted-representative.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-unshare:
    name: Verify filecap uidmap plus scoped AppArmor mount propagation
    runs-on: [self-hosted, Linux, X64, supralinux-ksq, docker]
    timeout-minutes: 20
    container:
      image: ubuntu:26.04@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b
      options: --security-opt seccomp=unconfined --security-opt apparmor=supralinux-ksq-unshare

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify complete namespace preflight
        shell: bash
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/build/ksq-self-hosted-scoped-unshare"
          mkdir -p "${out}"

          . tests/kde-stack/apt-metadata-snapshot.env
          snapshot="${AURORA_KSQ_0_APT_SNAPSHOT:?missing KSQ-0 snapshot}"
          [[ "${snapshot}" == "20260829T022000Z" ]]
          snapshot_uri="https://snapshot.ubuntu.com/ubuntu/${snapshot}/"

          cat > /etc/apt/sources.list.d/ubuntu.sources <<EOF_SOURCES
          Types: deb
          URIs: ${snapshot_uri}
          Suites: resolute resolute-updates resolute-security resolute-backports
          Components: main universe restricted multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF_SOURCES

          export DEBIAN_FRONTEND=noninteractive
          apt_tls_bootstrap=(
            -o Acquire::https::Verify-Peer=false
            -o Acquire::https::Verify-Host=false
          )
          apt-get "${apt_tls_bootstrap[@]}" update >"${out}/apt-bootstrap-update.log" 2>&1
          apt-get "${apt_tls_bootstrap[@]}" install -y --no-install-recommends ca-certificates \
            >"${out}/apt-bootstrap-ca.log" 2>&1
          rm -rf /var/lib/apt/lists/*
          apt-get update >"${out}/apt-verified-update.log" 2>&1
          apt-get install -y --no-install-recommends sudo uidmap libcap2-bin util-linux \
            >"${out}/apt-diagnostic-toolchain.log" 2>&1

          printf 'ubuntu ALL=(ALL) NOPASSWD:ALL\n' > /etc/sudoers.d/ubuntu-ksq
          chmod 0440 /etc/sudoers.d/ubuntu-ksq
          grep -q '^ubuntu:' /etc/subuid || echo 'ubuntu:100000:65536' >> /etc/subuid
          grep -q '^ubuntu:' /etc/subgid || echo 'ubuntu:100000:65536' >> /etc/subgid

          # Ubuntu's uidmap 1:4.17.4-2ubuntu3 is built without shadow 4.17.4's
          # libcap/PR_SET_KEEPCAPS path.  Use the upstream-supported precise
          # file-capability privilege model proven by run 33422301732.
          chmod u-s /usr/bin/newuidmap /usr/bin/newgidmap
          setcap cap_setuid=ep /usr/bin/newuidmap
          setcap cap_setgid=ep /usr/bin/newgidmap

          {
            echo '=== scoped namespace environment ==='
            printf 'apparmor='; cat /proc/self/attr/current
            grep -E '^(Cap(Inh|Prm|Eff|Bnd|Amb)|NoNewPrivs|Seccomp):' /proc/self/status
            stat -c '%A %a %U %G %u %g %n' /usr/bin/newuidmap /usr/bin/newgidmap
            getcap /usr/bin/newuidmap /usr/bin/newgidmap
            grep '^ubuntu:' /etc/subuid
            grep '^ubuntu:' /etc/subgid
            sysctl kernel.apparmor_restrict_unprivileged_userns 2>&1 || true
            cat /proc/self/uid_map
            cat /proc/self/gid_map
          } | tee "${out}/environment.txt"

          set +e
          sudo -u ubuntu -H unshare --user \
            --map-auto --map-user=65536 --map-group=65536 --keep-caps true \
            >"${out}/map-auto.stdout" 2>"${out}/map-auto.stderr"
          rc_map_auto=$?

          sudo -u ubuntu -H unshare \
            --map-auto --map-user=65536 --map-group=65536 --keep-caps \
            --mount --pid --uts --ipc --fork \
            sh -c 'printf "uid_map:\n"; cat /proc/self/uid_map; printf "gid_map:\n"; cat /proc/self/gid_map; printf "mountns=%s pidns=%s utsns=%s ipcns=%s\n" "$(readlink /proc/self/ns/mnt)" "$(readlink /proc/self/ns/pid)" "$(readlink /proc/self/ns/uts)" "$(readlink /proc/self/ns/ipc)"' \
            >"${out}/full.stdout" 2>"${out}/full.stderr"
          rc_full=$?
          set -e

          {
            echo 'AURORA_KSQ_SCOPED_APPARMOR=supralinux-ksq-unshare'
            echo "AURORA_KSQ_SCOPED_MAP_AUTO_RC=${rc_map_auto}"
            echo "AURORA_KSQ_SCOPED_FULL_RC=${rc_full}"
          } | tee "${out}/results.env"

          echo '--- map-auto stderr ---'
          cat "${out}/map-auto.stderr"
          echo '--- full stdout ---'
          cat "${out}/full.stdout"
          echo '--- full stderr ---'
          cat "${out}/full.stderr"

          [[ "$(cat /proc/self/attr/current)" == 'supralinux-ksq-unshare (enforce)' ]]
          [[ ${rc_map_auto} -eq 0 ]]
          [[ ${rc_full} -eq 0 ]]
          echo 'AURORA_KSQ_SCOPED_UNSHARE_PREFLIGHT_PASS'

      - name: Preserve scoped unshare evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-self-hosted-scoped-unshare
          path: build/ksq-self-hosted-scoped-unshare/
          if-no-files-found: error
          retention-days: 30

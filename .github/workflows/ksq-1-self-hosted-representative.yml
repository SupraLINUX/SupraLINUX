name: Aurora KSQ-1 self-hosted mmdebstrap diagnostic

on:
  push:
    branches:
      - feature/kde-stack-qualification
    paths:
      - '.github/workflows/ksq-1-self-hosted-representative.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mmdebstrap-unshare:
    name: Exercise canonical mmdebstrap unshare build environment
    runs-on: [self-hosted, Linux, X64, supralinux-ksq, docker]
    timeout-minutes: 30
    container:
      image: ubuntu:26.04@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b
      options: --security-opt seccomp=unconfined --security-opt apparmor=supralinux-ksq-unshare

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Exercise canonical build environment creation
        shell: bash
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/build/ksq-self-hosted-mmdebstrap-diagnostic"
          mkdir -p "${out}"

          . tests/kde-stack/apt-metadata-snapshot.env
          snapshot="${AURORA_KSQ_0_APT_SNAPSHOT:?missing KSQ-0 snapshot}"
          [[ "${snapshot}" == "20260829T022000Z" ]]
          snapshot_uri="https://snapshot.ubuntu.com/ubuntu/${snapshot}/"

          cat > /etc/apt/sources.list.d/ubuntu.sources <<EOF_SOURCES
          Types: deb
          URIs: ${snapshot_uri}
          Suites: resolute resolute-updates resolute-security resolute-backports
          Components: main universe restricted multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF_SOURCES

          export DEBIAN_FRONTEND=noninteractive
          apt_tls_bootstrap=(
            -o Acquire::https::Verify-Peer=false
            -o Acquire::https::Verify-Host=false
          )
          apt-get "${apt_tls_bootstrap[@]}" update >"${out}/apt-bootstrap-update.log" 2>&1
          apt-get "${apt_tls_bootstrap[@]}" install -y --no-install-recommends ca-certificates \
            >"${out}/apt-bootstrap-ca.log" 2>&1
          rm -rf /var/lib/apt/lists/*
          apt-get update >"${out}/apt-verified-update.log" 2>&1
          apt-get install -y --no-install-recommends \
            sudo sbuild mmdebstrap uidmap zstd devscripts dpkg-dev apt-utils \
            ca-certificates ubuntu-keyring gzip libcap2-bin \
            >"${out}/apt-build-toolchain.log" 2>&1

          printf 'ubuntu ALL=(ALL) NOPASSWD:ALL\n' > /etc/sudoers.d/ubuntu-ksq
          chmod 0440 /etc/sudoers.d/ubuntu-ksq
          grep -q '^ubuntu:' /etc/subuid || echo 'ubuntu:100000:65536' >> /etc/subuid
          grep -q '^ubuntu:' /etc/subgid || echo 'ubuntu:100000:65536' >> /etc/subgid

          # Proven correction for Resolute uidmap 1:4.17.4-2ubuntu3 in this
          # nested-unshare container model (run 33422301732).
          chmod u-s /usr/bin/newuidmap /usr/bin/newgidmap
          setcap cap_setuid=ep /usr/bin/newuidmap
          setcap cap_setgid=ep /usr/bin/newgidmap

          {
            echo '=== mmdebstrap diagnostic environment ==='
            printf 'apparmor='; cat /proc/self/attr/current
            dpkg-query -W -f='${Package}\t${Version}\n' sbuild mmdebstrap uidmap libcap2-bin | sort
            stat -c '%A %a %U %G %u %g %n' /usr/bin/newuidmap /usr/bin/newgidmap
            getcap /usr/bin/newuidmap /usr/bin/newgidmap
            grep '^ubuntu:' /etc/subuid
            grep '^ubuntu:' /etc/subgid
          } | tee "${out}/environment.txt"

          # Re-prove the exact namespace precondition in the same container
          # immediately before invoking the canonical script.
          sudo -u ubuntu -H unshare \
            --map-auto --map-user=65536 --map-group=65536 --keep-caps \
            --mount --pid --uts --ipc --fork true \
            >"${out}/namespace-preflight.stdout" 2>"${out}/namespace-preflight.stderr"

          rm -rf "${GITHUB_WORKSPACE}/build/ksq-1/environment"
          set +e
          sudo -u ubuntu -H bash scripts/ci/prepare-ksq-1-build-environment.sh \
            >"${out}/prepare-build-environment.stdout" \
            2>"${out}/prepare-build-environment.stderr"
          rc_mmdebstrap=$?
          set -e

          {
            echo "AURORA_KSQ_MMDEBSTRAP_RC=${rc_mmdebstrap}"
            echo 'AURORA_KSQ_MMDEBSTRAP_APPARMOR=supralinux-ksq-unshare'
          } | tee "${out}/results.env"

          echo '--- canonical stdout ---'
          cat "${out}/prepare-build-environment.stdout"
          echo '--- canonical stderr ---'
          cat "${out}/prepare-build-environment.stderr"

          if [[ -f "${GITHUB_WORKSPACE}/build/ksq-1/environment/build-environment.env" ]]; then
            cp "${GITHUB_WORKSPACE}/build/ksq-1/environment/build-environment.env" "${out}/"
          fi
          if [[ -f "${GITHUB_WORKSPACE}/build/ksq-1/environment/build-environment-tool-versions.txt" ]]; then
            cp "${GITHUB_WORKSPACE}/build/ksq-1/environment/build-environment-tool-versions.txt" "${out}/"
          fi
          if [[ -f "${GITHUB_WORKSPACE}/build/ksq-1/environment/resolute-amd64-buildd.tar.zst.sha256" ]]; then
            cp "${GITHUB_WORKSPACE}/build/ksq-1/environment/resolute-amd64-buildd.tar.zst.sha256" "${out}/"
          fi

          [[ "$(cat /proc/self/attr/current)" == 'supralinux-ksq-unshare (enforce)' ]]
          [[ ${rc_mmdebstrap} -eq 0 ]]
          grep -Fqx 'AURORA_KSQ_1_BUILD_ENV_BACKEND=unshare' \
            "${GITHUB_WORKSPACE}/build/ksq-1/environment/build-environment.env"
          echo 'AURORA_KSQ_MMDEBSTRAP_UNSHARE_PASS'

      - name: Preserve mmdebstrap diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-self-hosted-mmdebstrap-diagnostic
          path: |
            build/ksq-self-hosted-mmdebstrap-diagnostic/
            build/ksq-1/environment/build-environment.env
            build/ksq-1/environment/build-environment-tool-versions.txt
            build/ksq-1/environment/resolute-amd64-buildd.tar.zst.sha256
          if-no-files-found: warn
          retention-days: 30

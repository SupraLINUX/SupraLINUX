name: Aurora KSQ-1 self-hosted representative build

on:
  push:
    branches:
      - feature/kde-stack-qualification
    paths:
      - '.github/workflows/ksq-1-self-hosted-representative.yml'
      - '.github/ksq-self-hosted-representative-trigger.env'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  representative:
    name: Build certified DAG source 001 on self-hosted runner
    runs-on: [self-hosted, Linux, X64, supralinux-ksq, docker]
    timeout-minutes: 90
    container:
      image: ubuntu:26.04@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b
      options: --security-opt seccomp=unconfined

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Bootstrap toolchain from certified Ubuntu snapshot
        shell: bash
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/build/ksq-self-hosted-representative"
          mkdir -p "${out}"

          . tests/kde-stack/apt-metadata-snapshot.env
          snapshot="${AURORA_KSQ_0_APT_SNAPSHOT:?missing KSQ-0 snapshot}"
          [[ "${snapshot}" =~ ^[0-9]{8}T[0-9]{6}Z$ ]]
          snapshot_uri="https://snapshot.ubuntu.com/ubuntu/${snapshot}/"

          cat > /etc/apt/sources.list.d/ubuntu.sources <<EOF_SOURCES
          Types: deb
          URIs: ${snapshot_uri}
          Suites: resolute resolute-updates resolute-security resolute-backports
          Components: main universe restricted multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF_SOURCES

          export DEBIAN_FRONTEND=noninteractive

          # The official minimal Ubuntu image has no CA bundle. Bootstrap only
          # ca-certificates from the same signed Ubuntu snapshot. TLS peer/host
          # verification is relaxed for this first acquisition only; apt-secure
          # signature and package-hash verification remain enabled.
          apt_tls_bootstrap=(
            -o Acquire::https::Verify-Peer=false
            -o Acquire::https::Verify-Host=false
          )
          apt-get "${apt_tls_bootstrap[@]}" update 2>&1 | tee "${out}/apt-bootstrap-update.log"
          grep -Fq "snapshot.ubuntu.com/ubuntu/${snapshot}" "${out}/apt-bootstrap-update.log"
          ! grep -Eq 'archive\.ubuntu\.com|security\.ubuntu\.com' "${out}/apt-bootstrap-update.log"
          ! grep -Eq '(^|[[:space:]])(NO_PUBKEY|EXPKEYSIG|BADSIG|The repository .* is not signed)' "${out}/apt-bootstrap-update.log"

          apt-get "${apt_tls_bootstrap[@]}" install -y --no-install-recommends ca-certificates \
            2>&1 | tee "${out}/apt-bootstrap-ca.log"
          dpkg-query -W -f='${Status}\n' ca-certificates | grep -Fxq 'install ok installed'

          # From this point onward TLS verification must be normal. Throw away
          # the indexes obtained during the CA bootstrap and reacquire them.
          rm -rf /var/lib/apt/lists/*
          apt-get update 2>&1 | tee "${out}/apt-verified-update.log"
          grep -Fq "snapshot.ubuntu.com/ubuntu/${snapshot}" "${out}/apt-verified-update.log"
          ! grep -Eq 'archive\.ubuntu\.com|security\.ubuntu\.com' "${out}/apt-verified-update.log"
          ! grep -Eq '(^|[[:space:]])(Err:|W: Failed to fetch|NO_PUBKEY|EXPKEYSIG|BADSIG|The repository .* is not signed)' "${out}/apt-verified-update.log"

          apt-get install -y --no-install-recommends \
            sudo git python3 curl \
            sbuild mmdebstrap uidmap zstd devscripts dpkg-dev apt-utils \
            ubuntu-keyring gzip xz-utils diffutils \
            2>&1 | tee "${out}/apt-toolchain-install.log"

          for command in \
            sudo git python3 curl sbuild mmdebstrap newuidmap newgidmap zstd \
            debuild dch dpkg-source dpkg-buildpackage unshare; do
            command -v "${command}" >/dev/null || {
              echo "AURORA_KSQ_SELF_HOSTED_REP_FAILURE: missing ${command} after bootstrap" >&2
              exit 1
            }
          done
          unshare -Ur true

          dpkg-query -W -f='${Package}\t${Version}\n' \
            sudo git python3 curl ca-certificates \
            sbuild mmdebstrap uidmap zstd devscripts dpkg-dev apt-utils \
            ubuntu-keyring gzip xz-utils diffutils \
            | sort > "${out}/toolchain.tsv"
          {
            echo "AURORA_KSQ_SELF_HOSTED_REP_SNAPSHOT=${snapshot}"
            echo "AURORA_KSQ_SELF_HOSTED_REP_SNAPSHOT_URI=${snapshot_uri}"
            echo 'AURORA_KSQ_SELF_HOSTED_REP_CA_BOOTSTRAP=same-snapshot+apt-secure'
            echo 'AURORA_KSQ_SELF_HOSTED_REP_TLS_AFTER_CA=verified'
            echo 'AURORA_KSQ_SELF_HOSTED_REP_SECCOMP=unconfined'
            echo 'AURORA_KSQ_SELF_HOSTED_REP_UNSHARE=PASS'
          } > "${out}/environment.env"

      - name: Prepare KSQ-1 build environment
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/prepare-ksq-1-runner.sh

      - name: Build representative certified source 001
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/build-ksq-1-range.sh 1 1

      - name: Record representative PASS
        shell: bash
        run: |
          set -euo pipefail
          . build/ksq-1/full/chunk-001-001/evidence/range-status.env
          [[ "${AURORA_KSQ_1_RANGE_STATUS}" == "PASS" ]]
          [[ "${AURORA_KSQ_1_RANGE_FIRST_ORDER}" == "1" ]]
          [[ "${AURORA_KSQ_1_RANGE_LAST_COMPLETED_ORDER}" == "1" ]]
          {
            echo 'AURORA_KSQ_SELF_HOSTED_REPRESENTATIVE=PASS'
            echo 'AURORA_KSQ_SELF_HOSTED_REPRESENTATIVE_RANGE=1-1'
            echo "AURORA_KSQ_SELF_HOSTED_REPRESENTATIVE_DEBS=${AURORA_KSQ_1_RANGE_NEW_DEBS}"
          } | tee build/ksq-self-hosted-representative/status.env

      - name: Preserve representative evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-self-hosted-representative-001
          path: |
            build/ksq-self-hosted-representative/
            build/ksq-0/closure-status.env
            build/ksq-0/apt-metadata.sha256
            build/ksq-0/source-audit/selected-source-files.sha256
            build/ksq-1/build-tool-versions.tsv
            build/ksq-1/environment/build-environment.env
            build/ksq-1/environment/build-environment-tool-versions.txt
            build/ksq-1/environment/resolute-amd64-buildd.tar.zst.sha256
            build/ksq-1/full/chunk-001-001/evidence/
            build/ksq-1/full/chunk-001-001/new-debs/
          if-no-files-found: warn
          retention-days: 30

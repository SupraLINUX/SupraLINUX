name: Aurora KSQ-1 self-hosted namespace diagnostic

on:
  push:
    branches:
      - feature/kde-stack-qualification
    paths:
      - '.github/workflows/ksq-1-self-hosted-representative.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  namespace-diagnostic:
    name: Diagnose nested unprivileged user namespaces
    runs-on: [self-hosted, Linux, X64, supralinux-ksq, docker]
    timeout-minutes: 20
    container:
      image: ubuntu:26.04@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b
      options: --security-opt seccomp=unconfined

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Diagnose namespace environment
        shell: bash
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/build/ksq-self-hosted-namespace-diagnostic"
          mkdir -p "${out}"

          . tests/kde-stack/apt-metadata-snapshot.env
          snapshot="${AURORA_KSQ_0_APT_SNAPSHOT:?missing KSQ-0 snapshot}"
          [[ "${snapshot}" == "20260829T022000Z" ]]
          snapshot_uri="https://snapshot.ubuntu.com/ubuntu/${snapshot}/"

          cat > /etc/apt/sources.list.d/ubuntu.sources <<EOF_SOURCES
          Types: deb
          URIs: ${snapshot_uri}
          Suites: resolute resolute-updates resolute-security resolute-backports
          Components: main universe restricted multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF_SOURCES

          export DEBIAN_FRONTEND=noninteractive
          apt_tls_bootstrap=(
            -o Acquire::https::Verify-Peer=false
            -o Acquire::https::Verify-Host=false
          )
          apt-get "${apt_tls_bootstrap[@]}" update >"${out}/apt-bootstrap-update.log" 2>&1
          apt-get "${apt_tls_bootstrap[@]}" install -y --no-install-recommends ca-certificates \
            >"${out}/apt-bootstrap-ca.log" 2>&1
          rm -rf /var/lib/apt/lists/*
          apt-get update >"${out}/apt-verified-update.log" 2>&1
          apt-get install -y --no-install-recommends \
            sudo uidmap libcap2-bin util-linux curl python3 \
            >"${out}/apt-diagnostic-toolchain.log" 2>&1

          printf 'ubuntu ALL=(ALL) NOPASSWD:ALL\n' > /etc/sudoers.d/ubuntu-ksq
          chmod 0440 /etc/sudoers.d/ubuntu-ksq
          grep -q '^ubuntu:' /etc/subuid || echo 'ubuntu:100000:65536' >> /etc/subuid
          grep -q '^ubuntu:' /etc/subgid || echo 'ubuntu:100000:65536' >> /etc/subgid

          {
            echo '=== identity ==='
            id
            id ubuntu
            echo
            echo '=== parent namespace maps ==='
            cat /proc/self/uid_map
            cat /proc/self/gid_map
            echo
            echo '=== process security ==='
            grep -E '^(Cap(Inh|Prm|Eff|Bnd|Amb)|NoNewPrivs|Seccomp):' /proc/self/status
            printf 'apparmor='; cat /proc/self/attr/current || true
            echo
            echo '=== root capabilities ==='
            capsh --print
            echo
            echo '=== ubuntu capabilities before setuid helper ==='
            sudo -u ubuntu -H capsh --print
            echo
            echo '=== uidmap helpers ==='
            stat -c '%A %a %U %G %u %g %n' /usr/bin/newuidmap /usr/bin/newgidmap
            getcap /usr/bin/newuidmap /usr/bin/newgidmap || true
            echo
            echo '=== subordinate ids ==='
            grep '^ubuntu:' /etc/subuid || true
            grep '^ubuntu:' /etc/subgid || true
            echo
            echo '=== mount flags ==='
            findmnt -no TARGET,FSTYPE,OPTIONS / || true
            findmnt -no TARGET,FSTYPE,OPTIONS /usr || true
            echo
            echo '=== Ubuntu userns policy ==='
            sysctl kernel.apparmor_restrict_unprivileged_userns 2>&1 || true
            sysctl kernel.unprivileged_userns_clone 2>&1 || true
            sysctl user.max_user_namespaces 2>&1 || true
            echo
            echo '=== kernel ==='
            uname -a
          } | tee "${out}/namespace-environment.txt"

          curl -fsS --unix-socket /var/run/docker.sock http://localhost/v1.55/info \
            > "${out}/docker-info.json"
          python3 - "${out}/docker-info.json" <<'PY'
          import json, sys
          p = sys.argv[1]
          d = json.load(open(p, encoding='utf-8'))
          keys = [
              'ServerVersion', 'KernelVersion', 'OperatingSystem', 'OSType',
              'Architecture', 'DockerRootDir', 'Name', 'CgroupDriver',
              'CgroupVersion', 'SecurityOptions'
          ]
          for k in keys:
              print(f'{k}={d.get(k)!r}')
          PY
          python3 - "${out}/docker-info.json" > "${out}/docker-info-summary.txt" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding='utf-8'))
          for k in ('ServerVersion','KernelVersion','OperatingSystem','OSType','Architecture','DockerRootDir','Name','CgroupDriver','CgroupVersion','SecurityOptions'):
              print(f'{k}={d.get(k)!r}')
          PY
          cat "${out}/docker-info-summary.txt"

          hostname_id="$(cat /etc/hostname)"
          if curl -fsS --unix-socket /var/run/docker.sock \
              "http://localhost/v1.55/containers/${hostname_id}/json" \
              > "${out}/job-container-inspect.json"; then
            python3 - "${out}/job-container-inspect.json" > "${out}/job-container-security.txt" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding='utf-8'))
          hc = d.get('HostConfig', {})
          print(f"AppArmorProfile={d.get('AppArmorProfile')!r}")
          print(f"UsernsMode={hc.get('UsernsMode')!r}")
          print(f"Privileged={hc.get('Privileged')!r}")
          print(f"CapAdd={hc.get('CapAdd')!r}")
          print(f"CapDrop={hc.get('CapDrop')!r}")
          print(f"SecurityOpt={hc.get('SecurityOpt')!r}")
          PY
            cat "${out}/job-container-security.txt"
          else
            echo 'container inspect unavailable by hostname' | tee "${out}/job-container-security.txt"
          fi

          set +e
          sudo -u ubuntu -H unshare --user --map-root-user true \
            >"${out}/test-map-root.stdout" 2>"${out}/test-map-root.stderr"
          rc_map_root=$?

          sudo -u ubuntu -H unshare --user \
            --map-auto --map-user=65536 --map-group=65536 --keep-caps true \
            >"${out}/test-map-auto.stdout" 2>"${out}/test-map-auto.stderr"
          rc_map_auto=$?

          sudo -u ubuntu -H unshare \
            --map-auto --map-user=65536 --map-group=65536 --keep-caps \
            --mount --pid --uts --ipc --fork true \
            >"${out}/test-full.stdout" 2>"${out}/test-full.stderr"
          rc_full=$?
          set -e

          {
            echo "AURORA_KSQ_NS_DIAG_MAP_ROOT_RC=${rc_map_root}"
            echo "AURORA_KSQ_NS_DIAG_MAP_AUTO_RC=${rc_map_auto}"
            echo "AURORA_KSQ_NS_DIAG_FULL_RC=${rc_full}"
          } | tee "${out}/results.env"

          echo '--- map-root stderr ---'
          cat "${out}/test-map-root.stderr"
          echo '--- map-auto stderr ---'
          cat "${out}/test-map-auto.stderr"
          echo '--- full stderr ---'
          cat "${out}/test-full.stderr"
          echo 'AURORA_KSQ_NAMESPACE_DIAGNOSTIC_COMPLETE'

      - name: Preserve namespace diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-self-hosted-namespace-diagnostic
          path: build/ksq-self-hosted-namespace-diagnostic/
          if-no-files-found: error
          retention-days: 30

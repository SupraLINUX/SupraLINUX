name: Materialize Batch 6 packaging-reference validator fix

on:
  push:
    branches:
      - tooling/batch6-packaging-reference-validator-fix

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Update packaging-reference validator and closure documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          validator = Path('scripts/validate_kde_tier1_packaging_reference.py')
          text = validator.read_text(encoding='utf-8')
          anchor = '    "networkmanager-qt": ("6.30.0-0supralinux1", 35014875475, 10414714325, "abf927b5749b34094d2b5ee530831f64638ba116a83e8b82f925a758aa018ad4"),\n'
          additions = (
              '    "kwindowsystem": ("6.30.0-0supralinux4", 35047623320, 10428130399, "9c35d5e228d3f8b71fb1e84863fac030bfd26a8e3c528ae718e788708db01272"),\n'
              '    "solid": ("6.30.0-0supralinux2", 35047623320, 10427653865, "cff267d012a3e103b53bd6e19757e6c3b0af7dc873f4cd166a4505f58aee8389"),\n'
          )
          if '"kwindowsystem": ("6.30.0-0supralinux4", 35047623320' not in text:
              if anchor not in text:
                  raise SystemExit('PASS_NODES anchor not found')
              text = text.replace(anchor, anchor + additions, 1)

          old_pass_logic = """        passes = [item for item in packaging.get(\"evidence\", []) if isinstance(item, dict) and item.get(\"result\") == \"PASS\"]\n        require(len(passes) == 1, f\"{node_id}: exactly one current PASS evidence item expected\")\n        if passes:\n            require(passes[0].get(\"workflow_run\") == run, f\"{node_id}: PASS run mismatch\")\n            require(passes[0].get(\"artifact_id\") == artifact, f\"{node_id}: PASS artifact mismatch\")\n            require(passes[0].get(\"artifact_sha256\") == digest, f\"{node_id}: PASS digest mismatch\")\n"""
          new_pass_logic = """        passes = [item for item in packaging.get(\"evidence\", []) if isinstance(item, dict) and item.get(\"result\") == \"PASS\"]\n        current_passes = [item for item in passes if item.get(\"workflow_run\") == run and item.get(\"artifact_id\") == artifact]\n        require(len(current_passes) == 1, f\"{node_id}: exactly one current PASS matching expected run/artifact required\")\n        if current_passes:\n            require(current_passes[0].get(\"workflow_run\") == run, f\"{node_id}: PASS run mismatch\")\n            require(current_passes[0].get(\"artifact_id\") == artifact, f\"{node_id}: PASS artifact mismatch\")\n            require(current_passes[0].get(\"artifact_sha256\") == digest, f\"{node_id}: PASS digest mismatch\")\n"""
          if old_pass_logic in text:
              text = text.replace(old_pass_logic, new_pass_logic, 1)
          elif new_pass_logic not in text:
              raise SystemExit('current PASS selection anchor not found')

          replacements = {
              '== 16, "Reference validator expects 16 actual package PASS nodes"': '== 18, "Reference validator expects 18 actual package PASS nodes"',
              '== 13, "Reference validator expects 13 pending nodes"': '== 11, "Reference validator expects 11 pending nodes"',
              'Actual package states: 16 PASS; 13 pending': 'Actual package states: 18 PASS; 11 pending',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f'validator replacement anchor missing: {old}')
          validator.write_text(text, encoding='utf-8')

          doc = Path('docs/status/2026-09-15-batch6.md')
          d = doc.read_text(encoding='utf-8')
          marker = '### Packaging-reference validator follow-up'
          if marker not in d:
              d += (
                  '\n\n' + marker + '\n\n'
                  '- Repository Policy then exposed the same stale `16 PASS / 13 pending` and single-PASS-only assumptions in `validate_kde_tier1_packaging_reference.py`. '
                  'That validator is aligned to the promoted `18 PASS / 11 pending` state and now identifies the current PASS by expected run/artifact while retaining historical PASS evidence. '
                  'The packaging-reference snapshot itself remains unchanged and non-authoritative; no package, source, runner, ABI, or build-input change is introduced.\n'
              )
              doc.write_text(d, encoding='utf-8')
          PY
      - name: Validate generated state
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/validate_kde_tier1.py scripts/validate_kde_tier1_packaging_reference.py scripts/validate_kde_tier1_package_batch6.py
          python3 scripts/validate_kde_dag.py
          python3 scripts/validate_kde_tier1.py
          python3 scripts/validate_kde_tier1_packaging_reference.py
          python3 scripts/validate_kde_tier1_package_batch6.py
      - name: Commit materialized blobs on tooling branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SupraLINUX CI'
          git config user.email 'ci@supralinux.invalid'
          git add scripts/validate_kde_tier1_packaging_reference.py docs/status/2026-09-15-batch6.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'tooling: materialize Batch 6 packaging-reference validator fix'
          git push

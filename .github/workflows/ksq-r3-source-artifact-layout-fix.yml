name: Aurora KSQ r3 source artifact layout fix

on:
  push:
    branches:
      - feature/kde-stack-qualification
    paths:
      - '.github/ksq-r3-source-artifact-layout-fix.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Apply exact heterogeneous source-artifact layout corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              '.github/workflows/ksq-accept-081-090-r3.yml': [(
                  '''          src="$RUNNER_TEMP/source"\n          base="$src/build/ksq-1/native-range-081-090-r3"\n          evidence="$src/build/ksq-1/full/chunk-081-090/evidence"\n          new="$src/build/ksq-1/full/chunk-081-090/new-debs"\n''',
                  '''          src="$RUNNER_TEMP/source"\n          source_root=\n          for candidate in "$src" "$src/build"; do\n            if [[ -d "$candidate/ksq-1/full/chunk-081-090" ]]; then\n              test -z "$source_root"\n              source_root="$candidate"\n            fi\n          done\n          test -n "$source_root"\n          base="$source_root/ksq-1/native-range-081-090-r3"\n          evidence="$source_root/ksq-1/full/chunk-081-090/evidence"\n          new="$source_root/ksq-1/full/chunk-081-090/new-debs"\n'''
              )],
              '.github/workflows/ksq-native-range-091-101-r3.yml': [(
                  '''          stage_range() {\n            local root="$1" range="$2" expected_new="$3" expected_acc="$4"\n            local chunk="$root/build/ksq-1/full/chunk-$range"\n            test -d "$chunk/new-debs" && test -f "$chunk/evidence/new-debs.sha256"\n''',
                  '''          stage_range() {\n            local root="$1" range="$2" expected_new="$3" expected_acc="$4"\n            local chunk= candidate\n            for candidate in "$root" "$root/build"; do\n              if [[ -d "$candidate/ksq-1/full/chunk-$range" ]]; then\n                test -z "$chunk"\n                chunk="$candidate/ksq-1/full/chunk-$range"\n              fi\n            done\n            test -n "$chunk"\n            test -d "$chunk/new-debs" && test -f "$chunk/evidence/new-debs.sha256"\n'''
              )],
              '.github/workflows/ksq-accept-091-101-r3.yml': [(
                  '''          src="$RUNNER_TEMP/source"; base="$src/build/ksq-1/native-range-091-101-r3"; evidence="$src/build/ksq-1/full/chunk-091-101/evidence"; new="$src/build/ksq-1/full/chunk-091-101/new-debs"\n''',
                  '''          src="$RUNNER_TEMP/source"\n          source_root=\n          for candidate in "$src" "$src/build"; do\n            if [[ -d "$candidate/ksq-1/full/chunk-091-101" ]]; then\n              test -z "$source_root"\n              source_root="$candidate"\n            fi\n          done\n          test -n "$source_root"\n          base="$source_root/ksq-1/native-range-091-101-r3"\n          evidence="$source_root/ksq-1/full/chunk-091-101/evidence"\n          new="$source_root/ksq-1/full/chunk-091-101/new-debs"\n'''
              )],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: expected one exact replacement, found {count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          forbidden = [
              '$src/build/ksq-1/native-range-081-090-r3',
              '$root/build/ksq-1/full/chunk-$range',
              '$src/build/ksq-1/native-range-091-101-r3',
          ]
          for filename in replacements:
              text = Path(filename).read_text(encoding='utf-8')
              for token in forbidden:
                  if token in text:
                      raise SystemExit(f'{filename}: stale hard-coded source artifact layout remains: {token}')
          print('AURORA_KSQ_R3_SOURCE_ARTIFACT_LAYOUT_FIX=PASS')
          PY
          git diff --check
          git diff -- .github/workflows/ksq-accept-081-090-r3.yml .github/workflows/ksq-native-range-091-101-r3.yml .github/workflows/ksq-accept-091-101-r3.yml

      - name: Commit exact tooling correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ksq-accept-081-090-r3.yml .github/workflows/ksq-native-range-091-101-r3.yml .github/workflows/ksq-accept-091-101-r3.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'ci(ksq): handle heterogeneous source artifact roots'
          echo "AURORA_PATCH_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:feature/kde-stack-qualification

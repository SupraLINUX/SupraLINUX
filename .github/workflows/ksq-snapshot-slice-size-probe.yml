name: Aurora KSQ certified snapshot slice size probe

on:
  push:
    branches: [feature/kde-stack-qualification]
    paths: ['.github/workflows/ksq-snapshot-slice-size-probe.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  size-snapshot-slice:
    name: Calculate snapshot slice without downloading package payloads
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Retrieve canonical KSQ-0 closure evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ksq0" "$RUNNER_TEMP/slice-size"
          curl --fail --location --retry 5 --retry-all-errors \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/SupraLINUX/SupraLINUX/actions/artifacts/9708738867/zip' \
            -o "$RUNNER_TEMP/ksq0.zip"
          unzip -q "$RUNNER_TEMP/ksq0.zip" -d "$RUNNER_TEMP/ksq0"
          test -s "$RUNNER_TEMP/ksq0/build/ksq-0/ubuntu-satisfied-build-deps.tsv"
          test -s "$RUNNER_TEMP/ksq0/build/ksq-0/selected-source-records.txt"
          grep -qx 'AURORA_KSQ_0_APT_SNAPSHOT=20260829T022000Z' "$RUNNER_TEMP/ksq0/build/ksq-0/closure-status.env"
          grep -qx 'AURORA_KSQ_0_CLOSURE_STATUS=COMPLETE' "$RUNNER_TEMP/ksq0/build/ksq-0/closure-status.env"
          printf '%s\n' 'artifact_id=9708738867' \
            'artifact_digest=sha256:5b23140181ea7e7931cb744f4c43930adba8f79e446c52d0f4b1c3c568106d50' \
            > "$RUNNER_TEMP/slice-size/canonical-artifact.txt"

      - name: Calculate binary and source object footprint
        shell: bash
        run: |
          set -euo pipefail
          image='ubuntu:26.04@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b'
          docker pull "$image"
          docker run --rm -i \
            -v "$RUNNER_TEMP/ksq0:/evidence:ro" \
            -v "$RUNNER_TEMP/slice-size:/out" \
            "$image" bash -s <<'EOF'
          set -euo pipefail
          snapshot=20260829T022000Z
          export DEBIAN_FRONTEND=noninteractive
          rm -f /etc/apt/sources.list /etc/apt/sources.list.d/*
          cat >/etc/apt/sources.list.d/ubuntu.sources <<SOURCES
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu
          Suites: resolute resolute-updates resolute-backports
          Components: main universe restricted multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          Snapshot: ${snapshot}

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu
          Suites: resolute-security
          Components: main universe restricted multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          Snapshot: ${snapshot}
          SOURCES

          t0=$(date +%s)
          # The minimal OCI image does not yet contain a usable CA bundle. TLS
          # verification is disabled only while acquiring signed APT metadata;
          # InRelease signatures remain mandatory and Error-Mode=any fails closed.
          apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::https::Verify-Peer=false \
            -o Acquire::https::Verify-Host=false \
            -o APT::Update::Error-Mode=any update 2>&1 | tee /out/apt-update.log
          t1=$(date +%s)

          awk -F '\t' 'NR>1 {
            pkg=$4; n=split($7,a," "); ver=""
            for(i=1;i<=n;i++) if(index(a[i],pkg "=")==1) {ver=substr(a[i],length(pkg)+2); break}
            if(ver=="") {print "missing certified version for " pkg > "/dev/stderr"; exit 2}
            print pkg "\t" ver
          }' /evidence/build/ksq-0/ubuntu-satisfied-build-deps.tsv | sort -u > /out/certified-binary-seeds.tsv
          test "$(wc -l </out/certified-binary-seeds.tsv)" -eq 244

          while IFS=$'\t' read -r pkg expected; do
            candidate=$(apt-cache policy "$pkg" | awk '/Candidate:/ {print $2; exit}')
            printf '%s\t%s\t%s\n' "$pkg" "$expected" "$candidate" >>/out/candidate-verification.tsv
            [[ "$candidate" == "$expected" ]] || { echo "candidate mismatch: $pkg expected=$expected candidate=$candidate" >&2; exit 3; }
          done </out/certified-binary-seeds.tsv

          : >/tmp/empty-status
          mapfile -t seeds < <(awk -F '\t' '{print $1 "=" $2}' /out/certified-binary-seeds.tsv)
          roots=('?essential' apt build-essential ca-certificates ubuntu-keyring sudo sbuild mmdebstrap uidmap zstd devscripts dpkg-dev apt-utils gzip xz-utils diffutils libcap2-bin)
          roots+=("${seeds[@]}")
          apt-get -o Dir::State::status=/tmp/empty-status --no-install-recommends --print-uris --yes install "${roots[@]}" > /out/binary-print-uris.txt

          awk '/^\047/ && NF>=4 && $3~/^[0-9]+$/ {
            f=$2; gsub(/^\047|\047$/, "", f); s=$3+0
            if(!(f in seen)){seen[f]=s; total+=s; count++}
            else if(seen[f]!=s){exit 4}
          } END {printf "AURORA_KSQ_SLICE_BINARY_OBJECTS=%d\nAURORA_KSQ_SLICE_BINARY_BYTES=%.0f\n",count,total}' \
            /out/binary-print-uris.txt > /out/binary-size.env

          awk '/^Checksums-Sha512:/ {on=1; next}
            on && NF>=3 && length($1)==128 && $2~/^[0-9]+$/ {
              f=$3; s=$2+0; if(!(f in seen)){seen[f]=s; total+=s; count++}; next
            } on {on=0}
            END {printf "AURORA_KSQ_SLICE_UBUNTU_SOURCE_OBJECTS=%d\nAURORA_KSQ_SLICE_UBUNTU_SOURCE_BYTES=%.0f\n",count,total}' \
            /evidence/build/ksq-0/selected-source-records.txt > /out/source-size.env

          deb_bytes=0; deb_count=0
          while IFS= read -r -d '' f; do deb_bytes=$((deb_bytes+$(stat -c %s "$f"))); deb_count=$((deb_count+1)); done \
            < <(find /evidence/build/ksq-0/source-audit/downloads -maxdepth 1 -type f -name 'wayland-protocols_1.48*' -print0 | sort -z)
          test "$deb_count" -eq 4
          printf 'AURORA_KSQ_SLICE_DEBIAN_SOURCE_OBJECTS=%d\nAURORA_KSQ_SLICE_DEBIAN_SOURCE_BYTES=%d\n' "$deb_count" "$deb_bytes" >> /out/source-size.env

          bin=$(awk -F= '$1=="AURORA_KSQ_SLICE_BINARY_BYTES"{print $2}' /out/binary-size.env)
          src=$(awk -F= '$1=="AURORA_KSQ_SLICE_UBUNTU_SOURCE_BYTES"{print $2}' /out/source-size.env)
          dsrc=$(awk -F= '$1=="AURORA_KSQ_SLICE_DEBIAN_SOURCE_BYTES"{print $2}' /out/source-size.env)
          meta=$(du -sb /var/lib/apt/lists | awk '{print $1}')
          total=$((bin+src+dsrc+meta))
          {
            echo AURORA_KSQ_SLICE_STATUS=MEASURED_METADATA_ONLY
            echo AURORA_KSQ_SLICE_SNAPSHOT=$snapshot
            echo AURORA_KSQ_SLICE_CERTIFIED_BINARY_SEEDS=244
            cat /out/binary-size.env /out/source-size.env
            echo AURORA_KSQ_SLICE_APT_LISTS_UNCOMPRESSED_BYTES=$meta
            echo AURORA_KSQ_SLICE_RAW_UPPER_BOUND_BYTES=$total
            echo AURORA_KSQ_SLICE_APT_UPDATE_SECONDS=$((t1-t0))
            echo AURORA_KSQ_SLICE_PAYLOADS_DOWNLOADED=0
          } | tee /out/results.env
          EOF

      - name: Show size report
        shell: bash
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/slice-size/results.env"
          python3 - <<'PY'
          import os
          from pathlib import Path
          v=dict(line.split('=',1) for line in (Path(os.environ['RUNNER_TEMP'])/'slice-size/results.env').read_text().splitlines() if '=' in line)
          for k in ['AURORA_KSQ_SLICE_BINARY_BYTES','AURORA_KSQ_SLICE_UBUNTU_SOURCE_BYTES','AURORA_KSQ_SLICE_DEBIAN_SOURCE_BYTES','AURORA_KSQ_SLICE_APT_LISTS_UNCOMPRESSED_BYTES','AURORA_KSQ_SLICE_RAW_UPPER_BOUND_BYTES']:
              print(f'{k}_GIB={int(v[k])/2**30:.4f}')
          raw=int(v['AURORA_KSQ_SLICE_RAW_UPPER_BOUND_BYTES'])
          print(f'AURORA_KSQ_SLICE_RECOMMENDED_25PCT_HEADROOM_GIB={raw*1.25/2**30:.4f}')
          PY

      - name: Preserve size evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-certified-snapshot-slice-size
          path: ${{ runner.temp }}/slice-size/
          if-no-files-found: warn
          retention-days: 30

name: Temporary Batch 1 evidence fix

on:
  push:
    branches: [tmp-batch1-closure]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tmp-batch1-closure
      - name: Correct retained KDBusAddons data hash
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wrong = '279d4f563b0b9ee509d7aac09974c5a870973bc4380897add15ada15e4d1413'
          right = '279d4f563b0b9ee509d7aac09974c5a870973bc43808987add15ada15e4d1413'
          paths = [
              Path('manifests/kde-tier1-package-campaign.json'),
              Path('manifests/kde-frameworks-tier1.json'),
              Path('manifests/kde-dag.json'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if wrong not in text:
                  raise SystemExit(f'{path}: expected mistyped hash not found')
              path.write_text(text.replace(wrong, right), encoding='utf-8')
          PY
          git config user.name 'SupraLINUX CI'
          git config user.email 'ci@supralinux.invalid'
          git add manifests/kde-tier1-package-campaign.json manifests/kde-frameworks-tier1.json manifests/kde-dag.json
          git commit -m 'tmp: correct retained KDBusAddons data hash'
          git push origin HEAD:tmp-batch1-closure

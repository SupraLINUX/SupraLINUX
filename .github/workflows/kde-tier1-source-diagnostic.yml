name: KDE Frameworks Tier 1 global source diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-diagnostic:
    name: ${{ matrix.node }} 6.30 source diagnostic
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        node: [kconfig, ki18n, sonnet, kirigami, kquickcharts, kuserfeedback, prison]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Determine whether this diagnostic node is affected
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          run=true
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ "${{ github.event.action }}" == "synchronize" ]]; then
              before="${{ github.event.before }}"
              after="${{ github.event.after }}"
            else
              before="${{ github.event.pull_request.base.sha }}"
              after="${{ github.event.pull_request.head.sha }}"
            fi
            if bash scripts/kde-tier1-source-diagnostic-needed.sh "${before}" "${after}" "${{ matrix.node }}"; then
              run=true
            else
              rc=$?
              [[ "${rc}" -eq 1 ]] && run=false || exit "${rc}"
            fi
          fi
          echo "run=${run}" >> "${GITHUB_OUTPUT}"

      - name: Download retained ECM PASS artifact
        if: steps.scope.outputs.run == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '10298635300'
          github-token: ${{ github.token }}
          repository: SupraLINUX/SupraLINUX
          run-id: '34694951158'
          path: .work/retained-ecm

      - name: Build and test upstream KDE source
        if: steps.scope.outputs.run == 'true'
        env:
          ECM_ARTIFACT_DIR: ${{ github.workspace }}/.work/retained-ecm
        run: bash scripts/run-kde-tier1-source-diagnostic.sh "${{ matrix.node }}"

      - name: Upload per-node diagnostic evidence
        if: steps.scope.outputs.run == 'true' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kde-tier1-source-diagnostic-${{ matrix.node }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/kde-tier1-source-diagnostic/${{ matrix.node }}/
          if-no-files-found: error
          retention-days: 90

      - name: Report intentionally skipped diagnostic
        if: steps.scope.outputs.run != 'true'
        run: echo "${{ matrix.node }} intentionally skipped; event delta does not alter this node's diagnostic contract."

name: KDE Frameworks Tier 3 KIO Round 25 remediation proof

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    name: KIO Round 25 deterministic ordering remediation proof
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate remediation definition
        run: python3 scripts/validate_kde_tier3_kio_round25_remediation.py

      - name: Capture Round 25 remediation evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/run-kde-tier3-kio-round25-diagnostic.sh

      - name: Upload remediation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kde-tier3-kio-round25-remediation-${{ github.sha }}
          path: evidence/kde-tier3-kio-round25-diagnostic/
          if-no-files-found: error
          retention-days: 90

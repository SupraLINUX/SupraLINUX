name: Aurora KSQ r3 downstream artifact layout fix

on:
  push:
    branches:
      - feature/kde-stack-qualification
    paths:
      - '.github/ksq-r3-downstream-artifact-layout-fix.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Apply exact flattened-artifact path corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              '.github/workflows/ksq-native-range-081-090-r3.yml': [
                  ('$RUNNER_TEMP/accept-080/ksq-1/accept-066-080-r3', '$RUNNER_TEMP/accept-080'),
              ],
              '.github/workflows/ksq-accept-081-090-r3.yml': [
                  ('$RUNNER_TEMP/prior/ksq-1/accept-066-080-r3', '$RUNNER_TEMP/prior'),
              ],
              '.github/workflows/ksq-native-range-091-101-r3.yml': [
                  ('$RUNNER_TEMP/accept-090/ksq-1/accept-081-090-r3', '$RUNNER_TEMP/accept-090'),
                  ('$RUNNER_TEMP/accept-080/ksq-1/accept-066-080-r3', '$RUNNER_TEMP/accept-080'),
              ],
              '.github/workflows/ksq-accept-091-101-r3.yml': [
                  ('$RUNNER_TEMP/prior/ksq-1/accept-081-090-r3', '$RUNNER_TEMP/prior'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: expected exactly one {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          forbidden = [
              '$RUNNER_TEMP/accept-080/ksq-1/accept-066-080-r3',
              '$RUNNER_TEMP/prior/ksq-1/accept-066-080-r3',
              '$RUNNER_TEMP/accept-090/ksq-1/accept-081-090-r3',
              '$RUNNER_TEMP/prior/ksq-1/accept-081-090-r3',
          ]
          for filename in replacements:
              text = Path(filename).read_text(encoding='utf-8')
              for token in forbidden:
                  if token in text:
                      raise SystemExit(f'{filename}: stale nested artifact path remains: {token}')
          print('AURORA_KSQ_R3_DOWNSTREAM_ARTIFACT_LAYOUT_FIX=PASS')
          PY
          git diff --check
          git diff -- .github/workflows/ksq-native-range-081-090-r3.yml .github/workflows/ksq-accept-081-090-r3.yml .github/workflows/ksq-native-range-091-101-r3.yml .github/workflows/ksq-accept-091-101-r3.yml

      - name: Commit exact tooling correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/ksq-native-range-081-090-r3.yml \
            .github/workflows/ksq-accept-081-090-r3.yml \
            .github/workflows/ksq-native-range-091-101-r3.yml \
            .github/workflows/ksq-accept-091-101-r3.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m 'ci(ksq): fix flattened downstream acceptance artifact paths'
          git push origin HEAD:feature/kde-stack-qualification

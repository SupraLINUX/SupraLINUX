name: Aurora KSQ-1 node 040 alternative resolution validation

on:
  push:
    branches:
      - feature/kde-stack-qualification
    paths:
      - '.github/workflows/ksq-1-node40-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-node-040:
    name: Validate kf6-kfilemetadata alternative build dependency
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore certified binaries 001-020 from full run
        uses: actions/download-artifact@v8
        with:
          name: aurora-ksq-1-debs-001-020
          path: build/ksq-1/full/debs
          repository: SupraLINUX/SupraLINUX
          run-id: '33250886255'
          github-token: ${{ github.token }}

      - name: Record restored binary evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ksq-1/node-040-validation/evidence
          count="$(find build/ksq-1/full/debs -maxdepth 1 -type f -name '*.deb' | wc -l)"
          (( count > 0 ))
          (
            cd build/ksq-1/full/debs
            find . -maxdepth 1 -type f -name '*.deb' -printf '%f\0' | sort -z | xargs -0 sha256sum
          ) > build/ksq-1/node-040-validation/evidence/restored-debs.sha256
          {
            echo "AURORA_KSQ_1_NODE40_INPUT_RUN=33250886255"
            echo "AURORA_KSQ_1_NODE40_INPUT_ARTIFACT_ID=9715288962"
            echo "AURORA_KSQ_1_NODE40_RESTORED_DEBS=${count}"
          } > build/ksq-1/node-040-validation/evidence/input.env

      - name: Prepare pinned KSQ-1 runner
        shell: bash
        run: bash scripts/ci/prepare-ksq-1-runner.sh

      - name: Build node 040 with alternative resolution
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          VALIDATION="${ROOT}/build/ksq-1/node-040-validation"
          WORK="${VALIDATION}/work"
          RESULT="${VALIDATION}/result"
          EVIDENCE="${VALIDATION}/evidence"
          mkdir -p "${WORK}" "${RESULT}" "${EVIDENCE}"

          row="$(awk -F '\t' '$1 == 40 {print $0}' build/ksq-0/build-order.tsv)"
          [[ -n "${row}" ]] || { echo 'node 40 missing from closure' >&2; exit 1; }
          IFS=$'\t' read -r order source base_version family decision <<< "${row}"
          [[ "${order}" == 40 && "${source}" == kf6-kfilemetadata ]] || {
            echo "unexpected node 40: ${row}" >&2
            exit 1
          }

          bash scripts/ci/fetch-prepare-ksq-1-source.sh "${source}" "${base_version}" "${WORK}"
          # shellcheck disable=SC1091
          . "${WORK}/prepared-source.env"
          cp -a "${WORK}/source/debian/control" "${EVIDENCE}/debian-control"
          cp -a "${WORK}/source/debian/changelog" "${EVIDENCE}/debian-changelog"
          cp -a "${WORK}/prepared-source.env" "${EVIDENCE}/"
          cp -a "${AURORA_KSQ_1_PREPARED_DSC}" "${EVIDENCE}/"
          grep -Fq 'libpostproc-dev | hello' "${EVIDENCE}/debian-control"

          # shellcheck disable=SC1091
          . build/ksq-1/environment/build-environment.env
          TARBALL="${AURORA_KSQ_1_BUILD_ENV_TARBALL:?missing chroot tarball}"

          DEB_BUILD_OPTIONS="parallel=2" sbuild \
            --chroot-mode=unshare \
            --chroot="${TARBALL}" \
            --dist=resolute \
            --arch=amd64 \
            --build-dir="${RESULT}" \
            --build-path=/build/supralinux-ksq1 \
            --jobs=2 \
            --no-enable-network \
            --no-run-lintian \
            --no-run-autopkgtest \
            --purge-build=always \
            --purge-deps=always \
            --extra-package="${ROOT}/build/ksq-1/full/debs" \
            --resolve-alternatives \
            --bd-uninstallable-explainer=apt \
            "${AURORA_KSQ_1_PREPARED_DSC}"

          while IFS= read -r -d '' generated; do
            directory="$(dirname "${generated}")"
            basename="$(basename "${generated}")"
            safe_basename="${basename//:/-}"
            if [[ "${safe_basename}" != "${basename}" ]]; then
              [[ ! -e "${directory}/${safe_basename}" ]]
              mv "${generated}" "${directory}/${safe_basename}"
            fi
          done < <(find "${RESULT}" -maxdepth 1 -type f -name '*:*' -print0)

          mapfile -t debs < <(find "${RESULT}" -maxdepth 1 -type f -name '*.deb' -print | sort)
          mapfile -t buildlogs < <(find "${RESULT}" -maxdepth 1 -type f -name '*.build' -print | sort)
          (( ${#debs[@]} > 0 )) || { echo 'node 40 produced no DEBs' >&2; exit 1; }
          (( ${#buildlogs[@]} > 0 )) || { echo 'node 40 produced no build log' >&2; exit 1; }

          for deb in "${debs[@]}"; do
            [[ "$(dpkg-deb -f "${deb}" Version)" == "${AURORA_KSQ_1_VERSION}" ]]
          done

          cat "${buildlogs[@]}" | grep -nE 'libpostproc-dev|hello' > "${EVIDENCE}/alternative-resolution.log"
          grep -Fq 'hello' "${EVIDENCE}/alternative-resolution.log"

          cp -a "${buildlogs[@]}" "${EVIDENCE}/"
          find "${RESULT}" -maxdepth 1 -type f \( -name '*.buildinfo' -o -name '*.changes' \) -exec cp -a {} "${EVIDENCE}/" \;
          (
            cd "${RESULT}"
            find . -maxdepth 1 -type f \( -name '*.deb' -o -name '*.ddeb' -o -name '*.build' -o -name '*.buildinfo' -o -name '*.changes' \) -printf '%f\0' | sort -z | xargs -0 sha256sum
          ) > "${EVIDENCE}/build-artifacts.sha256"

          {
            echo "AURORA_KSQ_1_NODE40_STATUS=PASS"
            echo "AURORA_KSQ_1_NODE40_ORDER=${order}"
            echo "AURORA_KSQ_1_NODE40_SOURCE=${source}"
            echo "AURORA_KSQ_1_NODE40_VERSION=${AURORA_KSQ_1_VERSION}"
            echo "AURORA_KSQ_1_NODE40_RESOLVE_ALTERNATIVES=yes"
            echo "AURORA_KSQ_1_NODE40_ALTERNATIVE=hello"
            echo "AURORA_KSQ_1_NODE40_DEBS=${#debs[@]}"
            echo "AURORA_KSQ_1_NODE40_FULL_KSQ1_CERTIFIED=no"
          } > "${EVIDENCE}/validation-status.env"
          cat "${EVIDENCE}/validation-status.env"

      - name: Preserve node 040 validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-1-node-040-alternative-validation
          path: build/ksq-1/node-040-validation/evidence/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

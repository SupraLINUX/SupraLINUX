name: SupraLINUX host authoritative control

on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  host-authoritative-control:
    name: Control authoritative KVM gate from persistent host
    runs-on: [self-hosted, linux, x64, supralinux-host-orchestrator]
    timeout-minutes: 360
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Refresh authoritative host broker
        shell: bash
        run: |
          set -euo pipefail
          sudo -n install -o root -g root -m 0755 \
            scripts/supralinux-authoritative-host-broker.py \
            /usr/local/libexec/supralinux-authoritative-host-broker
          sudo -n install -o root -g root -m 0755 \
            scripts/restore-kvm-host-network-safety.py \
            /usr/local/libexec/supralinux-restore-kvm-host-network-safety
          sudo -n install -o root -g root -m 0755 \
            scripts/check-kvm-network.py \
            /usr/local/libexec/supralinux-check-kvm-network.py
          sudo -n install -o root -g root -m 0755 \
            scripts/host-close-package-evidence.py \
            /usr/local/libexec/supralinux-host-close-package-evidence
          sudo -n install -o root -g root -m 0755 \
            scripts/prepare-libguestfs-runtime.sh \
            /usr/local/libexec/supralinux-prepare-libguestfs-runtime
          sudo -n install -o root -g root -m 0755 \
            scripts/with-libguestfs-runtime.sh \
            /usr/local/libexec/supralinux-with-libguestfs-runtime

      - name: Validate authoritative control request
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CONTROL_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          request = json.loads(Path("ops/host-authoritative/request.json").read_text())
          base_keys = {
              "schema", "mode", "gate", "runner_group_id",
              "cancel_run_id", "cancel_run_head_sha",
          }
          evidence_keys = {
              "evidence_node", "evidence_package_run_id", "evidence_package_job_id",
              "evidence_package_artifact_id", "evidence_package_artifact_sha256",
              "evidence_host_manifest_sha256", "evidence_incident_cause",
              "evidence_incident_repair",
          }
          assert not (set(request) - base_keys - evidence_keys)
          assert request.get("schema") == 1
          assert request.get("mode") in {
              "diagnose", "repair-host", "repair-libguestfs-runtime", "preflight", "rebuild-golden", "execute",
              "execute-and-publish-pass",
              "close-evidence-check", "close-evidence",
              "publish-evidence-check", "publish-evidence",
              "certify-proposed-content",
          }
          assert request.get("gate") in {"plasma-package-build", "runner-contract", "supralinux-proposed"}
          if request["gate"] == "runner-contract":
              assert request["mode"] in {"preflight", "execute"}
          if request["gate"] == "supralinux-proposed":
              assert request["mode"] == "certify-proposed-content"
          if request["mode"] == "certify-proposed-content":
              assert request["gate"] == "supralinux-proposed"
          assert isinstance(request.get("runner_group_id"), int) and request["runner_group_id"] > 0
          cancel = request.get("cancel_run_id")
          cancel_head = request.get("cancel_run_head_sha")
          assert cancel is None or (isinstance(cancel, int) and cancel > 0)
          if cancel is None:
              assert cancel_head is None
          else:
              assert isinstance(cancel_head, str) and re.fullmatch(r"[0-9a-f]{40}", cancel_head)
          if request["mode"] in {"diagnose", "repair-host", "repair-libguestfs-runtime", "rebuild-golden", "execute", "execute-and-publish-pass", "close-evidence-check", "close-evidence", "publish-evidence-check", "publish-evidence", "certify-proposed-content"}:
              assert cancel is None and cancel_head is None
          if request["mode"] in {"close-evidence-check", "close-evidence", "publish-evidence-check", "publish-evidence"}:
              assert isinstance(request.get("evidence_node"), str)
              assert re.fullmatch(r"[a-z0-9][a-z0-9+.-]{0,63}", request["evidence_node"])
              for key in ["evidence_package_run_id", "evidence_package_job_id", "evidence_package_artifact_id"]:
                  assert isinstance(request.get(key), int) and request[key] > 0
              for key in ["evidence_package_artifact_sha256", "evidence_host_manifest_sha256"]:
                  assert isinstance(request.get(key), str) and re.fullmatch(r"[0-9a-f]{64}", request[key])
              incident = (request.get("evidence_incident_cause"), request.get("evidence_incident_repair"))
              assert (incident[0] is None) == (incident[1] is None)
              for value in incident:
                  assert value is None or (
                      isinstance(value, str) and value.strip() == value
                      and 0 < len(value) <= 4000 and "\x00" not in value
                  )
          else:
              assert all(request.get(key) is None for key in evidence_keys)
          assert re.fullmatch(r"[0-9a-f]{40}", os.environ["PR_HEAD_SHA"])
          assert re.fullmatch(r"[0-9]+", os.environ["CONTROL_RUN_ID"])
          print("Authoritative host control request: PASS")
          PY

      - name: Execute fixed authoritative host control
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CONTROL_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          jq \
            --arg source_commit "$PR_HEAD_SHA" \
            --arg control_run_id "$CONTROL_RUN_ID" \
            '. + {source_commit:$source_commit, control_run_id:$control_run_id}' \
            ops/host-authoritative/request.json \
            | sudo -n /usr/local/libexec/supralinux-authoritative-host-broker

      - name: Upload authoritative control result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-authoritative-control-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: /var/lib/supralinux/host-authoritative-control-results/${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

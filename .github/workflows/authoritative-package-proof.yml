name: Phase 1 authoritative KVM package proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authoritative-package-proof:
    name: sbuild + autopkgtest/QEMU on KVM guest
    runs-on: [self-hosted, linux, x64, supralinux, ubuntu-26.04, kvm, ephemeral]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run authoritative package proof
        run: scripts/run-authoritative-package-proof.sh

      - name: Upload authoritative evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase1-authoritative-package-proof-${{ github.sha }}
          path: evidence/authoritative-package-proof/
          if-no-files-found: error
          retention-days: 90

          test "$AURORA_KSQ_1_WITNESS_RANGE_COMMAND_RC" = 0
          test "$AURORA_KSQ_1_WITNESS_RANGE_TEE_RC" = 0
          status=build/ksq-1/full/chunk-081-090/evidence/range-status.env
          grep -qx 'AURORA_KSQ_1_RANGE_STATUS=PASS' "$status"
          grep -qx 'AURORA_KSQ_1_RANGE_FIRST_ORDER=81' "$status"
          grep -qx 'AURORA_KSQ_1_RANGE_LAST_ORDER=90' "$status"
          grep -qx 'AURORA_KSQ_1_RANGE_SOURCES=10' "$status"
          grep -qx 'AURORA_KSQ_1_RANGE_FULL_CERTIFIED=no' "$status"

  witness-091-101:
    name: Witness real build contexts 091-101
    needs: witness-081-090
    runs-on: ubuntu-26.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7

      - name: Install stock Resolute witness toolchain
        shell: bash
        run: |

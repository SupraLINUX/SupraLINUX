name: Aurora KSQ snapshot build-context witness 066-101

on:
  push:
    branches:
      - feature/kde-stack-qualification
    paths:
      - '.github/workflows/ksq-snapshot-build-context-witness-066-101.yml'
      - 'scripts/ci/prepare-ksq-1-snapshot-witness-environment.sh'
      - 'scripts/ci/restore-ksq-1-accepted-through-065.sh'
      - 'scripts/ci/stage-ksq-1-witness-prior-range.sh'
      - 'scripts/ci/analyze-ksq-1-build-context-witness.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  accepted-065-state:
    name: Reconstruct exact accepted checkpoint through order 65
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Qualify checkpoint transport host
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^VERSION_ID="26\.04(\.1)?"$' /etc/os-release
          test "$(dpkg --print-architecture)" = amd64
          python3 --version
          dpkg-deb --version | head -n1

      - name: Download exact 001-020 checkpoint
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '9818465016'
          path: ${{ runner.temp }}/prior-001-020
          github-token: ${{ github.token }}
          repository: SupraLINUX/SupraLINUX
          run-id: '33546093974'
          digest-mismatch: error

      - name: Download exact 021-040 checkpoint
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '9824689982'
          path: ${{ runner.temp }}/prior-021-040
          github-token: ${{ github.token }}
          repository: SupraLINUX/SupraLINUX
          run-id: '33561782526'
          digest-mismatch: error

      - name: Download exact 041-043 r2 checkpoint
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '9892762100'
          path: ${{ runner.temp }}/prior-041-043-r2
          github-token: ${{ github.token }}
          repository: SupraLINUX/SupraLINUX
          run-id: '33753437984'
          digest-mismatch: error

      - name: Download exact 044-060 r2 checkpoint
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '9900367299'
          path: ${{ runner.temp }}/prior-044-060-r2
          github-token: ${{ github.token }}
          repository: SupraLINUX/SupraLINUX
          run-id: '33767306768'
          digest-mismatch: error

      - name: Download exact 061-065 r2 build checkpoint
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '9913134271'
          path: ${{ runner.temp }}/prior-061-065-r2
          github-token: ${{ github.token }}
          repository: SupraLINUX/SupraLINUX
          run-id: '33805321380'
          digest-mismatch: error

      - name: Download exact independent order65 acceptance
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '9918320108'
          path: ${{ runner.temp }}/accept-061-065-r2
          github-token: ${{ github.token }}
          repository: SupraLINUX/SupraLINUX
          run-id: '33821228782'
          digest-mismatch: error

      - name: Restore and prove exact accepted state
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/restore-ksq-1-accepted-through-065.sh \
            "$RUNNER_TEMP/accept-061-065-r2" \
            "$RUNNER_TEMP/prior-001-020" \
            "$RUNNER_TEMP/prior-021-040" \
            "$RUNNER_TEMP/prior-041-043-r2" \
            "$RUNNER_TEMP/prior-044-060-r2" \
            "$RUNNER_TEMP/prior-061-065-r2" \
            build/ksq-1/snapshot-witness/accepted-065
          grep -qx 'AURORA_KSQ_1_ACCEPTED_065_RESTORE_STATUS=PASS' build/ksq-1/snapshot-witness/accepted-065/status.env
          test "$(find build/ksq-1/full/debs -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 295

      - name: Preserve accepted DEB transport state
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-witness-accepted-065-debs
          path: build/ksq-1/full/debs/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Preserve accepted-state verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-witness-accepted-065-evidence
          path: build/ksq-1/snapshot-witness/accepted-065/
          if-no-files-found: error
          retention-days: 30

  witness-066-080:
    name: Witness real build contexts 066-080
    needs: accepted-065-state
    runs-on: ubuntu-26.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7

      - name: Install stock Resolute witness toolchain
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^VERSION_ID="26\.04(\.1)?"$' /etc/os-release
          test "$(dpkg --print-architecture)" = amd64
          sudo apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            ca-certificates curl python3 ubuntu-keyring gpgv \
            sbuild mmdebstrap uidmap zstd devscripts dpkg-dev apt-utils \
            gzip xz-utils diffutils build-essential apparmor apparmor-utils libcap2-bin

      - name: Restore verified accepted-065 transport state
        uses: actions/download-artifact@v8
        with:
          name: aurora-ksq-witness-accepted-065-debs
          path: build/ksq-1/full/debs

      - name: Restore accepted-065 verification evidence
        uses: actions/download-artifact@v8
        with:
          name: aurora-ksq-witness-accepted-065-evidence
          path: ${{ runner.temp }}/accepted-065-evidence

      - name: Verify accepted-065 transport state
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/accepted-065-evidence"
          grep -qx 'AURORA_KSQ_1_ACCEPTED_065_RESTORE_STATUS=PASS' "$evidence/status.env"
          grep -qx 'AURORA_KSQ_1_ACCEPTED_065_DEBS=295' "$evidence/status.env"
          test "$(find build/ksq-1/full/debs -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 295
          (cd build/ksq-1/full/debs && sha256sum -c "$evidence/accepted-065-debs.sha256")

      - name: Prepare exact timestamped snapshot witness environment
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/prepare-ksq-1-snapshot-witness-environment.sh \
            build/ksq-1/snapshot-witness/environment-066-080
          grep -qx 'AURORA_KSQ_1_SNAPSHOT_WITNESS_ENV_STATUS=PASS' \
            build/ksq-1/snapshot-witness/environment-066-080/status.env

      - name: Build witness range 066-080
        shell: bash
        run: |
          set -euo pipefail
          out=build/ksq-1/snapshot-witness/range-066-080
          mkdir -p "$out"
          set +e
          bash scripts/ci/build-ksq-1-range.sh 66 80 2>&1 | tee "$out/range.log"
          rc=("${PIPESTATUS[@]}")
          set -e
          printf 'AURORA_KSQ_1_WITNESS_RANGE_COMMAND_RC=%s\nAURORA_KSQ_1_WITNESS_RANGE_TEE_RC=%s\n' \
            "${rc[0]}" "${rc[1]}" > "$out/command.env"
          exit 0

      - name: Preserve witness 066-080 DEBs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-witness-debs-066-080
          path: build/ksq-1/full/chunk-066-080/new-debs/*.deb
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve witness 066-080 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-witness-evidence-066-080
          path: build/ksq-1/full/chunk-066-080/evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve witness 066-080 environment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-witness-environment-066-080
          path: build/ksq-1/snapshot-witness/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce witness 066-080 PASS
        shell: bash
        run: |
          set -euo pipefail
          . build/ksq-1/snapshot-witness/range-066-080/command.env
          test "$AURORA_KSQ_1_WITNESS_RANGE_COMMAND_RC" = 0
          test "$AURORA_KSQ_1_WITNESS_RANGE_TEE_RC" = 0
          status=build/ksq-1/full/chunk-066-080/evidence/range-status.env
          grep -qx 'AURORA_KSQ_1_RANGE_STATUS=PASS' "$status"
          grep -qx 'AURORA_KSQ_1_RANGE_FIRST_ORDER=66' "$status"
          grep -qx 'AURORA_KSQ_1_RANGE_LAST_ORDER=80' "$status"
          grep -qx 'AURORA_KSQ_1_RANGE_SOURCES=15' "$status"
          grep -qx 'AURORA_KSQ_1_RANGE_FULL_CERTIFIED=no' "$status"


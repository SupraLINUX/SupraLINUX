  analyze-witness:
    name: Prove signed build-context set difference against r2
    needs: [witness-066-080, witness-081-090, witness-091-101]
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install analysis tools
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^VERSION_ID="26\.04(\.1)?"$' /etc/os-release
          test "$(dpkg --print-architecture)" = amd64
          sudo apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            ca-certificates curl unzip python3 ubuntu-keyring apt
          apt-get --version | head -n1 | grep -qx 'apt 3.2.0 (amd64)'

      - name: Restore witness evidence 066-080
        uses: actions/download-artifact@v8
        with:
          name: aurora-ksq-witness-evidence-066-080
          path: ${{ runner.temp }}/evidence-066-080

      - name: Restore witness evidence 081-090
        uses: actions/download-artifact@v8
        with:
          name: aurora-ksq-witness-evidence-081-090
          path: ${{ runner.temp }}/evidence-081-090

      - name: Restore witness evidence 091-101
        uses: actions/download-artifact@v8
        with:
          name: aurora-ksq-witness-evidence-091-101
          path: ${{ runner.temp }}/evidence-091-101

      - name: Retrieve exact r2 closure-generation object list
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/r2-size.zip"
          out="$RUNNER_TEMP/r2-size"
          mkdir -p "$out"
          curl --fail --location --retry 5 --retry-all-errors \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/SupraLINUX/SupraLINUX/actions/artifacts/9883249125/zip' \
            -o "$zip"
          test "$(sha256sum "$zip" | awk '{print $1}')" = 2281ab4655dc8d33639d9a3bbfb75d60325829a6b0af19902c20e4406e0c945b
          test "$(stat -c '%s' "$zip")" = 136259
          unzip -q "$zip" -d "$out"
          test -s "$out/binary-objects.tsv"
          test "$(wc -l < "$out/binary-objects.tsv")" -eq 1783

      - name: Recreate APT-verified signed snapshot Packages corpus
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/prepare-kde-stack-apt-metadata.sh \
            2>&1 | tee build/ksq-0/witness-analysis-apt-metadata.log
          grep -Fq 'AURORA_KSQ_0_APT_METADATA_SUCCESS' build/ksq-0/witness-analysis-apt-metadata.log
          aptroot=build/ksq-0/apt
          mapfile -t indexes < <(
            apt-get \
              -o "Dir::Etc::sourcelist=$aptroot/resolute.sources" \
              -o Dir::Etc::sourceparts=- \
              -o "Dir::State::lists=$aptroot/resolute-lists" \
              -o "Dir::State::status=$aptroot/empty-status" \
              -o "Dir::Cache=$aptroot/resolute-cache" \
              -o APT::Architecture=amd64 \
              -o APT::Architectures=amd64 \
              -o Acquire::Languages=none \
              indextargets --format '$Identifier\t$Architecture\t$Filename' \
              | awk -F '\t' '$1=="Packages" && $2=="amd64" {print $3}' \
              | sort -u
          )
          test "${#indexes[@]}" -gt 0
          corpus=build/ksq-0/snapshot-packages-amd64.txt
          : > "$corpus"
          for index in "${indexes[@]}"; do
            test -s "$index"
            /usr/lib/apt/apt-helper cat-file "$index" >> "$corpus"
            printf '\n' >> "$corpus"
          done
          test -s "$corpus"
          sha256sum "$corpus" > "$corpus.sha256"
          printf 'AURORA_KSQ_1_WITNESS_SIGNED_PACKAGE_INDEXES=%s\n' "${#indexes[@]}" \
            > build/ksq-0/witness-signed-packages.env

      - name: Analyze complete real-build witness union
        shell: bash
        run: |
          set -euo pipefail
          out=build/ksq-1/snapshot-witness/analysis
          python3 scripts/ci/analyze-ksq-1-build-context-witness.py \
            --snapshot-packages build/ksq-0/snapshot-packages-amd64.txt \
            --r2-objects "$RUNNER_TEMP/r2-size/binary-objects.tsv" \

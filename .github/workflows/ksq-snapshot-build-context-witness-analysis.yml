name: Aurora KSQ snapshot build-context witness independent analysis

on:
  workflow_run:
    workflows:
      - Aurora KSQ snapshot build-context witness 066-101
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  analyze-triggering-witness:
    name: Independently analyze preserved 066-101 witness artifacts
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Record triggering witness identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ksq-1/snapshot-witness-independent-analysis
          {
            echo "AURORA_KSQ_1_WITNESS_TRIGGER_RUN_ID=${{ github.event.workflow_run.id }}"
            echo "AURORA_KSQ_1_WITNESS_TRIGGER_HEAD_SHA=${{ github.event.workflow_run.head_sha }}"
            echo "AURORA_KSQ_1_WITNESS_TRIGGER_CONCLUSION=${{ github.event.workflow_run.conclusion }}"
            echo "AURORA_KSQ_1_WITNESS_TRIGGER_EVENT=${{ github.event.workflow_run.event }}"
          } > build/ksq-1/snapshot-witness-independent-analysis/trigger.env
          test '${{ github.event.workflow_run.name }}' = 'Aurora KSQ snapshot build-context witness 066-101'

      - uses: actions/checkout@v7
        with:
          ref: feature/kde-stack-qualification

      - name: Install analysis tools
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^VERSION_ID="26\.04(\.1)?"$' /etc/os-release
          test "$(dpkg --print-architecture)" = amd64
          sudo apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            ca-certificates curl unzip python3 ubuntu-keyring apt
          apt-get --version | head -n1 | grep -qx 'apt 3.2.0 (amd64)'

      - name: Download exact witness evidence 066-080 from triggering run
        uses: actions/download-artifact@v8
        with:
          name: aurora-ksq-witness-evidence-066-080
          path: ${{ runner.temp }}/evidence-066-080
          github-token: ${{ github.token }}
          repository: SupraLINUX/SupraLINUX
          run-id: ${{ github.event.workflow_run.id }}
          digest-mismatch: error

      - name: Download exact witness evidence 081-090 from triggering run
        uses: actions/download-artifact@v8
        with:
          name: aurora-ksq-witness-evidence-081-090
          path: ${{ runner.temp }}/evidence-081-090
          github-token: ${{ github.token }}
          repository: SupraLINUX/SupraLINUX
          run-id: ${{ github.event.workflow_run.id }}
          digest-mismatch: error

      - name: Download exact witness evidence 091-101 from triggering run
        uses: actions/download-artifact@v8
        with:
          name: aurora-ksq-witness-evidence-091-101
          path: ${{ runner.temp }}/evidence-091-101
          github-token: ${{ github.token }}
          repository: SupraLINUX/SupraLINUX
          run-id: ${{ github.event.workflow_run.id }}
          digest-mismatch: error

      - name: Retrieve exact historical r2 object list
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/r2-size.zip"
          out="$RUNNER_TEMP/r2-size"
          mkdir -p "$out"
          curl --fail --location --retry 5 --retry-all-errors \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/SupraLINUX/SupraLINUX/actions/artifacts/9883249125/zip' \
            -o "$zip"
          test "$(sha256sum "$zip" | awk '{print $1}')" = 2281ab4655dc8d33639d9a3bbfb75d60325829a6b0af19902c20e4406e0c945b
          test "$(stat -c '%s' "$zip")" = 136259
          unzip -q "$zip" -d "$out"
          test -s "$out/binary-objects.tsv"
          test "$(wc -l < "$out/binary-objects.tsv")" -eq 1783
          sha256sum "$out/binary-objects.tsv" \
            > build/ksq-1/snapshot-witness-independent-analysis/r2-binary-objects.sha256

      - name: Recreate APT-verified signed snapshot metadata
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/prepare-kde-stack-apt-metadata.sh \
            2>&1 | tee build/ksq-1/snapshot-witness-independent-analysis/apt-metadata.log
          grep -Fq 'AURORA_KSQ_0_APT_METADATA_SUCCESS' \
            build/ksq-1/snapshot-witness-independent-analysis/apt-metadata.log

          aptroot=build/ksq-0/apt
          targets=build/ksq-1/snapshot-witness-independent-analysis/indextargets.txt
          apt-get \
            -o "Dir::Etc::sourcelist=$aptroot/resolute.sources" \
            -o Dir::Etc::sourceparts=- \
            -o "Dir::State::lists=$aptroot/resolute-lists" \
            -o "Dir::State::status=$aptroot/empty-status" \
            -o "Dir::Cache=$aptroot/resolute-cache" \
            -o APT::Architecture=amd64 \
            -o APT::Architectures=amd64 \
            -o Acquire::Languages=none \
            indextargets > "$targets"

          python3 - "$targets" build/ksq-1/snapshot-witness-independent-analysis/package-indexes.txt <<'PY'
          import sys
          from pathlib import Path
          source, output = map(Path, sys.argv[1:])
          rows=[]
          stanza={}
          def flush():
              global stanza
              if stanza.get('Identifier') == 'Packages' and stanza.get('Architecture') == 'amd64':
                  filename=stanza.get('Filename')
                  if not filename:
                      raise SystemExit('Packages indextarget missing Filename')
                  rows.append(filename)
              stanza={}
          for raw in source.read_text().splitlines()+['']:
              if not raw:
                  flush()
                  continue
              if ': ' in raw:
                  k,v=raw.split(': ',1)
                  stanza[k]=v
          unique=sorted(set(rows))
          if not unique:
              raise SystemExit('no amd64 Packages indextargets found')
          output.write_text(''.join(x+'\n' for x in unique))
          print(f'AURORA_KSQ_1_WITNESS_SIGNED_PACKAGE_INDEXES={len(unique)}')
          PY

          corpus=build/ksq-1/snapshot-witness-independent-analysis/snapshot-packages-amd64.txt
          : > "$corpus"
          while IFS= read -r index; do
            test -s "$index"
            /usr/lib/apt/apt-helper cat-file "$index" >> "$corpus"
            printf '\n' >> "$corpus"
          done < build/ksq-1/snapshot-witness-independent-analysis/package-indexes.txt
          test -s "$corpus"
          sha256sum "$corpus" > "$corpus.sha256"
          cp build/ksq-0/apt-metadata.sha256 \
            build/ksq-1/snapshot-witness-independent-analysis/apt-metadata.sha256

      - name: Prove complete signed 066-101 build-context difference
        shell: bash
        run: |
          set -euo pipefail
          base=build/ksq-1/snapshot-witness-independent-analysis
          out="$base/result"
          python3 scripts/ci/analyze-ksq-1-build-context-witness.py \
            --snapshot-packages "$base/snapshot-packages-amd64.txt" \
            --r2-objects "$RUNNER_TEMP/r2-size/binary-objects.tsv" \
            --evidence-066-080 "$RUNNER_TEMP/evidence-066-080" \
            --evidence-081-090 "$RUNNER_TEMP/evidence-081-090" \
            --evidence-091-101 "$RUNNER_TEMP/evidence-091-101" \
            --out "$out"

          grep -qx 'AURORA_KSQ_1_BUILD_CONTEXT_WITNESS_STATUS=PROVEN' "$out/status.env"
          grep -qx 'AURORA_KSQ_1_BUILD_CONTEXT_WITNESS_SNAPSHOT=20260829T022000Z' "$out/status.env"
          grep -qx 'AURORA_KSQ_1_BUILD_CONTEXT_WITNESS_FIRST_ORDER=66' "$out/status.env"
          grep -qx 'AURORA_KSQ_1_BUILD_CONTEXT_WITNESS_LAST_ORDER=101' "$out/status.env"
          grep -qx 'AURORA_KSQ_1_BUILD_CONTEXT_WITNESS_SOURCES=36' "$out/status.env"
          grep -qx 'AURORA_KSQ_1_BUILD_CONTEXT_WITNESS_LOGS=36' "$out/status.env"
          grep -qx 'AURORA_KSQ_1_BUILD_CONTEXT_WITNESS_R2_OBJECTS=1783' "$out/status.env"
          grep -qx 'AURORA_KSQ_1_BUILD_CONTEXT_WITNESS_MANUAL_PACKAGE_ADDITIONS=0' "$out/status.env"
          test -s "$out/observed-packages.tsv"
          test -s "$out/observed-objects.tsv"
          test -s "$out/gap-objects.tsv"

          # Historical observations are diagnostics only: record whether the current
          # complete witness independently rediscovers them, but never manufacture
          # the gap from this list.
          python3 - "$out/gap-objects.tsv" "$base/historical-oracle-comparison.tsv" <<'PY'
          import csv, sys
          from pathlib import Path
          gap, output = map(Path, sys.argv[1:])
          with gap.open(newline='') as f:
              rows=list(csv.DictReader(f, delimiter='\t'))
          paths={r['filename'] for r in rows}
          oracle=[
              'pool/main/libj/libjpeg8-empty/libjpeg8-dev_8c-2ubuntu12_amd64.deb',
              'pool/main/libj/libjpeg8-empty/libjpeg-dev_8c-2ubuntu12_amd64.deb',
              'pool/main/c/curl/libcurl4-openssl-dev_8.18.0-1ubuntu2.4_amd64.deb',
          ]
          output.write_text('filename\tpresent_in_current_gap\n'+''.join(f'{p}\t{"yes" if p in paths else "no"}\n' for p in oracle))
          PY

          sha256sum "$out"/*.tsv "$out/status.env" \
            "$base/snapshot-packages-amd64.txt" \
            "$base/indextargets.txt" \
            "$base/historical-oracle-comparison.tsv" \
            "$RUNNER_TEMP/r2-size/binary-objects.tsv" \
            > "$base/evidence.sha256"

          {
            cat "$base/trigger.env"
            echo 'AURORA_KSQ_1_WITNESS_INDEPENDENT_ANALYSIS=PASS'
            echo "AURORA_KSQ_1_WITNESS_ANALYZER_COMMIT=$(git rev-parse HEAD)"
            cat "$out/status.env"
          } > "$base/acceptance.env"

      - name: Preserve independent witness analysis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-build-context-witness-066-101-independent-analysis
          path: build/ksq-1/snapshot-witness-independent-analysis/
          if-no-files-found: error
          retention-days: 30

name: Aurora KSQ snapshot slice r3 explicit publication

on:
  push:
    branches:
      - feature/kde-stack-qualification
    paths:
      - '.github/ksq-snapshot-r3-materialize-trigger.env'

permissions:
  contents: write
  actions: read

concurrency:
  group: aurora-ksq-snapshot-20260829T022000Z-r3-explicit-publication
  cancel-in-progress: false

env:
  UPSTREAM_SNAPSHOT: '20260829T022000Z'
  BASE_SLICE_ID: '20260829T022000Z-r2'
  SLICE_ID: '20260829T022000Z-r3'
  ARCHIVE_ROOT: /opt/supralinux/archive
  RELEASE_TAG: ksq-snapshot-20260829T022000Z-r3
  RELEASE_ASSET: aurora-ubuntu-snapshot-20260829T022000Z-r3-amd64.tar
  RELEASE_MANIFEST: aurora-ubuntu-snapshot-20260829T022000Z-r3-amd64.env
  SNAPSHOT_EPOCH: '1787970000'

jobs:
  materialize-and-publish:
    name: Materialize exact analysis-derived r3 candidate
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - name: Validate explicit analysis trigger
        id: trigger
        shell: bash
        run: |
          set -euo pipefail
          trigger=.github/ksq-snapshot-r3-materialize-trigger.env
          test -f "$trigger"
          source "$trigger"
          [[ "$AURORA_KSQ_R3_ANALYSIS_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$AURORA_KSQ_R3_ANALYSIS_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AURORA_KSQ_R3_ANALYSIS_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$AURORA_KSQ_R3_ANALYSIS_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$AURORA_KSQ_R3_ANALYSIS_ARTIFACT_SIZE" =~ ^[1-9][0-9]*$ ]]
          test "$AURORA_KSQ_R3_ANALYSIS_FIRST_ORDER" = 66
          test "$AURORA_KSQ_R3_ANALYSIS_LAST_ORDER" = 101
          {
            echo "run_id=$AURORA_KSQ_R3_ANALYSIS_RUN_ID"
            echo "head_sha=$AURORA_KSQ_R3_ANALYSIS_HEAD_SHA"
            echo "artifact_id=$AURORA_KSQ_R3_ANALYSIS_ARTIFACT_ID"
            echo "artifact_digest=$AURORA_KSQ_R3_ANALYSIS_ARTIFACT_DIGEST"
            echo "artifact_size=$AURORA_KSQ_R3_ANALYSIS_ARTIFACT_SIZE"
          } >> "$GITHUB_OUTPUT"

      - name: Install stock Resolute materialization tools
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^VERSION_ID="26\.04(\.1)?"$' /etc/os-release
          test "$(dpkg --print-architecture)" = amd64
          sudo apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            ca-certificates curl unzip python3 xz-utils ubuntu-keyring gpgv
          python3 -m py_compile scripts/ci/ksq-snapshot-slice.py scripts/ci/ksq-snapshot-slice-r2.py scripts/ci/ksq-snapshot-slice-r3.py
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0755 "$ARCHIVE_ROOT"

      - name: Revalidate exact analysis artifact identity through GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ANALYSIS_RUN_ID: ${{ steps.trigger.outputs.run_id }}
          ANALYSIS_HEAD_SHA: ${{ steps.trigger.outputs.head_sha }}
          ANALYSIS_ARTIFACT_ID: ${{ steps.trigger.outputs.artifact_id }}
          ANALYSIS_ARTIFACT_DIGEST: ${{ steps.trigger.outputs.artifact_digest }}
          ANALYSIS_ARTIFACT_SIZE: ${{ steps.trigger.outputs.artifact_size }}
        run: |
          set -euo pipefail
          artifact_json="$RUNNER_TEMP/analysis-artifact.json"
          gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ANALYSIS_ARTIFACT_ID" > "$artifact_json"
          test "$(jq -r '.id' "$artifact_json")" = "$ANALYSIS_ARTIFACT_ID"
          test "$(jq -r '.name' "$artifact_json")" = aurora-ksq-build-context-witness-066-101-independent-analysis
          test "$(jq -r '.expired' "$artifact_json")" = false
          test "$(jq -r '.digest' "$artifact_json")" = "$ANALYSIS_ARTIFACT_DIGEST"
          test "$(jq -r '.size_in_bytes' "$artifact_json")" = "$ANALYSIS_ARTIFACT_SIZE"
          run_json="$RUNNER_TEMP/analysis-run.json"
          gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$ANALYSIS_RUN_ID" > "$run_json"
          test "$(jq -r '.status' "$run_json")" = completed
          test "$(jq -r '.conclusion' "$run_json")" = success
          test "$(jq -r '.head_sha' "$run_json")" = "$ANALYSIS_HEAD_SHA"
          test "$(jq -r '.name' "$run_json")" = 'Aurora KSQ snapshot build-context witness explicit analysis'

      - name: Download exact independent analysis artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.trigger.outputs.artifact_id }}
          path: ${{ runner.temp }}/witness-analysis
          github-token: ${{ github.token }}
          repository: SupraLINUX/SupraLINUX
          run-id: ${{ steps.trigger.outputs.run_id }}
          digest-mismatch: error

      - name: Bind downloaded analysis to immutable artifact identity
        shell: bash
        env:
          ANALYSIS_RUN_ID: ${{ steps.trigger.outputs.run_id }}
          ANALYSIS_HEAD_SHA: ${{ steps.trigger.outputs.head_sha }}
          ANALYSIS_ARTIFACT_ID: ${{ steps.trigger.outputs.artifact_id }}
          ANALYSIS_ARTIFACT_DIGEST: ${{ steps.trigger.outputs.artifact_digest }}
          ANALYSIS_ARTIFACT_SIZE: ${{ steps.trigger.outputs.artifact_size }}
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/witness-analysis"
          grep -qx 'AURORA_KSQ_1_WITNESS_INDEPENDENT_ANALYSIS=PASS' "$base/acceptance.env"
          grep -qx 'AURORA_KSQ_1_BUILD_CONTEXT_WITNESS_STATUS=PROVEN' "$base/result/status.env"
          grep -qx 'AURORA_KSQ_1_BUILD_CONTEXT_WITNESS_SOURCES=36' "$base/result/status.env"
          grep -qx 'AURORA_KSQ_1_BUILD_CONTEXT_WITNESS_LOGS=36' "$base/result/status.env"
          grep -qx 'AURORA_KSQ_1_BUILD_CONTEXT_WITNESS_MANUAL_PACKAGE_ADDITIONS=0' "$base/result/status.env"
          test -s "$base/result/gap-objects.tsv"
          cat > "$base/analysis-artifact.env" <<EOF
          AURORA_KSQ_1_WITNESS_ANALYSIS_RUN_ID=$ANALYSIS_RUN_ID
          AURORA_KSQ_1_WITNESS_ANALYSIS_HEAD_SHA=$ANALYSIS_HEAD_SHA
          AURORA_KSQ_1_WITNESS_ANALYSIS_ARTIFACT_ID=$ANALYSIS_ARTIFACT_ID
          AURORA_KSQ_1_WITNESS_ANALYSIS_ARTIFACT_DIGEST=$ANALYSIS_ARTIFACT_DIGEST
          AURORA_KSQ_1_WITNESS_ANALYSIS_ARTIFACT_SIZE=$ANALYSIS_ARTIFACT_SIZE
          EOF

      - name: Download and validate immutable canonical r2 base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/ci/aurora-ksq-snapshot-release.env
          test "$AURORA_KSQ_SNAPSHOT_RELEASE_STATUS" = INDEPENDENTLY_VALIDATED
          test "$AURORA_KSQ_SNAPSHOT" = "$BASE_SLICE_ID"
          test "$AURORA_KSQ_UBUNTU_SNAPSHOT" = "$UPSTREAM_SNAPSHOT"
          test "$AURORA_KSQ_SNAPSHOT_RELEASE_ID" = 381836501
          test "$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET_ID" = 542414026
          test "$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET_SHA256" = 23413ddf1c1820aaa01dfa81005b37e8c9611bad2d0a632664d0e08282e69c3b
          test "$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET_BYTES" = 1054177280
          test "$AURORA_KSQ_SNAPSHOT_RELEASE_MANIFEST_ASSET_ID" = 542414028
          test "$AURORA_KSQ_SNAPSHOT_RELEASE_MANIFEST_SHA256" = 6ed95b495ded7744f081335684c2918eeae96dbc822fa53b0d9fb5bc2da0f481
          release="$RUNNER_TEMP/r2-release"
          mkdir -p "$release"
          gh release download "$AURORA_KSQ_SNAPSHOT_RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            -p "$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET" -p "$AURORA_KSQ_SNAPSHOT_RELEASE_MANIFEST" -D "$release"
          archive="$release/$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET"
          manifest="$release/$AURORA_KSQ_SNAPSHOT_RELEASE_MANIFEST"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET_SHA256"
          test "$(stat -c '%s' "$archive")" = "$AURORA_KSQ_SNAPSHOT_RELEASE_ASSET_BYTES"
          test "$(sha256sum "$manifest" | awk '{print $1}')" = "$AURORA_KSQ_SNAPSHOT_RELEASE_MANIFEST_SHA256"
          tar -xf "$archive" -C "$ARCHIVE_ROOT"
          python3 scripts/ci/ksq-snapshot-slice-r2.py validate --slice-root "$ARCHIVE_ROOT/$BASE_SLICE_ID"

      - name: Materialize exact witness-derived r3
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/ksq-snapshot-slice-r3.py materialize \
            --archive-root "$ARCHIVE_ROOT" \
            --base-slice-root "$ARCHIVE_ROOT/$BASE_SLICE_ID" \
            --witness-analysis-dir "$RUNNER_TEMP/witness-analysis" \
            --workers 8
          python3 scripts/ci/ksq-snapshot-slice-r3.py validate \
            --slice-root "$ARCHIVE_ROOT/$SLICE_ID" \
            --witness-analysis-dir "$RUNNER_TEMP/witness-analysis"
          test -f "$ARCHIVE_ROOT/$SLICE_ID/COMPLETE"

      - name: Package deterministic r3 candidate
        id: package
        shell: bash
        env:
          ANALYSIS_RUN_ID: ${{ steps.trigger.outputs.run_id }}
          ANALYSIS_HEAD_SHA: ${{ steps.trigger.outputs.head_sha }}
          ANALYSIS_ARTIFACT_ID: ${{ steps.trigger.outputs.artifact_id }}
          ANALYSIS_ARTIFACT_DIGEST: ${{ steps.trigger.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$RELEASE_ASSET"
          manifest="$RUNNER_TEMP/$RELEASE_MANIFEST"
          provenance="$ARCHIVE_ROOT/$SLICE_ID/provenance.env"
          gap_count="$(sed -n 's/^AURORA_KSQ_SNAPSHOT_R3_GAP_OBJECTS=//p' "$provenance")"
          gap_bytes="$(sed -n 's/^AURORA_KSQ_SNAPSHOT_R3_GAP_BYTES=//p' "$provenance")"
          binary_objects="$(sed -n 's/^AURORA_KSQ_SNAPSHOT_SLICE_BINARY_OBJECTS=//p' "$provenance")"
          binary_bytes="$(sed -n 's/^AURORA_KSQ_SNAPSHOT_SLICE_BINARY_BYTES=//p' "$provenance")"
          [[ "$gap_count" =~ ^[1-9][0-9]*$ ]]
          [[ "$gap_bytes" =~ ^[1-9][0-9]*$ ]]
          test "$binary_objects" -eq $((1783 + gap_count))
          test "$binary_bytes" -eq $((785219274 + gap_bytes))
          tar --sort=name --format=gnu --mtime="@$SNAPSHOT_EPOCH" --owner=0 --group=0 --numeric-owner \
            -C "$ARCHIVE_ROOT" -cf "$archive" "$SLICE_ID"
          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          archive_bytes="$(stat -c '%s' "$archive")"
          (( archive_bytes < 2147483648 ))
          cat > "$manifest" <<EOF
          AURORA_KSQ_SNAPSHOT_RELEASE_STATUS=PUBLISHED_CANDIDATE
          AURORA_KSQ_SNAPSHOT_SLICE_ID=$SLICE_ID
          AURORA_KSQ_UBUNTU_SNAPSHOT=$UPSTREAM_SNAPSHOT
          AURORA_KSQ_SNAPSHOT_ARCH=amd64
          AURORA_KSQ_SNAPSHOT_ARCH_VARIANTS=disabled
          AURORA_KSQ_SNAPSHOT_INSTALL_RECOMMENDS=default
          AURORA_KSQ_SNAPSHOT_RELEASE_TAG=$RELEASE_TAG
          AURORA_KSQ_SNAPSHOT_RELEASE_ASSET=$RELEASE_ASSET
          AURORA_KSQ_SNAPSHOT_RELEASE_ASSET_SHA256=$archive_sha256
          AURORA_KSQ_SNAPSHOT_RELEASE_ASSET_BYTES=$archive_bytes
          AURORA_KSQ_SNAPSHOT_RELEASE_ARCHIVE_FORMAT=gnu-tar
          AURORA_KSQ_SNAPSHOT_RELEASE_FIXED_MTIME_EPOCH=$SNAPSHOT_EPOCH
          AURORA_KSQ_SNAPSHOT_MATERIALIZER_COMMIT=$GITHUB_SHA
          AURORA_KSQ_SNAPSHOT_R3_BASE_SLICE_ID=$BASE_SLICE_ID
          AURORA_KSQ_SNAPSHOT_R3_BASE_RELEASE_ASSET_SHA256=23413ddf1c1820aaa01dfa81005b37e8c9611bad2d0a632664d0e08282e69c3b
          AURORA_KSQ_SNAPSHOT_R3_WITNESS_ANALYSIS_RUN_ID=$ANALYSIS_RUN_ID
          AURORA_KSQ_SNAPSHOT_R3_WITNESS_ANALYSIS_HEAD_SHA=$ANALYSIS_HEAD_SHA
          AURORA_KSQ_SNAPSHOT_R3_WITNESS_ANALYSIS_ARTIFACT_ID=$ANALYSIS_ARTIFACT_ID
          AURORA_KSQ_SNAPSHOT_R3_WITNESS_ANALYSIS_ARTIFACT_DIGEST=$ANALYSIS_ARTIFACT_DIGEST
          AURORA_KSQ_SNAPSHOT_R3_GAP_OBJECTS=$gap_count
          AURORA_KSQ_SNAPSHOT_R3_GAP_BYTES=$gap_bytes
          AURORA_KSQ_SNAPSHOT_BINARY_OBJECTS=$binary_objects
          AURORA_KSQ_SNAPSHOT_BINARY_BYTES=$binary_bytes
          AURORA_KSQ_SNAPSHOT_R3_MANUAL_PACKAGE_ADDITIONS=0
          EOF
          manifest_sha256="$(sha256sum "$manifest" | awk '{print $1}')"
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
          echo "archive_bytes=$archive_bytes" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"
          echo "gap_count=$gap_count" >> "$GITHUB_OUTPUT"
          echo "gap_bytes=$gap_bytes" >> "$GITHUB_OUTPUT"

      - name: Refuse overwrite and publish immutable r3 candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "AURORA_KSQ_SNAPSHOT_R3_FAILURE: release already exists; refusing overwrite" >&2
            exit 1
          fi
          notes="$RUNNER_TEMP/r3-notes.md"
          cat > "$notes" <<'EOF'
          Engineering reproducibility candidate for SupraLINUX 1.0.0 Aurora KSQ.

          This r3 candidate preserves Ubuntu snapshot `20260829T022000Z` and immutable r2, then adds only payloads proven missing by the complete 66–101 per-build-context witness. Every added object is revalidated against Ubuntu signed Packages metadata inherited from r2. No package is added manually.

          This is not canonical until independent release validation, strict r2→r3 identity validation and required KSQ regressions pass.
          EOF
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/$RELEASE_ASSET" "$RUNNER_TEMP/$RELEASE_MANIFEST" \
            -R "$GITHUB_REPOSITORY" --title "Aurora KSQ snapshot $SLICE_ID candidate" --notes-file "$notes"

      - name: Seal publication evidence
        shell: bash
        run: |
          set -euo pipefail
          out=build/ksq-1/r3-explicit-publication
          mkdir -p "$out"
          cp "$RUNNER_TEMP/$RELEASE_MANIFEST" "$out/"
          cp "$ARCHIVE_ROOT/$SLICE_ID/provenance.env" "$out/r3-provenance.env"
          cp "$ARCHIVE_ROOT/$SLICE_ID/manifests/r3-gap.tsv" "$out/r3-gap.tsv"
          cp "$ARCHIVE_ROOT/$SLICE_ID/manifests/r3-added-binary.tsv" "$out/r3-added-binary.tsv"
          cp "$RUNNER_TEMP/witness-analysis/analysis-artifact.env" "$out/"
          sha256sum "$RUNNER_TEMP/$RELEASE_ASSET" > "$out/release-archive.sha256"
          sha256sum "$RUNNER_TEMP/$RELEASE_MANIFEST" > "$out/release-manifest.sha256"
          cat > "$out/publication.env" <<EOF
          AURORA_KSQ_SNAPSHOT_R3_PUBLICATION=PASS
          AURORA_KSQ_SNAPSHOT_R3_SLICE_ID=$SLICE_ID
          AURORA_KSQ_SNAPSHOT_R3_RELEASE_TAG=$RELEASE_TAG
          AURORA_KSQ_SNAPSHOT_R3_RELEASE_ASSET=$RELEASE_ASSET
          AURORA_KSQ_SNAPSHOT_R3_RELEASE_ASSET_SHA256=${{ steps.package.outputs.archive_sha256 }}
          AURORA_KSQ_SNAPSHOT_R3_RELEASE_ASSET_BYTES=${{ steps.package.outputs.archive_bytes }}
          AURORA_KSQ_SNAPSHOT_R3_RELEASE_MANIFEST=$RELEASE_MANIFEST
          AURORA_KSQ_SNAPSHOT_R3_RELEASE_MANIFEST_SHA256=${{ steps.package.outputs.manifest_sha256 }}
          AURORA_KSQ_SNAPSHOT_R3_GAP_OBJECTS=${{ steps.package.outputs.gap_count }}
          AURORA_KSQ_SNAPSHOT_R3_GAP_BYTES=${{ steps.package.outputs.gap_bytes }}
          AURORA_KSQ_SNAPSHOT_R3_MANUAL_PACKAGE_ADDITIONS=0
          AURORA_KSQ_SNAPSHOT_R3_CANONICAL=no
          EOF
          (
            cd "$out"
            find . -maxdepth 1 -type f ! -name evidence.sha256 -printf '%P\n' | LC_ALL=C sort | xargs -r sha256sum > evidence.sha256
            sha256sum -c evidence.sha256
          )

      - name: Upload explicit r3 publication evidence
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-snapshot-r3-explicit-publication
          path: build/ksq-1/r3-explicit-publication/
          if-no-files-found: error
          retention-days: 30

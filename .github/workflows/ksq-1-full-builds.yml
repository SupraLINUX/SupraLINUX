name: Aurora KSQ-1 full source builds

on:
  push:
    branches:
      - feature/kde-stack-qualification
    paths:
      - 'tests/kde-stack/**'
      - 'scripts/ci/prepare-kde-stack-apt-metadata.sh'
      - 'scripts/ci/generate-kde-build-closure.py'
      - 'scripts/ci/audit-kde-stack-source-selections.sh'
      - 'scripts/ci/prepare-ksq-1-source.py'
      - 'scripts/ci/fetch-prepare-ksq-1-source.sh'
      - 'scripts/ci/prepare-ksq-1-build-environment.sh'
      - 'scripts/ci/prepare-ksq-1-runner.sh'
      - 'scripts/ci/build-ksq-1-range.sh'
      - 'scripts/ci/validate-ksq-1-kwallet-pam.sh'
      - 'scripts/ci/validate-ksq-1-full.py'
      - 'scripts/ci/validate-kwallet-pam-installation.sh'
      - '.github/workflows/ksq-1-full-builds.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-001-020:
    name: Build certified DAG sources 001-020
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare pinned KSQ-1 runner
        shell: bash
        run: bash scripts/ci/prepare-ksq-1-runner.sh

      - name: Build sources 001-020
        shell: bash
        run: bash scripts/ci/build-ksq-1-range.sh 1 20

      - name: Preserve binary checkpoint 001-020
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-1-debs-001-020
          path: build/ksq-1/full/chunk-001-020/new-debs/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Preserve build evidence 001-020
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-1-evidence-001-020
          path: build/ksq-1/full/chunk-001-020/evidence/
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

  build-021-040:
    name: Build certified DAG sources 021-040
    needs: build-001-020
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore prior binary checkpoints
        uses: actions/download-artifact@v8
        with:
          pattern: aurora-ksq-1-debs-001-020
          path: build/ksq-1/full/debs
          merge-multiple: true

      - name: Verify prior binary state
        shell: bash
        run: |
          set -euo pipefail
          count="$(find build/ksq-1/full/debs -maxdepth 1 -type f -name '*.deb' | wc -l)"
          (( count > 0 ))

      - name: Prepare pinned KSQ-1 runner
        shell: bash
        run: bash scripts/ci/prepare-ksq-1-runner.sh

      - name: Build sources 021-040
        shell: bash
        run: bash scripts/ci/build-ksq-1-range.sh 21 40

      - name: Preserve binary checkpoint 021-040
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-1-debs-021-040
          path: build/ksq-1/full/chunk-021-040/new-debs/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Preserve build evidence 021-040
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-1-evidence-021-040
          path: build/ksq-1/full/chunk-021-040/evidence/
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

  build-041-060:
    name: Build certified DAG sources 041-060
    needs: build-021-040
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore prior binary checkpoints
        uses: actions/download-artifact@v8
        with:
          pattern: aurora-ksq-1-debs-*
          path: build/ksq-1/full/debs
          merge-multiple: true

      - name: Verify prior binary state
        shell: bash
        run: |
          set -euo pipefail
          count="$(find build/ksq-1/full/debs -maxdepth 1 -type f -name '*.deb' | wc -l)"
          (( count > 0 ))

      - name: Prepare pinned KSQ-1 runner
        shell: bash
        run: bash scripts/ci/prepare-ksq-1-runner.sh

      - name: Build sources 041-060
        shell: bash
        run: bash scripts/ci/build-ksq-1-range.sh 41 60

      - name: Preserve binary checkpoint 041-060
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-1-debs-041-060
          path: build/ksq-1/full/chunk-041-060/new-debs/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Preserve build evidence 041-060
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-1-evidence-041-060
          path: build/ksq-1/full/chunk-041-060/evidence/
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

  build-061-080:
    name: Build certified DAG sources 061-080
    needs: build-041-060
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore prior binary checkpoints
        uses: actions/download-artifact@v8
        with:
          pattern: aurora-ksq-1-debs-*
          path: build/ksq-1/full/debs
          merge-multiple: true

      - name: Verify prior binary state
        shell: bash
        run: |
          set -euo pipefail
          count="$(find build/ksq-1/full/debs -maxdepth 1 -type f -name '*.deb' | wc -l)"
          (( count > 0 ))

      - name: Prepare pinned KSQ-1 runner
        shell: bash
        run: bash scripts/ci/prepare-ksq-1-runner.sh

      - name: Build sources 061-080
        shell: bash
        run: bash scripts/ci/build-ksq-1-range.sh 61 80

      - name: Validate rebuilt KWallet PAM package
        shell: bash
        run: bash scripts/ci/validate-ksq-1-kwallet-pam.sh

      - name: Preserve KWallet PAM evidence
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-1-kwallet-pam-validation
          path: build/ksq-1/full/kwallet-pam-validation/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Preserve binary checkpoint 061-080
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-1-debs-061-080
          path: build/ksq-1/full/chunk-061-080/new-debs/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Preserve build evidence 061-080
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-1-evidence-061-080
          path: build/ksq-1/full/chunk-061-080/evidence/
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

  build-081-101:
    name: Build certified DAG sources 081-101
    needs: build-061-080
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore prior binary checkpoints
        uses: actions/download-artifact@v8
        with:
          pattern: aurora-ksq-1-debs-*
          path: build/ksq-1/full/debs
          merge-multiple: true

      - name: Verify prior binary state
        shell: bash
        run: |
          set -euo pipefail
          count="$(find build/ksq-1/full/debs -maxdepth 1 -type f -name '*.deb' | wc -l)"
          (( count > 0 ))

      - name: Prepare pinned KSQ-1 runner
        shell: bash
        run: bash scripts/ci/prepare-ksq-1-runner.sh

      - name: Build sources 081-101
        shell: bash
        run: bash scripts/ci/build-ksq-1-range.sh 81 101

      - name: Preserve binary checkpoint 081-101
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-1-debs-081-101
          path: build/ksq-1/full/chunk-081-101/new-debs/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Preserve build evidence 081-101
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-1-evidence-081-101
          path: build/ksq-1/full/chunk-081-101/evidence/
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

  validate-full-build:
    name: Validate complete 101-source build set
    needs: build-081-101
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore all binary checkpoints
        uses: actions/download-artifact@v8
        with:
          pattern: aurora-ksq-1-debs-*
          path: build/ksq-1/full/debs
          merge-multiple: true

      - name: Restore all range evidence
        uses: actions/download-artifact@v8
        with:
          pattern: aurora-ksq-1-evidence-*
          path: build/ksq-1/full/evidence-artifacts
          merge-multiple: false

      - name: Restore KWallet PAM evidence
        uses: actions/download-artifact@v8
        with:
          name: aurora-ksq-1-kwallet-pam-validation
          path: build/ksq-1/full/kwallet-validation

      - name: Prepare pinned KSQ-1 runner
        shell: bash
        run: bash scripts/ci/prepare-ksq-1-runner.sh

      - name: Validate complete build evidence
        shell: bash
        run: python3 scripts/ci/validate-ksq-1-full.py

      - name: Preserve complete build acceptance evidence
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-1-full-build-validation
          path: |
            build/ksq-0/closure-status.env
            build/ksq-0/build-order.tsv
            build/ksq-0/source-selections-applied.tsv
            build/ksq-0/build-dep-overrides-applied.tsv
            build/ksq-1/build-tool-versions.tsv
            build/ksq-1/environment/*.env
            build/ksq-1/environment/*.sha256
            build/ksq-1/full/full-build-manifest.tsv
            build/ksq-1/full/full-binary-packages.tsv
            build/ksq-1/full/full-debs.sha256
            build/ksq-1/full/full-build-status.env
            build/ksq-1/full/kwallet-validation/**
          if-no-files-found: error
          retention-days: 30
          overwrite: true

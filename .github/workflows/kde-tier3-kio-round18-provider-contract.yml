name: KDE Frameworks Tier 3 KIO Round 18 provider contract audit

on:
  pull_request:
    paths:
      - manifests/kde-tier3-kio-round18-provider-contract.json
      - docs/kde-tier3-kio-round18-provider-contract.md
      - scripts/run-kde-tier3-kio-round18-provider-contract.py
      - scripts/validate_kde_tier3_kio_round18_provider_contract.py
      - .github/workflows/kde-tier3-kio-round18-provider-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: KIO Round 18 Qt SVG provider contract
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate provider-contract definition
        run: python3 scripts/validate_kde_tier3_kio_round18_provider_contract.py

      - name: Determine audit capture mode
        id: mode
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          status=json.loads(Path("manifests/kde-tier3-kio-round18-provider-contract.json").read_text())["status"]
          print("capture=" + ("true" if status=="definition-pending-audit" else "false"))
          PY

      - name: Capture Resolute provider contract
        if: steps.mode.outputs.capture == 'true'
        run: python3 scripts/run-kde-tier3-kio-round18-provider-contract.py artifacts/kio-round18-provider-contract

      - name: Upload provider-contract evidence
        if: always() && steps.mode.outputs.capture == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kde-tier3-kio-round18-provider-contract
          path: artifacts/kio-round18-provider-contract
          if-no-files-found: error

      - name: Closed audit
        if: steps.mode.outputs.capture != 'true'
        run: echo 'Round 18 provider-contract audit already closed; recapture skipped.'

name: KDE Frameworks authoritative KVM sample proof

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  actions: read

jobs:
  frameworks-sample-proof:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.label.name == 'ci:frameworks-sample-proof' &&
           github.event.pull_request.head.repo.full_name == github.repository) }}
    name: KArchive sbuild sample on KVM guest
    runs-on: [self-hosted, linux, x64, supralinux, ubuntu-26.04, kvm, ephemeral]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download retained ECM PASS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '10298635300'
          github-token: ${{ github.token }}
          repository: SupraLINUX/SupraLINUX
          run-id: '34694951158'
          path: .work/retained-authoritative-frameworks/ecm

      - name: Download retained KArchive PASS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '10364726750'
          github-token: ${{ github.token }}
          repository: SupraLINUX/SupraLINUX
          run-id: '34884764702'
          path: .work/retained-authoritative-frameworks/karchive

      - name: Run authoritative Frameworks sample proof
        env:
          ECM_ARTIFACT_DIR: ${{ github.workspace }}/.work/retained-authoritative-frameworks/ecm
          KARCHIVE_ARTIFACT_DIR: ${{ github.workspace }}/.work/retained-authoritative-frameworks/karchive
        run: scripts/run-authoritative-frameworks-sample-proof.sh

      - name: Upload Frameworks sample evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authoritative-frameworks-sample-${{ github.sha }}
          path: evidence/authoritative-frameworks-sample/
          if-no-files-found: error
          retention-days: 90

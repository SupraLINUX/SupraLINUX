name: Aurora KSQ-1 technical acceptance bundle

on:
  push:
    branches:
      - feature/kde-stack-qualification
    paths:
      - '.github/ksq-1-acceptance-runs.env'

permissions:
  contents: read
  actions: read

jobs:
  consolidate:
    name: Revalidate and consolidate KSQ-1 evidence
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Load accepted run selection
        id: runs
        shell: bash
        run: |
          set -euo pipefail
          . .github/ksq-1-acceptance-runs.env
          [[ "${AURORA_KSQ_1_ACCEPTANCE_RUNS_STATUS}" == "ACTIVE" ]]
          for var in \
            AURORA_KSQ_1_CANDIDATE_RUN_ID \
            AURORA_KSQ_1_REFERENCE_RUN_ID \
            AURORA_KSQ_1_REPRO_RUN_ID \
            AURORA_KSQ_1_KSQ0_CLOSURE_RUN_ID \
            AURORA_KSQ_1_KSQ0_INVENTORY_RUN_ID; do
            [[ "${!var}" =~ ^[0-9]+$ ]]
          done
          [[ "${AURORA_KSQ_1_CANDIDATE_RUN_ID}" != "${AURORA_KSQ_1_REFERENCE_RUN_ID}" ]]
          echo "candidate_run_id=${AURORA_KSQ_1_CANDIDATE_RUN_ID}" >> "${GITHUB_OUTPUT}"
          echo "repro_run_id=${AURORA_KSQ_1_REPRO_RUN_ID}" >> "${GITHUB_OUTPUT}"
          echo "ksq0_closure_run_id=${AURORA_KSQ_1_KSQ0_CLOSURE_RUN_ID}" >> "${GITHUB_OUTPUT}"
          echo "ksq0_inventory_run_id=${AURORA_KSQ_1_KSQ0_INVENTORY_RUN_ID}" >> "${GITHUB_OUTPUT}"

      - name: Restore authoritative candidate DEBs
        uses: actions/download-artifact@v8
        with:
          pattern: aurora-ksq-1-debs-*
          path: build/ksq-1/full/debs
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.runs.outputs.candidate_run_id }}

      - name: Restore authoritative candidate range evidence
        uses: actions/download-artifact@v8
        with:
          pattern: aurora-ksq-1-evidence-*
          path: build/ksq-1/full/evidence-artifacts
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.runs.outputs.candidate_run_id }}

      - name: Restore candidate KWallet package gate
        uses: actions/download-artifact@v8
        with:
          name: aurora-ksq-1-kwallet-pam-validation
          path: build/ksq-1/full/kwallet-validation
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.runs.outputs.candidate_run_id }}

      - name: Restore original candidate full validation
        uses: actions/download-artifact@v8
        with:
          name: aurora-ksq-1-full-build-validation
          path: build/ksq-1/original-full-validation-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.runs.outputs.candidate_run_id }}

      - name: Restore reproducibility acceptance
        uses: actions/download-artifact@v8
        with:
          name: aurora-ksq-1-reproducibility-validation
          path: build/ksq-1/repro/acceptance-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.runs.outputs.repro_run_id }}

      - name: Restore dedicated reproducibility proofs
        uses: actions/download-artifact@v8
        with:
          pattern: aurora-ksq-1-repro-order-*
          path: build/ksq-1/repro/dedicated-proofs
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.runs.outputs.repro_run_id }}

      - name: Restore KSQ-0 closure regression evidence
        uses: actions/download-artifact@v8
        with:
          name: aurora-ksq-0-dependency-closure
          path: build/ksq-1/ksq0-regression/closure
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.runs.outputs.ksq0_closure_run_id }}

      - name: Restore KSQ-0 inventory regression evidence
        uses: actions/download-artifact@v8
        with:
          pattern: aurora-ksq-0-source-inventory-*
          path: build/ksq-1/ksq0-regression/inventory
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.runs.outputs.ksq0_inventory_run_id }}

      - name: Normalize downloaded acceptance evidence
        shell: bash
        run: |
          set -euo pipefail

          one_file() {
            local root="$1" name="$2" result
            result="$(find "${root}" -type f -name "${name}" -print)"
            [[ "$(printf '%s\n' "${result}" | sed '/^$/d' | wc -l)" -eq 1 ]]
            printf '%s\n' "${result}"
          }

          mkdir -p build/ksq-1/repro/acceptance
          cp -a "$(one_file build/ksq-1/repro/acceptance-artifact reproducibility-status.env)" \
            build/ksq-1/repro/acceptance/reproducibility-status.env
          cp -a "$(one_file build/ksq-1/repro/acceptance-artifact ksq-1-repro-runs.env)" \
            build/ksq-1/repro/acceptance/repro-runs.env
          cp -a "$(one_file build/ksq-1/repro/acceptance-artifact reproducibility-manifest.tsv)" \
            build/ksq-1/repro/acceptance/reproducibility-manifest.tsv

          mkdir -p build/ksq-1/original-full-validation
          for name in full-build-manifest.tsv full-binary-packages.tsv full-debs.sha256 full-build-status.env; do
            cp -a "$(one_file build/ksq-1/original-full-validation-artifact "${name}")" \
              "build/ksq-1/original-full-validation/${name}"
          done

          mkdir -p build/ksq-1/ksq0-normalized/inventory
          for name in closure-status.env unresolved.tsv source-selections-applied.tsv build-dep-overrides-applied.tsv; do
            cp -a "$(one_file build/ksq-1/ksq0-regression/closure "${name}")" \
              "build/ksq-1/ksq0-normalized/${name}"
          done
          for name in release-sets.tsv plasma-6.7.4-sources.tsv frameworks-6.29.0-sources.tsv aurora-package-roots.tsv validated-source-urls.tsv; do
            cp -a "$(one_file build/ksq-1/ksq0-regression/inventory "${name}")" \
              "build/ksq-1/ksq0-normalized/inventory/${name}"
          done
          echo AURORA_KSQ_1_ACCEPTANCE_DOWNLOADS_NORMALIZED

      - name: Prepare pinned KSQ-1 validation state
        shell: bash
        run: bash scripts/ci/prepare-ksq-1-runner.sh

      - name: Independently revalidate complete candidate build evidence
        shell: bash
        run: python3 scripts/ci/validate-ksq-1-full.py

      - name: Validate combined KSQ-1 technical acceptance
        shell: bash
        run: python3 scripts/ci/validate-ksq-1-technical-acceptance.py

      - name: Stage and self-verify complete acceptance bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle=build/ksq-1/technical-acceptance-bundle
          rm -rf "${bundle}"
          mkdir -p \
            "${bundle}/metadata" \
            "${bundle}/repository" \
            "${bundle}/candidate/debs" \
            "${bundle}/candidate/range-evidence" \
            "${bundle}/candidate/kwallet-validation" \
            "${bundle}/candidate/original-full-validation-artifact" \
            "${bundle}/candidate/revalidated-full" \
            "${bundle}/reproducibility/acceptance-artifact" \
            "${bundle}/reproducibility/dedicated-proofs" \
            "${bundle}/ksq0/regression" \
            "${bundle}/ksq0/normalized"

          git diff --quiet
          git diff --cached --quiet
          git status --porcelain=v1 --untracked-files=no > "${bundle}/metadata/git-status.txt"
          [[ ! -s "${bundle}/metadata/git-status.txt" ]]
          git rev-parse HEAD > "${bundle}/metadata/acceptance-head.txt"
          git archive --format=tar.gz --output="${bundle}/repository/repository-snapshot.tar.gz" HEAD

          cp -a .github/ksq-1-acceptance-runs.env "${bundle}/metadata/"
          cp -a build/ksq-1/technical-acceptance/technical-acceptance-status.env "${bundle}/metadata/"
          cp -a build/ksq-1/full/debs/. "${bundle}/candidate/debs/"
          cp -a build/ksq-1/full/evidence-artifacts/. "${bundle}/candidate/range-evidence/"
          cp -a build/ksq-1/full/kwallet-validation/. "${bundle}/candidate/kwallet-validation/"
          cp -a build/ksq-1/original-full-validation-artifact/. "${bundle}/candidate/original-full-validation-artifact/"
          cp -a build/ksq-1/repro/acceptance-artifact/. "${bundle}/reproducibility/acceptance-artifact/"
          cp -a build/ksq-1/repro/dedicated-proofs/. "${bundle}/reproducibility/dedicated-proofs/"
          cp -a build/ksq-1/ksq0-regression/. "${bundle}/ksq0/regression/"
          cp -a build/ksq-1/ksq0-normalized/. "${bundle}/ksq0/normalized/"

          for name in full-build-manifest.tsv full-binary-packages.tsv full-debs.sha256 full-build-status.env; do
            [[ -f "build/ksq-1/full/${name}" ]]
            cp -a "build/ksq-1/full/${name}" "${bundle}/candidate/revalidated-full/${name}"
          done

          (
            cd "${bundle}"
            find . -type f ! -name bundle-files.sha256 -print0 \
              | sort -z \
              | xargs -0 sha256sum > bundle-files.sha256
            sha256sum -c bundle-files.sha256
          )
          echo AURORA_KSQ_1_ACCEPTANCE_BUNDLE_SELF_VERIFIED

      - name: Preserve self-contained KSQ-1 technical acceptance bundle
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-1-technical-acceptance
          path: build/ksq-1/technical-acceptance-bundle/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

name: Temporary Batch 1 closure transform

on:
  push:
    branches: [tmp-batch1-closure]

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tmp-batch1-closure
      - name: Synchronize canonical Tier 1 manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          campaign = json.loads((root/'manifests/kde-tier1-package-campaign.json').read_text())
          tier1_path = root/'manifests/kde-frameworks-tier1.json'
          tier1 = json.loads(tier1_path.read_text())
          by_id = {n['id']: n for n in tier1['nodes']}

          for node_id, c in campaign['nodes'].items():
              n = by_id[node_id]
              evidence = []
              for item in c['evidence']:
                  item = dict(item)
                  if item.get('result') == 'PASS':
                      item['files'] = dict(c['pass_files'])
                  evidence.append(item)
              n['packaging'] = {
                  'state': 'PASS',
                  'package_version': c['package_version'],
                  'claim': 'hosted-clean-package-preflight',
                  'authoritative': False,
                  'downstream_eligible': True,
                  'evidence': evidence,
              }
              n['state'] = 'PASS'

          tier1_path.write_text(json.dumps(tier1, indent=2) + '\n')

          dag_path = root/'manifests/kde-dag.json'
          dag = json.loads(dag_path.read_text())
          ubuntu_reference = {
              'kcodecs': '6.24.0-0ubuntu1',
              'kdbusaddons': '6.24.0-0ubuntu1',
              'threadweaver': '6.24.0-0ubuntu1',
          }
          for node_id, c in campaign['nodes'].items():
              evidence = []
              for item in c['evidence']:
                  x = {'type': 'github-actions-run', **item}
                  evidence.append(x)
              dag['nodes'][node_id] = {
                  'tier': 1,
                  'upstream_version': c['upstream_version'],
                  'source_url': c['source_url'],
                  'source_sha256': c['source_sha256'],
                  'source_evidence': 'https://kde.org/info/kde-frameworks-6.30.0/',
                  'source_authority': 'kde-upstream',
                  'package_provider': 'supralinux',
                  'source_package': c['source_package'],
                  'binary_packages': [x['name'] for x in c['binary_contracts']],
                  'package_version': c['package_version'],
                  'ubuntu_reference_version': ubuntu_reference[node_id],
                  'depends_on': ['extra-cmake-modules'],
                  'state': 'PASS',
                  'claim': 'hosted-clean-package-preflight',
                  'authoritative': False,
                  'downstream_eligible': True,
                  'evidence': evidence,
                  'pass_files': dict(c['pass_files']),
              }
          dag['ci_scope_incidents'] = campaign.get('ci_scope_incidents', [])
          dag_path.write_text(json.dumps(dag, indent=2) + '\n')
          PY
          python3 -m json.tool manifests/kde-frameworks-tier1.json >/dev/null
          python3 -m json.tool manifests/kde-dag.json >/dev/null
          git config user.name 'SupraLINUX CI'
          git config user.email 'ci@supralinux.invalid'
          git add manifests/kde-frameworks-tier1.json manifests/kde-dag.json
          if ! git diff --cached --quiet; then
            git commit -m 'tmp: synchronize Batch 1 canonical manifests'
            git push origin HEAD:tmp-batch1-closure
          fi

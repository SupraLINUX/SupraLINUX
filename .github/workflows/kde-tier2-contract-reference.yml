name: KDE Frameworks Tier 2 contract reference

on:
  pull_request:
    paths:
      - manifests/kde-tier2-package-contracts.json
      - scripts/run-kde-tier2-contract-reference-snapshot.sh
      - scripts/kde-tier2-contract-reference-needed.sh
      - .github/workflows/kde-tier2-contract-reference.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-reference:
    name: Capture Ubuntu/Debian Tier 2 contract references
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Determine scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"; exit 0
          fi
          if [[ "${EVENT_ACTION}" == "synchronize" ]]; then before="${EVENT_BEFORE}"; after="${EVENT_AFTER}"; else before="${PR_BASE_SHA}"; after="${PR_HEAD_SHA}"; fi
          for sha in "${before}" "${after}"; do
            [[ "${sha}" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
            git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "${sha}"
          done
          if scripts/kde-tier2-contract-reference-needed.sh "${before}" "${after}"; then echo "run=true" >> "${GITHUB_OUTPUT}"; else rc=$?; [[ "${rc}" -eq 1 ]] || exit "${rc}"; echo "run=false" >> "${GITHUB_OUTPUT}"; fi
      - name: Capture technical packaging references
        if: steps.scope.outputs.run == 'true'
        run: scripts/run-kde-tier2-contract-reference-snapshot.sh
      - name: Upload contract-reference evidence
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kde-tier2-contract-reference-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/kde-tier2-contract-reference/
          if-no-files-found: error
          retention-days: 30
      - name: Report intentional skip
        if: steps.scope.outputs.run == 'false'
        run: echo 'Tier 2 contract-reference capture intentionally skipped.'

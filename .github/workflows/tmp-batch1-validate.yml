name: Temporary Batch 1 closure validation

on:
  push:
    branches: [tmp-batch1-closure]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tmp-batch1-closure
      - name: Validate closure
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          bash -n scripts/kde-tier1-package-preflight-needed.sh
          shellcheck scripts/kde-tier1-package-preflight-needed.sh
          python3 scripts/validate_kde_tier1.py
          python3 scripts/validate_kde_tier1_package_batch1.py
          python3 scripts/validate_kde_tier1_packaging_reference.py
          python3 scripts/validate_kde_tier1_packaging_tree.py

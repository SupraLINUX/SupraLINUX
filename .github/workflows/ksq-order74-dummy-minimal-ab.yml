name: Aurora KSQ order74 minimal direct-vs-dummy A/B

on:
  push:
    branches: [feature/kde-stack-qualification]
    paths:
      - '.github/workflows/ksq-order74-dummy-minimal-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-vs-dummy:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Resolve exact libcups2-dev relation in direct and sbuild-style contexts
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^VERSION_ID="26\.04(\.1)?"$' /etc/os-release
          test "$(dpkg --print-architecture)" = amd64
          out=build/ksq-order74-dummy-minimal-ab
          mkdir -p "$out"
          apt-get --version | head -n1 | tee "$out/apt-version.txt"
          grep -qx 'apt 3.2.0 (amd64)' "$out/apt-version.txt"
          sudo apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends ubuntu-keyring

          snapshot=20260829T022000Z
          make_root() {
            local root="$1"
            mkdir -p "$root/lists/partial" "$root/archives/partial" "$root/sources.list.d"
            : > "$root/status"
            : > "$root/sources.list"
            cat > "$root/sources.list.d/ubuntu.sources" <<SOURCES
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu
          Suites: resolute resolute-updates resolute-backports
          Components: main universe restricted multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          Snapshot: ${snapshot}

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu
          Suites: resolute-security
          Components: main universe restricted multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          Snapshot: ${snapshot}
          SOURCES
          }
          opts_for() {
            local root="$1"
            printf '%s\n' \
              '-o' 'APT::Architecture-Variants=' \
              '-o' "Dir::Etc::sourcelist=$root/sources.list" \
              '-o' "Dir::Etc::sourceparts=$root/sources.list.d" \
              '-o' "Dir::State::lists=$root/lists" \
              '-o' "Dir::State::status=$root/status" \
              '-o' "Dir::Cache::archives=$root/archives" \
              '-o' 'APT::Get::List-Cleanup=0' \
              '-o' 'APT::Sandbox::User=root'
          }

          direct="$RUNNER_TEMP/direct"
          dummy="$RUNNER_TEMP/dummyroot"
          make_root "$direct"
          make_root "$dummy"
          mapfile -t direct_opts < <(opts_for "$direct")
          mapfile -t dummy_opts < <(opts_for "$dummy")
          sudo apt-get "${direct_opts[@]}" -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update > "$out/direct-update.log" 2>&1
          sudo apt-get "${dummy_opts[@]}" -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update > "$out/dummy-update.log" 2>&1

          APT_CONFIG=/dev/null apt-config -o APT::Architecture-Variants= dump \
            | grep -E '^(APT::Architecture|APT::Architecture-Variants|APT::Install-Recommends)' \
            | tee "$out/apt-policy.txt" || true

          sudo apt-get "${direct_opts[@]}" --print-uris --yes install 'libcups2-dev=2.4.16-1ubuntu1.3' \
            > "$out/direct.print-uris" 2> "$out/direct.stderr"
          sudo apt-get "${direct_opts[@]}" --simulate --yes install 'libcups2-dev=2.4.16-1ubuntu1.3' \
            > "$out/direct.simulate" 2> "$out/direct-sim.stderr"

          mkdir -p "$RUNNER_TEMP/dummypkg/DEBIAN"
          cat > "$RUNNER_TEMP/dummypkg/DEBIAN/control" <<'CONTROL'
          Package: sbuild-build-depends-main-dummy
          Version: 0.invalid.0
          Architecture: amd64
          Maintainer: SupraLINUX probe <build@supralinux.invalid>
          Depends: libcups2-dev (= 2.4.16-1ubuntu1.3)
          Description: controlled sbuild-style Build-Depends dummy
          CONTROL
          dpkg-deb --build "$RUNNER_TEMP/dummypkg" "$RUNNER_TEMP/sbuild-build-depends-main-dummy.deb" > "$out/dpkg-deb.log"
          dpkg-deb -f "$RUNNER_TEMP/sbuild-build-depends-main-dummy.deb" > "$out/dummy-control.txt"
          sudo apt-get "${dummy_opts[@]}" --print-uris --yes install "$RUNNER_TEMP/sbuild-build-depends-main-dummy.deb" \
            > "$out/dummy.print-uris" 2> "$out/dummy.stderr"
          sudo apt-get "${dummy_opts[@]}" --simulate --yes install "$RUNNER_TEMP/sbuild-build-depends-main-dummy.deb" \
            > "$out/dummy.simulate" 2> "$out/dummy-sim.stderr"

          python3 - "$snapshot" "$out" <<'PY'
          import shlex, sys
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          snapshot, out = sys.argv[1], Path(sys.argv[2])
          marker=f'/ubuntu/{snapshot}/'
          targets={
            'libjpeg-turbo8-dev':'pool/main/libj/libjpeg-turbo/libjpeg-turbo8-dev_2.1.5-4ubuntu4_amd64.deb',
            'libjpeg8-dev':'pool/main/libj/libjpeg8-empty/libjpeg8-dev_8c-2ubuntu12_amd64.deb',
            'libjpeg-dev':'pool/main/libj/libjpeg8-empty/libjpeg-dev_8c-2ubuntu12_amd64.deb',
          }
          rows=[]
          for label in ('direct','dummy'):
              paths=set()
              for raw in (out/f'{label}.print-uris').read_text().splitlines():
                  if not raw.startswith("'"):
                      continue
                  fields=shlex.split(raw)
                  if not fields:
                      continue
                  path=unquote(urlparse(fields[0]).path)
                  if marker in path:
                      paths.add(path.split(marker,1)[1])
              for pkg, rel in targets.items():
                  rows.append((label,pkg,'yes' if rel in paths else 'no'))
          text='context\tpackage\tselected\n'+''.join('\t'.join(r)+'\n' for r in rows)
          (out/'provider-selection.tsv').write_text(text)
          print(text,end='')
          PY

          {
            echo AURORA_KSQ_ORDER74_MINIMAL_AB_STATUS=PASS
            echo AURORA_KSQ_ORDER74_MINIMAL_AB_SNAPSHOT=$snapshot
            echo AURORA_KSQ_ORDER74_MINIMAL_AB_APT=3.2.0
            echo AURORA_KSQ_ORDER74_DIRECT_RELATION='libcups2-dev=2.4.16-1ubuntu1.3'
            echo AURORA_KSQ_ORDER74_DUMMY_DEPENDS='libcups2-dev (= 2.4.16-1ubuntu1.3)'
          } | tee "$out/status.env"

      - name: Upload exact A/B evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aurora-ksq-order74-minimal-direct-vs-dummy-ab
          path: build/ksq-order74-dummy-minimal-ab/
          if-no-files-found: error
          retention-days: 30
